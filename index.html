'For purposes of the dividends, is J Corp a resident or nonresident foreign corporation? Is the branch profit remittance tax due?',
[['Answer','J Corp is taxed as a nonresident foreign corporation on the dividends, and no branch profit remittance tax is due.'],
 ['Basis','Marubeni v. CIR: when a foreign corporation transacts business in the Philippines independently of its branch, the transaction is that of the head office, not the branch. Passive income is not treated as branch profits unless effectively connected with the branch\'s business (Sec. 28(A)(4)).'],
 ['Application','The investment was made by the head office, so the dividends are the head office\'s income as a nonresident foreign corporation: final tax on intercorporate dividends under Sec. 28(B)(5)(b) or the treaty rate. Since they are not profits remitted by the branch, branch profit remittance tax does not apply.']],
['Transaction of head office, not branch','NRFC as to the dividends','Not effectively connected, so no BPRT'],
[C.s22HI,C.s28B]),

E('IT-D','Swiss sales representative','Original · CIR v. Baier-Nickel',
'Juliane, a German resident, is president of a Philippine corporation and receives commissions as its sales representative. She claims a refund of tax withheld, saying she performed her sales activities in Germany, and submits only her own appointment letter and the payment records.',
'Should the refund be granted?',
[['Answer','No, unless she proves where she performed the services.'],
 ['Basis','A nonresident alien is taxed only on Philippine-source income. For services, the source is where the services are performed (Sec. 42(A)(3); CIR v. Baier-Nickel). Refunds are construed strictly against the claimant, who bears the burden of proof.'],
 ['Application','Her appointment letter and payment records show only that she was paid, not where she worked. In Baier-Nickel the refund was denied for failure to prove that the services were performed abroad.']],
['Source of service income: place of performance','Burden is on the refund claimant','Refunds strictly construed'],
[C.s42,C.s23]),

// ===== IT-A / IT-B / IT-C =====
E('IT-A','Pedro\'s "ratting" gambling den','2023 Bar · QuAMTO',
'Pedro ran an illegal gambling den and earned millions, but filed no return. He was charged under Sec. 255 for failure to file. He argues the profits are not income and that declaring them would violate his right against self-incrimination.',
'Is Pedro\'s argument tenable?',
[['Answer','No.'],
 ['Basis','Gross income means all income derived from whatever source (Sec. 32(A)). Income from illegal activities is realized gain and is taxable.'],
 ['Application','Pedro, a resident citizen, must file and report it. Requiring a return of income does not compel him to state its illegal source as an admission, so the duty to file does not violate the right against self-incrimination.']],
['All income from whatever source, Sec. 32(A)','Illegal income is taxable','No violation of self-incrimination'],
[C.s32A]),

E('IT-A','Mr. Gipit\'s cancelled debt','2014 Bar · QuAMTO',
'Mr. Gipit borrowed P100,000 from Mr. Maunawain. Before the first installment, Gipit cleaned Maunawain\'s office building, and Maunawain cancelled P75,000 of the debt as payment. Gipit says he received no payment, so he has no income.',
'Is Mr. Gipit correct?',
[['Answer','No.'],
 ['Basis','If a creditor cancels a debt in consideration of services rendered by the debtor, the debtor realizes income to that extent as compensation (Sec. 50, RR 2-40). Compensation is taxable in whatever form paid (Sec. 32(A)(1)).'],
 ['Application','The P75,000 cancellation is compensation for the cleaning services and is taxable income.']],
['Debt cancellation in exchange for services is compensation','Income in whatever form paid'],
[C.s32A]),

E('IT-A','Travel agency\'s hotel room charges','Original · CIR v. Tours Specialists',
'TSI, a travel agency, receives money from foreign tour operators to pay Philippine hotels for the rooms of their tourists. TSI pays the hotels and keeps only its own service fee. The BIR included the hotel charges in TSI\'s gross receipts.',
'Is the BIR correct?',
[['Answer','No.'],
 ['Basis','Gross receipts do not include money entrusted to the taxpayer that does not belong to it and does not redound to its benefit; no specific exempting law is needed (CIR v. Tours Specialists).'],
 ['Application','The hotel charges were held in trust and passed on to the hotels. Only TSI\'s own fees are its income.']],
['Money held in trust is not income','No law needed to exclude it','Only the agency\'s own fees are taxable'],
[]),

E('IT-A','Golf club membership dues','Original · ANPC v. BIR',
'A non-profit golf club collects monthly dues and assessments from members, used solely for maintaining the course and facilities. A revenue regulation treats these as income subject to income tax and VAT.',
'Are the dues income?',
[['Answer','No.'],
 ['Basis','Capital is a fund; income is a flow. To be income, there must be a realized gain. In ANPC v. BIR (2019), membership fees and assessment dues of recreational clubs used for upkeep were held to be contributions to the club\'s capital, not income.'],
 ['Application','The dues only replenish the club\'s funds for its operations; the club gains nothing. A regulation treating them as income goes beyond the law. However, income the club earns from transactions with non-members or for-profit activities would be taxable.']],
['Capital vs. income','Realized gain required','Dues are capital infusions','Regulation cannot expand the law'],
[C.s32A]),

E('IT-B','Royalty income of a licensing company','Original · Iconic Beverages v. CIR',
'IB Corp\'s primary purpose under its articles is to develop and license trademarks, and nearly all its revenue comes from royalties from licensees. It paid 20% final tax on the royalties. The BIR assessed it regular corporate income tax.',
'Are the royalties passive income subject to final tax?',
[['Answer','No. They are active business income subject to regular corporate income tax.'],
 ['Basis','Passive income is income generated by assets without active pursuit of business. Income earned in the active pursuit of the corporation\'s primary purpose is not passive (Iconic Beverages v. CIR, CTA 2015).'],
 ['Application','Licensing trademarks is IB Corp\'s business, so the royalties form part of gross income taxed at the regular rate, with deductions allowed. The 20% final tax it paid may be credited or refunded.']],
['Passive vs. active income test','Look at the primary purpose','Royalties may be active income'],
[C.s32A]),

E('IT-C','Gross taxation of compensation earners','Original · Sison v. Ancheta',
'A law taxes compensation earners on gross income at graduated rates while self-employed professionals and businessmen are taxed on net income. A businessman argues the law is unconstitutional because it treats taxpayers differently and is not a global system.',
'Rule on the challenge, and explain the difference between global and schedular systems.',
[['Answer','The law is valid.'],
 ['Equal protection','Sison v. Ancheta: compensation earners have practically no overhead in earning income, while professionals and businessmen incur expenses. This is a substantial distinction that justifies different tax bases; the State may select and classify the subjects of taxation.'],
 ['Global vs. schedular','A global system adds all income together and taxes it under one set of rates. A schedular system taxes different types of income separately at different rates. The Constitution does not require a purely global system; the Philippines uses a mixed, semi-schedular system, more schedular for individuals and more global for corporations.']],
['Substantial distinction: overhead','State may classify','Defines global and schedular','Philippine system is mixed'],
[C.a6s28_1]),

// ===== IV-A: INHERENT LIMITATIONS =====
E('IV-A','Copra storage fee','2009 Bar · QuAMTO',
'The Municipality of Sampaloc, Quezon imposed a storage fee of ten centavos per 100 kilos of copra deposited in any bodega in the municipality. MMC, a Makati manufacturer with a warehouse in Sampaloc, paid under protest and sued for refund.',
'Is the ordinance valid?',
[['Answer','Yes.'],
 ['Basis','Municipalities may impose reasonable fees and charges for regulation, commensurate with the cost of regulation, inspection and licensing (Sec. 147, LGC). The purpose is regulatory, under the general welfare clause.'],
 ['Application','Warehouses storing copra are a fire hazard and a proper subject of regulation. A modest storage fee for surveillance and inspection is a valid regulatory fee.']],
['Regulatory fee, not revenue tax','Commensurate with cost of regulation','General welfare / police power'],
[C.a10s5]),

E('IV-A','Market stall fees collected by a private firm','1989 Bar · QuAMTO',
'A Quezon City ordinance on market stalls created a market committee and entrusted the collection of market stall fees to a private corporation.',
'Does entrusting collection to a private corporation destroy the public purpose of the ordinance?',
[['Answer','Yes.'],
 ['Basis','The LGC prohibits LGUs from letting to any private person the collection of local taxes, fees, charges and other impositions (Sec. 130(c), LGC).'],
 ['Application','Part of the fees would go to the private corporation as payment for its services, so public funds would be used for a private purpose.']],
['Sec. 130(c), LGC','Diversion of public funds to private benefit','Public purpose limitation'],
[]),

E('IV-A','Can Congress abolish LGU taxing power?','2003 Bar · QuAMTO',
'A bill seeks to abolish the power of local government units to impose taxes.',
'May Congress do so under the 1987 Constitution?',
[['Answer','No.'],
 ['Basis','Sec. 5, Art. X directly grants each LGU the power to create its own sources of revenue and to levy taxes, fees and charges. Congress cannot abolish what the Constitution grants; it may only provide guidelines and limitations consistent with local autonomy.']],
['Constitutional grant to LGUs','Congress may only set guidelines and limitations'],
[C.a10s5]),

E('IV-A','Makati "elevator tax"','2003 Bar · QuAMTO',
'To raise money for maintaining the new Makati City Hall, the Mayor ordered collection of P1 per elevator ride during peak hours.',
'Is the elevator tax valid?',
[['Answer','No.'],
 ['Basis','The power to impose a tax, fee or charge under the LGC is exercised by the sanggunian through an appropriate ordinance (Sec. 132, LGC). Taxation is legislative.'],
 ['Application','The Mayor alone, an executive official, cannot impose it.']],
['Taxing power is legislative','Sanggunian via ordinance, Sec. 132 LGC','Mayor cannot impose'],
[]),

E('IV-A','Revenue regulation using gross income as base','1994 Bar · QuAMTO',
'The Secretary of Finance, on recommendation of the CIR, issued a revenue regulation making gross income the tax base for corporations doing business in the Philippines, while the law taxes them on net income.',
'Is the regulation valid?',
[['Answer','No.'],
 ['Basis','Determining the amount of tax, including the tax base, is a legislative power that cannot be delegated. Regulations must only fill in the details of the law and cannot amend it (CIR v. San Miguel, 2019; Subic Bay Chamber v. DOF, 2025).'],
 ['Application','Taxing gross income without deductions changes the amount of tax. This is legislation, not implementation.']],
['Non-delegability of the power to fix the tax base','Regulation cannot amend the law'],
[]),

E('IV-A','Municipal tax on transfer of real property','1991 Bar · QuAMTO',
'The Municipality of Malolos imposed a 1/4 of 1% tax on sales of real property in the municipality. X, who sold inherited land and paid capital gains tax to the BIR, refused to pay, arguing only the national government may tax the sale. The municipality invoked Sec. 5, Art. X.',
'Resolve the controversy.',
[['Answer','The ordinance is void.'],
 ['Basis','The LGC authorizes only provinces and cities to impose a tax on the transfer of real property ownership (Secs. 135 and 151). Municipalities may not levy taxes that provinces are specifically authorized to levy.'],
 ['Application','The constitutional grant under Sec. 5, Art. X is subject to the limitations Congress provides, and the LGC withholds this tax from municipalities. Payment of capital gains tax to the BIR is a separate, national tax.']],
['LGU taxing power subject to limits set by Congress','Transfer tax: provinces and cities only'],
[C.a10s5]),

E('IV-A','Tax on Filipinos\' real property abroad','2025 Bar · QuAMTO',
'Congress enacted a law imposing real property tax on immovable property owned by Filipinos, whether in or outside the Philippines. X, a Filipino in California, challenges it. The OSG says the State may tax citizens and their property wherever located.',
'Decide.',
[['Answer','The law is invalid insofar as it taxes real property outside the Philippines.'],
 ['Basis','Territoriality is an inherent limitation: the State may tax only persons, property and activities within its jurisdiction. Real property may be taxed only by the State where it is located, regardless of the owner\'s citizenship or residence.'],
 ['Distinction','The State may tax citizens on income from abroad because income tax is a tax on the exercise of a right by a citizen, but a property tax attaches to the property itself.']],
['Territoriality / situs','Real property taxed only where located','Distinguish income tax on citizens'],
[]),

E('IV-A','Tax to rescue a private fertilizer company','Original · Planters Products v. Fertiphil',
'A law imposes a P10 levy on every bag of fertilizer sold, with the proceeds remitted directly to PFI, a private corporation, to pay its debts and make it viable. A fertilizer distributor challenges the levy.',
'Is the levy valid?',
[['Answer','No.'],
 ['Basis','Taxes may be levied only for a public purpose. In Planters Products v. Fertiphil, a levy whose proceeds went to the capital accumulation and debt servicing of a private corporation was struck down; it was neither a valid tax nor a valid exercise of police power.'],
 ['Application','The levy primarily benefits a private company. Any benefit to the public is incidental.']],
['Public purpose test','Proceeds to a private entity','Planters Products v. Fertiphil'],
[]),

E('IV-A','Real property tax on a government agency\'s leased land','Original · MWSS v. CBAA; LRTA v. Pasay',
'City Y assessed real property tax on all the properties of a government water authority, including land leased to a private concessionaire.',
'Is the water authority liable?',
[['Answer','No, but the concessionaire is liable for the tax on the portions it actually uses.'],
 ['Basis','A government instrumentality vested with corporate powers is not a GOCC and is exempt from real property tax; LGUs cannot tax the national government and its instrumentalities (Sec. 133(o), LGC). When beneficial use is given to a taxable private person, the tax liability attaches to that person (MWSS v. CBAA, 2021; LRTA v. City of Pasay, 2022; Philippine Heart Center v. Quezon City, 2020).']],
['Instrumentality with corporate powers is exempt','Sec. 133(o), LGC','Beneficial use shifts liability to private lessee'],
[]),

E('IV-A','US IRS request for bank information','2012 Bar · QuAMTO',
'The US IRS asked the CIR to obtain information from a Philippine bank on the deposits of a US citizen residing here who is under IRS examination, under the RP-US tax treaty.',
'Should the CIR agree?',
[['Answer','Yes.'],
 ['Basis','Under Sec. 6(F)(3) of the NIRC as amended by RA 10021, the CIR may inquire into bank deposits of a specific taxpayer subject of a request from a foreign tax authority under a tax convention to which the Philippines is a party. This is in keeping with international comity.'],
 ['Note','The request must show the information required by law, such as the identity of the person, the tax purpose, and that the foreign authority exhausted its own means.']],
['Sec. 6(F), as amended by RA 10021','International comity / exchange of information','Requisites of the request'],
[]),

E('IV-A','Treaty rate on dividends','2009 Bar · QuAMTO',
'ABCD, a domestic corporation, withheld 30% and 35% tax on dividends paid to its US individual and corporate shareholders. The RP-US treaty fixes the rate at 25%. ABCD claimed a refund of the excess; the CIR denied it.',
'Is ABCD correct?',
[['Answer','Yes, if it proves the treaty applies.'],
 ['Basis','A tax treaty prevails over the general provisions of the Tax Code; obligations under treaties must be performed in good faith (pacta sunt servanda; Deutsche Bank v. CIR). Tax treaties are accepted limitations on the taxing power under international comity.'],
 ['Application','ABCD must show the treaty exists, that it applies to the shareholders, and that it withheld at higher rates. The excess over 25% is refundable. As withholding agent, ABCD has standing to claim the refund (CIR v. Procter & Gamble).']],
['Treaty prevails over the NIRC','Pacta sunt servanda','Withholding agent may claim refund'],
[]),

E('IV-A','Executive agreement exempting interest','1992 Bar · QuAMTO',
'The President and the Prime Minister of Japan entered into an executive agreement on a loan facility, stipulating that interest on loans by private Japanese banks to Philippine banks shall be exempt from Philippine income tax.',
'Is the exemption valid?',
[['Answer','Yes.'],
 ['Basis','An executive agreement has the force and effect of a treaty, and taxation is subject to international comity. Sec. 32(B)(5) excludes income exempt under a treaty obligation binding on the Government. In Mitsubishi v. CIR (2017), an Exchange of Notes was held to validly create a tax assumption obligation.']],
['Executive agreement has force of a treaty','International comity','Mitsubishi v. CIR'],
[]),

// ===== IV-B: CONSTITUTIONAL LIMITATIONS =====
E('IV-B','Transport tax on private vehicles','2017 Bar · QuAMTO',
'A law imposes a 5% transport tax on purchases of private vehicles and on the fair market value of existing private vehicles, but exempts public utility vehicles and the Government. Private vehicle owners sue on equal protection grounds.',
'Rule on the validity of the law.',
[['Answer','The law is valid.'],
 ['Basis','Uniformity and equal protection do not prohibit classification. A classification is valid if it rests on substantial distinctions, is germane to the purpose of the law, applies to present and future conditions, and applies equally to all members of the class (Tan v. Del Rosario; British American Tobacco v. Camacho).'],
 ['Application','Private vehicles differ substantially from public utility vehicles, which serve the commuting public; the distinction is germane to easing traffic. The tax applies to all private vehicle owners alike. Exempting the Government is consistent with its inherent immunity.']],
['Four requisites of valid classification','Substantial distinction: private vs. public utility','Government exemption is proper'],
[C.a6s28_1]),

E('IV-B','VAT exemption only for doctors and lawyers','2004 Bar · QuAMTO',
'A law exempted doctors and lawyers from VAT. Other professionals sued, saying they were denied equal protection.',
'Is the suit meritorious?',
[['Answer','Yes.'],
 ['Basis','Professionals form one class. Singling out some members of a class for an exemption without a substantial distinction violates equal protection and uniformity (Ormoc Sugar v. Treasurer of Ormoc City).'],
 ['Application','There is no real difference between doctors and lawyers and other professionals that is germane to the purpose of VAT, which is meant to be neutral within a class.']],
['Same class, unequal treatment','No substantial distinction','Ormoc Sugar'],
[C.a6s28_1]),

E('IV-B','Incentives only inside the Subic "secured area"','2000 Bar · QuAMTO',
'An executive order, issued pursuant to law, granted tax and duty incentives only to businesses and residents within the "secured area" of the Subic Special Economic Zone, not to those in the zone but outside it.',
'Does it violate equal protection?',
[['Answer','No.'],
 ['Basis','Tiu v. CA: there are substantial differences between big investors enticed into the secured area and businesses outside it. The classification is germane to attracting investment, is not limited to existing conditions, and applies equally to all within the secured area. Equal protection does not require territorial uniformity of laws.']],
['Reasonable classification','Tiu v. CA'],
[]),

E('IV-B','Charitable hospital with paying patients','2013 Bar · QuAMTO; CIR v. St. Luke\'s',
'A non-stock, non-profit hospital organized for charitable purposes also admits paying patients. No income goes to any private person, all income is plowed back, and administrative expenses are below 30%.',
'Is the hospital subject to income tax? At what rate?',
[['Answer','Yes, on its income from activities conducted for profit, such as services to paying patients.'],
 ['Basis','CIR v. St. Luke\'s (2012): a charitable hospital is exempt under Sec. 30(E) and (G) only if it is operated exclusively for charitable purposes. Income from paying patients is from activities conducted for profit, taxable regardless of how it is used (last paragraph of Sec. 30).'],
 ['Rate','As a non-profit hospital, it pays the preferential rate under Sec. 27(B): 10% (1% from July 1, 2020 to June 30, 2023), provided gross income from unrelated activities does not exceed 50% of its total gross income.'],
 ['Distinguish','Its real property actually, directly and exclusively used for charitable purposes remains exempt from real property tax under Art. VI, Sec. 28(3) (Lung Center).']]
,['Income from paying patients is taxable','Sec. 27(B) preferential rate','Distinguishes income tax from property tax exemption'],
[C.s27B,C.s30,C.a6s28]),

E('IV-B','KKI leases idle land to a mall','2018 Bar · QuAMTO',
'KKI, a non-stock, non-profit religious organization, uses half its land for a church and cemetery, a K-12 school, and a hospital with paying and charity patients. It leased the idle half to a developer that built a mall, and uses the substantial rentals for charity patients and school materials.',
'(a) Is KKI liable for real property tax? (b) Is the rental income subject to income tax?',
[['(a) Answer','Only on the leased portion. Under Art. VI, Sec. 28(3), the test is the actual, direct and exclusive use of the property. The leased half is used for commercial purposes, so it is taxable; the half used for religious, educational and charitable purposes is exempt (Lung Center; DLSU).'],
 ['(b) Answer','Yes. Although KKI is an exempt organization under Sec. 30, the last paragraph of Sec. 30 taxes income of whatever kind from its properties, regardless of how the income is used (CIR v. CA & YMCA).']],
['Use test for property tax','Leased portion taxable','Sec. 30 last paragraph: income from property taxable','Disposition of income is immaterial for Sec. 30 entities'],
[C.a6s28,C.s30]),

E('IV-B','San Juan University\'s buildings and income','2017 Bar · QuAMTO',
'San Juan University, a non-stock, non-profit school, has three buildings: two for classrooms, laboratories, canteen, bookstore and offices, and one dormitory for scholar-athletes. It earned tuition and rentals from concessionaires in 2017.',
'(a) Can the City collect real property tax on its land and buildings? (b) Is its 2017 income subject to income tax?',
[['(a) Answer','Only on the portions leased to concessionaires. Assets used actually, directly and exclusively for educational purposes are exempt (Art. XIV, Sec. 4(3)). The dormitory for scholar-athletes is incidental and reasonably necessary to education, so it is exempt (Abra Valley College; DLSU). Leased portions are used commercially and are taxable (DLSU v. CIR, 2016).'],
 ['(b) Answer','No, provided the revenues, including rentals, are used actually, directly and exclusively for educational purposes. The test is the use of the revenue, not its source (DLSU v. CIR, 2016; De La Salle Lipa v. CIR, 2025). The school must prove the use.']],
['Art. XIV, Sec. 4(3)','Use of assets vs. use of revenues','Leased portion taxable','Revenue exempt if used for education, regardless of source'],
[C.a14s4]),

E('IV-B','XYZ Colleges\' various receipts','2004 Bar · QuAMTO',
'XYZ Colleges, a non-stock, non-profit school, received: tuition, dormitory fees, rentals from canteen concessionaires, interest on money placements of tuition fees, and a lot and building donated by alumni.',
'Which are not exempt from tax?',
[['Rule','Under Art. XIV, Sec. 4(3), revenues used actually, directly and exclusively for educational purposes are exempt. Under DLSU (2016) and DLS Lipa (2025), the test is the use of the revenue, not its source.'],
 ['Application','Tuition and dormitory fees are exempt if so used. The rentals and interest are taxable unless proven to be used actually, directly and exclusively for educational purposes; the 2004 suggested answer treated them as taxable unless so used. The donation is exempt from donor\'s tax under Sec. 101(A)(2) if not more than 30% is used for administration, and under Art. XIV, Sec. 4(4) if used for educational purposes.']],
['Use test under DLSU','Rentals and interest need proof of use','Donation exempt from donor\'s tax, 30% admin cap'],
[C.a14s4]),

E('IV-B','Occupation tax on lawyers in Manila','2009 Bar · QuAMTO',
'Manila imposed an occupation tax on persons practicing professions in the city, including lawyers. Atty. Batas paid under protest and challenged it as discriminatory.',
'Decide.',
[['Answer','The ordinance is valid.'],
 ['Basis','Cities may impose a professional tax on persons exercising professions that require a government licensure examination (Secs. 139 and 151, LGC). The State may select the subjects of taxation, and lawyers fall within that class.'],
 ['Application','The tax applies equally to all members of the class, so it is not discriminatory.']],
['Professional tax authorized by LGC','Reasonable classification'],
[]),

E('IV-B','Discount for delinquent real property taxpayers','2004 Bar · QuAMTO',
'After typhoons, MM City granted a 50% discount on unpaid real property taxes of the preceding year and condoned penalties. RC, who paid promptly, sued to void the ordinance as class legislation and asked for a refund of half his taxes.',
'Will the suit prosper?',
[['Answer','No.'],
 ['Basis','A remission or condonation of taxes that applies only to taxes still due, excluding those already collected, is not unfair discrimination. Each set of taxes is a class by itself; the law is open to attack only if taxpayers in the same class are not treated alike (Juan Luna Subdivision v. Sarmiento).']],
['Condonation is a valid class','Juan Luna Subdivision v. Sarmiento'],
[]),

E('IV-B','Repeal of a five-year tax exemption','2004 Bar · QuAMTO',
'A law granted a five-year tax exemption to certain industries. Three years later it was repealed and the BIR assessed taxes from the date of repeal. Companies that invested in reliance on the exemption invoke the non-impairment clause.',
'Is their contention tenable?',
[['Answer','No.'],
 ['Basis','The exemption is unilateral, granted by the legislature without any contract or valuable consideration. A unilateral exemption is a mere privilege that may be revoked at will (Manila Railroad v. Insular Collector; Mactan Cebu Int\'l Airport Authority v. Marcos; Republic v. Caguioa).'],
 ['Distinguish','Only an exemption granted under a contract for valuable consideration is protected by the non-impairment clause.']],
['Unilateral vs. contractual exemption','No vested right in an exemption','Non-impairment protects only contracts'],
[]),

E('IV-B','Lung Center leases part of its building','Original · Lung Center v. Quezon City',
'A non-stock, non-profit hospital organized as a charitable institution admits mostly charity patients but also paying ones. It leases part of its ground floor to a pharmacy and a bank. The city assesses real property tax on the entire building.',
'Is the assessment correct?',
[['Answer','Only as to the leased portions.'],
 ['Basis','Under Art. VI, Sec. 28(3), what is exempt is not the institution but the property actually, directly and exclusively used for charitable purposes. The claimant must prove it is a charitable institution and that the property is so used (Lung Center v. Quezon City).'],
 ['Application','Accepting paying patients does not make it lose its charitable character if income is devoted to its charitable purpose. But portions leased to private businesses are not exclusively used for charity and are taxable. "Exclusively" cannot be read as "primarily."']],
['Two requisites for exemption','Exclusive, not dominant, use','Paying patients do not destroy charitable character'],
[C.a6s28]),

// ===== II: TAXES =====
E('II','Set-off of taxes against claims','2005 Bar · QuAMTO',
'(a) A taxpayer asks to offset its tax liability against its claim against the government. (b) A taxpayer with a final money judgment against a city wants to set off its local tax assessment against the judgment.',
'May taxes be set off in either case?',
[['Rule','Generally, no. Taxes cannot be the subject of compensation because the government and the taxpayer are not mutual creditors and debtors. Taxes arise from sovereignty, not contract (Republic v. Mambulao Lumber; Caltex v. COA; Philex v. CIR).'],
 ['Exception','Where both obligations are overdue, demandable and fully liquidated, and the claim against the government has been recognized and appropriated, compensation takes place by operation of law (Domingo v. Garlitos).'],
 ['(b) Answer','No. A local tax assessment cannot be set off against a money judgment; taxes are due to the LGU in its sovereign capacity, the judgment in its corporate capacity.']],
['General rule: no set-off','Reason: sovereign vs. corporate capacity','Exception: Domingo v. Garlitos'],
[]),

E('II','Maria Suerte\'s tax-free exchange','2008 Bar · QuAMTO',
'Maria owned a Makati lot leased to MAS Corp., 99% owned by her. EIP wanted to buy the lot for P300 million. On a lawyer\'s advice, Maria exchanged the lot for MAS shares in a tax-free exchange confirmed by BIR ruling, then sold her MAS shares to EIP for P300 million and paid only capital gains tax on shares. The RDO says she committed tax evasion.',
'Is the RDO correct?',
[['Answer','No. Maria resorted to tax avoidance, not evasion.'],
 ['Basis','Tax avoidance is the use of legally permissible means to reduce taxes; it is the legal right of the taxpayer (Delpher Trades v. IAC; Heng Tong Textiles). A transfer of property to a corporation for shares that gives the transferor control is a tax-free exchange under Sec. 40(C)(2).'],
 ['Application','Each step was lawful and confirmed by a BIR ruling. Selling the shares at a lower tax than a direct sale of the land would have incurred is not illegal.']],
['Avoidance vs. evasion','Tax-free exchange, Sec. 40(C)(2)','Delpher Trades'],
[C.s40]),

E('II','Lucky V\'s two-step sale','2016 Bar · QuAMTO',
'Lucky V sold its building to Rainier for P80 million; a month later Rainier sold it to HSC for P200 million. Before the first sale, HSC had paid Lucky P40 million, recorded as "other inv. Lucky Bldg," and paid another P40 million later. Lucky reported only a P750,000 gain. The BIR assessed Lucky deficiency income tax on the theory that HSC was the real buyer.',
'Is the BIR correct?',
[['Answer','Yes. This is tax evasion.'],
 ['Basis','CIR v. Estate of Toda: a scheme that uses an intermediary sale with no business purpose, only to reduce taxes, is tax evasion. The elements are present: payment of less tax than known to be due, a state of mind that is willful and deliberate, and an unlawful course of action.'],
 ['Application','HSC\'s direct payments to Lucky show it was the real buyer. The sale to Rainier was a sham to lower Lucky\'s tax, making it civilly and criminally liable.']],
['Substance over form','Elements of evasion','CIR v. Estate of Toda'],
[]),

E('II','Stockholders liable for a dissolved corporation\'s taxes?','2004 Bar · QuAMTO',
'ABC Corp. was dissolved by the SEC after its stockholders failed to meet corporate requirements. It left unpaid taxes.',
'Can the stockholders be held personally liable?',
[['Answer','Generally, no.'],
 ['Basis','A corporation has a personality separate from its stockholders.'],
 ['Exceptions','Stockholders may be liable if the corporate assets passed into their hands on dissolution, to the extent of what they received (Tan Tiong Bio v. CIR, trust fund doctrine), or to the extent of any unpaid subscriptions.']],
['Separate juridical personality','Exception: assets distributed to stockholders','Exception: unpaid subscriptions'],
[]),

// ===== VII: OTHER DOCTRINES =====
E('VII','Direct vs. indirect double taxation','2015 and 2017 Bar · QuAMTO',
'(a) Distinguish double taxation in the strict sense from double taxation in the broad sense, with an example of each. (b) Alfredo deposits his retirement savings, which came from his already-taxed salary, in a time deposit. The bank withholds 20% final tax on the interest. Alfredo claims double taxation.',
'Answer (a) and (b).',
[['(a) Strict sense','Direct duplicate taxation: the same subject matter, for the same purpose, by the same taxing authority, within the same jurisdiction, during the same period, and of the same kind. Example: subjecting a cash dividend to final withholding tax, then requiring it to be included again in the return.'],
 ['(a) Broad sense','Indirect double taxation: any case where there is a burden of two or more impositions but one of the elements is missing. Example: bank interest income subjected to both the 20% final tax and the 5% gross receipts tax (CIR v. Bank of Commerce), since one is a tax on income and the other a tax on the privilege of doing business. It is not prohibited.'],
 ['(b) Answer','No. The salary and the interest are different subject matters. At most it is indirect double taxation, which is allowed.']],
['Six elements of direct double taxation','Example of each','Different subject matter in Alfredo\'s case'],
[]),

E('VII','City business tax on wholesalers','2018 Bar · QuAMTO',
'KM Corp. pays Kalookan City local business taxes as a wholesaler and as a retailer. The city added a tax on businesses subject to excise, VAT or percentage taxes under the NIRC, at 50% of 1% of gross sales. KM paid under protest, alleging double taxation.',
'Is there double taxation?',
[['Answer','Yes.'],
 ['Basis','Direct double taxation exists when the same subject matter is taxed twice, for the same purpose, by the same taxing authority, within the same jurisdiction, during the same period, with the same kind of tax (Nursery Care v. Acebedo; Star Appliance v. City of Manila).'],
 ['Application','All three are local business taxes imposed by the same city on the same privilege of doing business as a seller of goods, during the same period. The new tax is void as applied.']],
['Same taxing authority, subject, purpose, period, kind','Nursery Care v. Acebedo'],
[]),

E('VII','Lessor pays three taxes on rentals','1996 Bar · QuAMTO',
'X, a lessor, pays real estate tax on the premises, a real estate dealer\'s tax on rental receipts, and income tax on the rentals. He claims double taxation.',
'Is he correct?',
[['Answer','No.'],
 ['Basis','There is double taxation only when the same thing is taxed twice for the same purpose by the same authority, during the same period, with the same kind of tax (Villanueva v. City of Iloilo).'],
 ['Application','The real estate tax is a tax on property; the dealer\'s tax is on the privilege of doing business; the income tax is on the privilege of earning income. They differ in kind and some are imposed by different authorities.']],
['Different kinds of tax','Different taxing authorities'],
[]),

E('VII','City tax on wholesale sales, VAT-inclusive','2019 Bar · QuAMTO',
'City X taxed every sale by wholesalers based on the total selling price including VAT. ABC Corp. argues (1) this is double taxation since it amounts to the city imposing VAT, and (2) the city cannot levy something akin to VAT.',
'Rule on both contentions.',
[['(1) Double taxation','ABC is incorrect. Direct double taxation requires the same taxing authority. Here the national government imposes VAT and the city imposes a local tax, so at most there is indirect double taxation, which is not prohibited.'],
 ['(2) Power to impose','LGUs are prohibited from levying VAT (Sec. 133, LGC). If the city tax is in substance a VAT on sales, it is beyond the city\'s power, as the suggested answer holds. Note that cities may impose a local business tax on wholesalers based on gross sales; the issue is whether this tax is that or a disguised VAT.']],
['Different taxing authorities: not direct double taxation','Sec. 133, LGC prohibits LGU VAT'],
[]),

// ===== V: CONSTRUCTION =====
E('V','Holding company taxed as contractor','2013 Bar · QuAMTO',
'ABC Corp. is a holding company in Makati with no operations. Its only earnings are dividends, interest on deposits, and foreign exchange gains. Makati assessed it as a contractor.',
'Is Makati correct?',
[['Answer','No.'],
 ['Basis','A contractor is one whose activity consists essentially in selling services for a fee. Tax statutes are construed strictly against the government and cannot be extended by implication (Luzon Stevedoring v. Trinidad; Petron v. CIR, 2023).'],
 ['Application','ABC renders no services for others; its income is purely passive. It does not fall within the definition of contractor.']],
['Definition of contractor','Passive income only','Strict construction against the taxing authority'],
[]),

// ===== VI: EXEMPTIONS / COMPROMISE =====
E('VI','Which cases may be compromised?','2005 Bar · QuAMTO',
'State whether each may be compromised: (a) delinquent accounts; (b) cases under administrative protest after the final assessment notice; (c) criminal tax fraud cases; (d) criminal violations already filed in court; (e) cases where the taxpayer signed an agreement form accepting a reduced assessment after reinvestigation.',
'Answer each.',
[['(a) Yes','If there is reasonable doubt as to the validity of the assessment or the taxpayer clearly cannot pay (Sec. 204(A)).'],
 ['(b) Yes','On the same grounds of doubtful validity or financial incapacity.'],
 ['(c) No','Fraud cases cannot be compromised, so the taxpayer does not profit from fraud.'],
 ['(d) No','Criminal violations already filed in court cannot be compromised.'],
 ['(e) No','By agreeing to the reduced assessment, the taxpayer admitted its validity and his capacity to pay.']],
['Two grounds under Sec. 204(A)','Exceptions: filed in court, fraud','Agreed assessment cannot be compromised'],
[C.s204]),

// ===== VIII-A / VIII-B =====
E('VIII-A','Appeal from the Secretary of Finance\'s review of a BIR ruling','2014 Bar · QuAMTO; Philamlife v. SOF',
'GGG sold shares in HHH to JJJ through bidding. The CIR ruled the price was below book value, so the difference was a taxable donation. The Secretary of Finance affirmed on review. GGG filed a Rule 43 petition with the CA, which dismissed it for lack of jurisdiction.',
'Where should GGG seek recourse?',
[['Answer','The Court of Tax Appeals.'],
 ['Basis','The CIR has original and exclusive power to interpret tax laws, subject to review by the Secretary of Finance (Sec. 4). No law says where the Secretary\'s review is appealable, but Sec. 7(a)(1) of RA 1125 gives the CTA jurisdiction over "other matters" arising under the NIRC. Philamlife v. Secretary of Finance (2014) held this covers the Secretary\'s review of BIR rulings.']],
['Sec. 4 review by Secretary of Finance','CTA "other matters" jurisdiction','Philamlife'],
[]),

E('VIII-B','Taxpayer appeals the FAN directly to the CTA','2012 Bar · QuAMTO',
'The BIR\'s final assessment notice said: "This is our final decision based on investigation. If you disagree, you may appeal this final decision within 30 days, otherwise it becomes final." The taxpayer appealed to the CTA without filing a protest.',
'As judge, would you dismiss the petition as premature?',
[['Answer','No.'],
 ['Basis','Ordinarily, the CTA reviews the CIR\'s decision on a protest, not the assessment itself (CIR v. V.Y. Domingo Jewellers). But the BIR is estopped here: the wording of its own notice told the taxpayer that the assessment was the final decision and that the remedy was to appeal (Allied Banking v. CIR, 2010).'],
 ['Application','The case falls under an exception to exhaustion of administrative remedies. The CIR must state clearly whether an action is its final decision.']],
['General rule: protest first','Exception: BIR\'s own language','Estoppel; Allied Banking v. CIR'],
[C.s228]),

E('VIII-B','RTC case against a Revenue Memorandum Order','2006 Bar · QuAMTO',
'A pawnshop operator, told to pay VAT under a Revenue Memorandum Order, filed an action with the RTC questioning the RMO\'s validity.',
'Should the RTC dismiss the case?',
[['Answer','Yes.'],
 ['Basis','An RMO interpreting the Code is in the nature of a ruling of the CIR. Its review falls under the CTA\'s jurisdiction over "other matters" arising under the NIRC (CIR v. Leal). Under Banco de Oro v. Republic (2016) and CIR v. CTA (2021), the CTA may also take cognizance of direct challenges to the validity of tax regulations and issuances.']],
['RMO is a ruling of the CIR','CTA has exclusive jurisdiction','BDO v. Republic'],
[]),

E('VIII-B','Refund claim filed in court five days later','2024 Bar · QuAMTO',
'TGI filed an administrative claim for refund of overpaid final withholding tax on August 23, 2024, and a judicial claim with the CTA on August 28, 2024. The BIR argues the judicial claim is premature.',
'Does the CTA have jurisdiction?',
[['Answer','Yes, under the rule applied in the suggested answer.'],
 ['Basis','Sec. 229 only requires that an administrative claim be filed before the judicial claim and that both be filed within two years from payment. It does not matter how far apart they were filed or whether the CIR ruled first (CIR v. Carrier Air Conditioning, 2021).'],
 ['Note','Sec. 204(C), as amended, now gives the CIR 90 days to act and allows appeal within 30 days from a denial. Check with your professor how your class treats this amendment.']],
['Sec. 229 requisites','Carrier Air Conditioning','Flag the 90-day amendment'],
[C.s229]),

E('VIII-B','Immediate appeal to the CTA en banc','2015 Bar · QuAMTO',
'CCC received a CTA Division decision dismissing its petition and immediately filed a petition for review with the CTA en banc.',
'Is this the proper remedy?',
[['Answer','No.'],
 ['Basis','A party adversely affected by a Division decision must first file a motion for reconsideration or new trial with the same Division within 15 days (Sec. 11, RA 1125; Rule 8, Sec. 1, RRCTA). This is indispensable before appealing to the en banc (City of Manila v. Cosmos Bottling).']],
['MR before the Division is required','15 days'],
[]),

E('VIII-B','Garnishment while protest is pending','2022 Bar · QuAMTO',
'Kotse Corp. protested a final assessment. A month later, the CIR garnished its bank deposits.',
'As counsel, how would you secure an injunction against the garnishment?',
[['Answer','File a petition with the CTA and ask it to suspend collection.'],
 ['Basis','Courts cannot enjoin collection of national taxes (Sec. 218), but the CTA may suspend collection when it may jeopardize the government or the taxpayer, upon a deposit or a bond of not more than double the amount (Sec. 11, RA 1125; Pacquiao v. CTA). The suggested answer recommends a petition for certiorari with the CTA with a prayer for preliminary injunction, since collection while the protest is unresolved is premature.']],
['Sec. 218 general rule','CTA exception under Sec. 11, RA 1125','Deposit or bond up to double'],
[C.s218]),

E('VIII-B','Civil liability after acquittal','2024 Bar · QuAMTO',
'The CTA acquitted Stephen of failure to file an income tax return under Sec. 255, but held him civilly liable for deficiency income tax. Stephen argues his acquittal extinguished his civil liability.',
'May the CTA impose civil liability?',
[['Answer','Yes.'],
 ['Basis','The duty to pay tax is imposed by statute, independently of any attempt to evade it. Acquittal for reasonable doubt does not discharge the tax liability (People v. Gernale, 2023). Sec. 254 also states that conviction or acquittal does not bar a civil suit for collection. Under RA 9282, the civil action for taxes is deemed instituted with the criminal action.']],
['Tax liability arises from law','People v. Gernale','Sec. 254 last proviso'],
[C.s254]),

E('VIII-B','MeTC injunction against local tax collection','2024 Bar · QuAMTO',
'The City Treasurer assessed Luminous Star P900,000 in local business taxes. After its protest was denied, it appealed to the MeTC and asked for a preliminary injunction. The Treasurer says courts cannot enjoin tax collection.',
'May the MeTC issue the injunction?',
[['Answer','Yes.'],
 ['Basis','Since the amount is below P1 million, the case is within the first-level court\'s jurisdiction (RA 11576; People v. Mendez). The prohibition on injunctions applies only to national internal revenue taxes, not local taxes (Angeles City v. Angeles Electric, 2010).']],
['First-level court has jurisdiction below P1M','Sec. 218 covers only national taxes'],
[]),

E('VIII-B','Criminal case filed without an assessment','2010 and 2005 Bar · QuAMTO',
'The DOJ filed an information for failure to file an income tax return under Sec. 255 against XX, based on the CIR\'s affidavit. XX moved to quash because there was no formal assessment.',
'Is a prior assessment necessary?',
[['Answer','No.'],
 ['Basis','A criminal complaint aims to punish the violation, not to collect the tax. The crime is complete when the taxpayer willfully fails to file or files a fraudulent return (Ungab v. Cusi). People v. Mendez (2023): only probable cause is needed, and the civil action for the tax is deemed instituted with the criminal case.'],
 ['Note','A joint affidavit of BIR examiners is not itself an assessment that the taxpayer may protest (CIR v. Pascor Realty).']],
['Assessment not required for criminal action','Ungab v. Cusi; People v. Mendez','Affidavit is not an assessment'],
[]),

E('VIII-B','Which court for an P800,000 tax evasion case?','Original · People v. Mendez',
'The BIR wants to file a criminal case for failure to file returns where the principal amount of tax claimed is P800,000. It plans to file directly with the CTA.',
'Where should the case be filed, and where does an appeal go?',
[['Answer','With the proper first-level court; appeal goes to the RTC.'],
 ['Basis','People v. Mendez (2023) reconciled RA 9282 and BP 129 as amended by RA 11576: criminal offenses where the principal tax is P1 million or more stay with the CTA; below P1 million go to first-level courts, with appellate jurisdiction in the RTC. The same split applies to tax collection cases.']],
['P1 million threshold','RA 11576','First-level court, appeal to RTC'],
[]),

E('VIII-B','BIR assesses another government agency','Original · DOE v. CIR',
'The BIR assessed a government department for deficiency taxes on a government project. The department appealed to the CTA.',
'Does the CTA have jurisdiction?',
[['Answer','No.'],
 ['Basis','DOE v. CIR (2023): PD 242 is the special law for disputes exclusively between government agencies and offices of the Executive Branch, including tax disputes. These go to administrative settlement by the Secretary of Justice, the Solicitor General, or the Government Corporate Counsel, as the case may be, not to the CTA. This rests on the President\'s power of control over the executive branch.']],
['PD 242 is the special law','Administrative settlement, not CTA'],
[]),

E('VIII-B','CTA voids assessment for lack of LOA on its own','Original · CIR v. Marilyn Development',
'In a protest case, the only issue raised was whether the deficiency tax was correctly computed. The CTA Division, on its own, cancelled the assessment because no Letter of Authority was shown in the records.',
'Was the CTA correct?',
[['Answer','No.'],
 ['Basis','The CTA may rule on issues not raised by the parties only if (1) the issue is related to the principal issue and necessary for an orderly disposition, and (2) its resolution needs no additional evidence and relies only on facts already of record (CIR v. Marilyn Development, 2025; Rule 14, Sec. 1, RRCTA).'],
 ['Application','Since the LOA was never put in issue, the CIR had no chance to present it. Ruling on it deprived the CIR of due process.']],
['Two conditions for unraised issues','Due process to the CIR'],
[]),
];

ESSAYS.push(
// ===== I: TAXATION =====
E('I','War losses and the occupation years','Original · Hilado v. CIR',
'In his 1951 return, H deducted losses from properties destroyed during the war in 1941 to 1945, which he claimed only after the War Damage Commission said it could not pay. He argues that the tax laws were not in force during the Japanese occupation, so the war years were not taxable years and the losses may be deducted later.',
'Is H correct?',
[['Answer','No.'],
 ['Basis','Hilado v. CIR: internal revenue laws are not political in nature. They continue in force during enemy occupation and are deemed laws of the occupied territory, not of the occupying enemy, unless changed by competent authority.'],
 ['Application','The war years remained taxable years, so the losses should have been deducted in the years they were sustained. H cannot shift them to 1951.']],
['Internal revenue laws are not political','They stay in force during occupation','Losses deductible in the year sustained'],
[]),

E('I','Tax on sugar production for the sugar industry','Original · Lutz v. Araneta',
'A law imposes a tax on sugar production, with the proceeds going to a fund used solely to rehabilitate and stabilize the sugar industry. An estate administrator seeks a refund, arguing the tax benefits only sugar producers and is not for a public purpose.',
'Is the tax valid?',
[['Answer','Yes.'],
 ['Basis','Lutz v. Araneta: taxation may be used as an implement of police power. Protecting a vital national industry affects the general welfare and is a public purpose. The State is free to select the subjects of taxation, and the legislature has wide discretion in pursuing a valid regulatory goal.'],
 ['Application','The sugar industry is a major source of national income and employment, so its stabilization serves the public. That the proceeds go to the same industry does not make the tax private.']],
['Taxation as an implement of police power','Public purpose: vital national industry','Selection of subjects is legislative'],
[]),

E('I','Tax on video sales and rentals','Original · Tio v. Videogram Regulatory Board',
'To curb video piracy and protect the movie industry, a decree created a regulatory board and imposed a 30% tax on gross receipts from video sales and rentals. Video operators argue the tax is confiscatory and that a regulatory measure cannot impose a revenue tax.',
'Decide.',
[['Answer','The tax is valid.'],
 ['Basis','Tio v. Videogram: a tax does not become invalid merely because it regulates, discourages, or even deters the activity taxed. A levy may serve both revenue and regulatory purposes. Singling out a class for taxation does not by itself violate the Constitution.'],
 ['Application','The tax is part of a valid regulatory scheme and is not shown to be so excessive as to be confiscatory. The motive of protecting the movie industry is a legitimate public purpose.']],
['Tax may regulate or deter','Dual purpose: revenue and regulation','Reasonable classification'],
[]),

E('I','Taxation, police power and eminent domain','Original · theory',
'Your professor asks you to compare the three inherent powers of the State.',
'Distinguish taxation from police power and eminent domain as to purpose, persons affected, benefits received, and amount of the exaction.',
[['Purpose','Taxation raises revenue to support the government. Police power regulates liberty and property to promote the general welfare. Eminent domain takes private property for public use.'],
 ['Persons affected','Taxation and police power operate on a community or a class. Eminent domain operates on an individual as owner of particular property.'],
 ['Benefits','In taxation, the taxpayer receives protection and the benefits of organized society. In eminent domain, the owner receives just compensation. In police power, the benefit is indirect, through a healthy society.'],
 ['Amount','Taxation generally has no limit except that it must not be confiscatory. Police power fees are limited to the cost of regulation. In eminent domain, no amount is imposed; the owner is paid market value.'],
 ['Who may exercise','Taxation and police power: only the government and its political subdivisions. Eminent domain may also be granted to public utilities.']],
['Purpose of each power','Community vs. individual','Benefits received','Limits on amount','Delegation to private entities'],
[]),

E('I','Refusing to pay taxes for lack of benefit','Original · Lorenzo v. Posadas; CIR v. Algue',
'A taxpayer refuses to pay real property tax on his idle land, saying the city never paved the road to his property and he receives no benefit from the tax.',
'Is his refusal justified?',
[['Answer','No.'],
 ['Basis','Lorenzo v. Posadas: the obligation to pay taxes rests not on the benefit a taxpayer receives but on the necessity of money for the support of the State. Under the lifeblood doctrine (CIR v. Algue), taxes are what we pay for civilized society, and every person able must contribute.'],
 ['Application','The taxpayer\'s remedy, if any, is to question government action through proper means, not to withhold taxes. Taxes cannot be resisted merely because no personal benefit is shown.']],
['Necessity, not personal benefit','Lifeblood doctrine','Lorenzo v. Posadas'],
[]),

E('I','Real property tax on outdated values','Original · patterned after Chavez v. Ongpin',
'A city keeps collecting real property tax based on property values fixed more than a decade ago, though market values have more than doubled. A taxpayer group argues this is fine because it keeps taxes low.',
'Which principle of a sound tax system is at stake, and how should it be applied?',
[['Answer','Fiscal adequacy.'],
 ['Basis','Fiscal adequacy requires that sources of revenue be adequate to meet government expenditures and their variations. Chavez v. Ongpin held that collecting real property taxes on outdated valuations despite rising values is not consonant with a sound tax system.'],
 ['Note','Non-observance of a canon alone does not invalidate a tax (Diaz v. Secretary of Finance), but updating values to reflect current market values is consistent with the canons.']],
['Fiscal adequacy','Chavez v. Ongpin','Canons alone do not invalidate a tax'],
[]),

// ===== III: SOURCES =====
E('III','Late challenge to a market stall ordinance','Original · Hagonoy Market Vendor v. Municipality of Hagonoy',
'A municipality raised market stall fees by ordinance after public hearing and publication. Vendors challenged it before the Secretary of Justice four months after it took effect, saying they only learned of it when they received their bills.',
'Is the challenge timely?',
[['Answer','No.'],
 ['Basis','Under the LGC, the constitutionality or legality of a tax ordinance must be appealed to the Secretary of Justice within 30 days from its effectivity. Hagonoy held that the period is mandatory and runs from effectivity, not from actual knowledge, because the validity of revenue measures cannot be left uncertain.'],
 ['Application','The ordinance complied with the hearing and publication requirements. The vendors filed beyond 30 days, so the challenge must fail.']],
['30 days from effectivity','Mandatory period','Prior hearing and publication requirements'],
[]),

E('III','Treaty relief denied for late application','Original · Deutsche Bank v. CIR',
'A German bank\'s Manila branch paid 15% branch profit remittance tax, then claimed a refund of the excess over the 10% treaty rate. The CIR denied it because the branch did not file a tax treaty relief application with the BIR 15 days before the remittance, as a revenue memorandum order required.',
'Should the refund be denied?',
[['Answer','No.'],
 ['Basis','Deutsche Bank v. CIR (2013): tax treaties have the force of law and must be performed in good faith (pacta sunt servanda). The BIR cannot impose a requirement that would defeat the relief the treaty grants. Treaty obligations prevail over administrative issuances.'],
 ['Application','The bank is entitled to the 10% rate. Failure to file the prior application cannot deprive it of treaty benefits; it can prove its entitlement in the refund claim.']],
['Pacta sunt servanda','BIR cannot add requirements that defeat treaty relief','Treaty prevails over administrative rules'],
[]),

E('III','Customs order issued without hearing','Original · COC v. Hypermix Feeds',
'The Bureau of Customs issued an order classifying imported wheat as food grade, with higher tariff, unless the importer proved it was feed grade. It was issued without notice, hearing or publication. An importer challenges it.',
'Is the order valid?',
[['Answer','No.'],
 ['Basis','An administrative rule that goes beyond interpreting the law and substantially increases the burden of those governed is legislative in character. It requires notice, hearing and publication before it takes effect (Hypermix; PSE v. Secretary of Finance).'],
 ['Application','The order effectively raised tariffs on importers, so the lack of notice, hearing and publication makes it invalid.']],
['Interpretative vs. legislative rules','Substantial increase in burden','Notice, hearing, publication'],
[]),

E('III','Amortizing input VAT on capital goods','Original · CIR v. Taganito Mining',
'A revenue regulation requires that input VAT on capital goods costing over P1 million be spread over 60 months or the useful life of the asset. A zero-rated exporter argues the regulation deprives it of its full input VAT credit and is void.',
'Is the regulation valid?',
[['Answer','Yes.'],
 ['Basis','CIR v. Taganito Mining: a rule that merely fills in the details of a statutory provision, without expanding or contradicting it, is a valid exercise of delegated rule-making power. The law itself authorized the amortization.'],
 ['Application','The regulation does not deny the credit; it only delays its full application. It applies even to a 100% zero-rated taxpayer.']],
['Filling in details is valid','No deprivation, only deferral','Delegated rule-making'],
[]),

E('III','Regulation that adds a condition not in the law','Original · CIR v. San Miguel (2019)',
'A law fixes excise tax rates on a product according to its net retail price. A revenue regulation adds that new brands may not be classified below the rate of the brand they most resemble, a condition the law does not provide. A manufacturer challenges it.',
'Is the regulation valid?',
[['Answer','No.'],
 ['Basis','Revenue regulations must stay within the law they implement. A regulation that adds a qualification not found in the statute is unauthorized administrative legislation and is void (CIR v. San Miguel, 2019; Subic Bay Chamber v. DOF, 2025). In case of conflict, the law prevails.'],
 ['Application','The added condition changes how the tax is computed, which only Congress may do.']],
['Regulations cannot add to the law','Law prevails over regulation','Unauthorized administrative legislation'],
[C2.s244]),

// ===== V: CONSTRUCTION =====
E('V','Is the taxpayer covered at all?','Original · Petron v. CIR (2023)',
'The BIR assessed a company under a tax provision listing specific taxable products. The company\'s product is not among those listed, but the BIR argues it is similar and the company must prove it is exempt.',
'Who bears the burden, and is the company taxable?',
[['Answer','The BIR bears the burden, and the company is not taxable under that provision.'],
 ['Basis','Petron v. CIR (2023): the rule that exemptions are construed against the taxpayer presupposes that the taxpayer is clearly subject to the tax. Unless a statute imposes a tax clearly, expressly and unambiguously, the imposition cannot be presumed. Tax laws may not be extended by implication.'],
 ['Application','Since the product is not listed, the company need not prove an exemption; the BIR must show it is taxable. Doubts are resolved in favor of the taxpayer.']],
['Strict construction against the government','Exemption rule presupposes taxability','Burden on the BIR'],
[]),

E('V','Ambiguous word in a business tax','Original · Luzon Stevedoring v. Trinidad',
'A law taxes persons engaged in "the business of transporting goods for hire." A stevedoring company that loads and unloads ships, and occasionally moves cargo short distances within the port, is assessed under this law.',
'How should the provision be construed?',
[['Answer','Strictly, in favor of the taxpayer.'],
 ['Basis','Luzon Stevedoring v. Trinidad: revenue laws imposing taxes on business are construed strictly in favor of the citizen. A word of doubtful meaning is given the meaning most in accord with the purpose of the statute, and obscurity may be resolved by reference to associated words.'],
 ['Application','If "transporting goods for hire" does not clearly cover stevedoring, the company should not be taxed under it by implication.']],
['Strict construction of taxing statutes','Purpose and associated words','Doubt resolved for the taxpayer'],
[]),

E('V','Mandatory or directory provision','Original · Roxas v. Rafferty',
'A tax law requires the assessor to send the taxpayer written notice of a new assessment before it becomes due, and also requires the assessor to submit a monthly list of assessments to the treasurer. The assessor failed to do both.',
'What is the effect of each failure?',
[['Answer','The failure to give notice to the taxpayer affects the validity of the assessment; the failure to submit the monthly list does not.'],
 ['Basis','Roxas v. Rafferty: provisions intended for the security of the citizen, to ensure equality of taxation, or certainty as to the amount of tax, are mandatory. Provisions meant merely for the guidance of officers or orderly procedure are directory.'],
 ['Application','Notice protects the taxpayer, so it is mandatory. The monthly list is for internal administration, so it is directory.']],
['Mandatory vs. directory test','Protective provisions are mandatory','Administrative provisions are directory'],
[]),

// ===== VI: EXEMPTIONS =====
E('VI','Withdrawal of freeport exemptions','Original · Republic v. Caguioa',
'Businesses in a freeport enjoyed exemption from taxes on imported cigarettes and liquor under the freeport\'s charter. A later law subjected these imports to excise taxes and duties. The businesses claim a vested right to the exemption.',
'Is their claim valid?',
[['Answer','No.'],
 ['Basis','Republic v. Caguioa: there is no vested right in a tax exemption, especially when the latest expression of legislative intent makes its continuance doubtful. A statutory exemption is a mere privilege that the legislature may modify or withdraw at will.'],
 ['Application','The later law validly withdrew the exemption for these goods. Only an exemption granted by contract for valuable consideration is protected by the non-impairment clause.']],
['No vested right in an exemption','Withdrawal at will','Contrast contractual exemptions'],
[]),

E('VI','Condonation does not mean refund','Original · Surigao Consolidated Mining v. Collector',
'A law condoned all unpaid taxes of mining companies for certain years. A mining company that had already paid its taxes for those years claims a refund, saying it should not be worse off than those who did not pay.',
'Is it entitled to a refund?',
[['Answer','No.'],
 ['Basis','Surigao Consolidated Mining v. Collector: a condonation of tax liability is in the nature of a tax exemption and must be construed strictly. A law condoning unpaid taxes cannot be extended by interpretation to authorize a refund of taxes already paid.'],
 ['Note','Juan Luna Subdivision v. Sarmiento also holds that a condonation applying only to unpaid taxes is not unfair discrimination.']],
['Condonation is like exemption','Strict construction','Unpaid vs. paid taxes'],
[]),

E('VI','Tax amnesty and its terms','Original · CIR v. Marubeni; BIR v. Cagang',
'A tax amnesty law covers "all national internal revenue taxes" for a period, subject to stated exceptions. A taxpayer under investigation for fraud claims the amnesty also covers penalties for a later year not mentioned in the law.',
'How should the amnesty be construed?',
[['Answer','Strictly against the taxpayer.'],
 ['Basis','A tax amnesty is a general pardon or intentional overlooking by the State of its authority to impose penalties on persons guilty of violating tax laws. Like an exemption, it is never favored nor presumed; its terms are construed strictly against the taxpayer (CIR v. Marubeni; BIR v. Cagang).'],
 ['Application','The amnesty covers only the period and taxes stated, subject to its exceptions. It cannot be extended to a year the law does not cover.']],
['Definition of amnesty','Strictly construed','Not extended by implication'],
[]),

E('VI','Regulation requiring zone enterprises to pay then claim refund','Original · Secretary of Finance v. Semirara (2021)',
'A law grants enterprises in a free economic zone tax-free importation. A revenue regulation requires them to pay VAT and excise tax on their imports first and then claim a refund once they prove the goods stayed in the zone.',
'Is the regulation valid?',
[['Answer','No.'],
 ['Basis','Tax exemptions reflect specific public interests the legislature weighed against the revenue loss. Requiring payment subject to refund runs counter to the legislative intent of free flow of goods into the zone. The taxing power, including the grant of exemptions, belongs to Congress, and a regulation cannot defeat it (Secretary of Finance v. Semirara, 2021).']],
['Exemption reflects legislative policy','Regulation cannot defeat an exemption','Taxing power is legislative'],
[]),

E('VI','Abatement denied by the CIR','Original · CIR v. Pacific Hub; Qatar Airways v. CIR',
'A taxpayer asked the CIR to abate penalties on a late payment caused by a bank system failure on the deadline. The CIR denied the request without explanation. The taxpayer appeals to the CTA.',
'What are the grounds for abatement, and may the CTA review the denial?',
[['Grounds','Under Sec. 204(B), the CIR may abate or cancel a tax liability when the tax or any portion appears unjustly or excessively assessed, or when the administration and collection costs do not justify collection.'],
 ['Review','Abatement is a discretionary power of the CIR. Courts generally do not interfere, but they may when the CIR goes beyond statutory authority, acts unconstitutionally, or gravely abuses discretion (CIR v. Pacific Hub, 2024). Penalties caused by circumstances beyond the taxpayer\'s control may be unjustly imposed, as in Qatar Airways v. CIR (2020).'],
 ['Application','The CTA may review the denial as an "other matter" arising under the NIRC.']],
['Two grounds under Sec. 204(B)','Discretionary but reviewable','CTA jurisdiction over other matters'],
[C.s204]),

E('VI','Refund claims and strict construction','Original · Brewery Properties v. CIR',
'A taxpayer claims a refund of excess creditable withholding tax but cannot prove that the income on which tax was withheld was declared in its return. It argues refunds should be liberally granted because the government should not keep money it is not entitled to.',
'How is a refund claim construed?',
[['Answer','Strictly against the taxpayer, when based on a claimed exemption or entitlement.'],
 ['Basis','Brewery Properties v. CIR (2023): refunds are in the nature of exemptions, derogate the taxing power, and must be justified by words too plain to be mistaken. The claimant bears the burden of proving every requisite.'],
 ['Exception','When the refund arises from the government\'s erroneous interpretation of the law, it is construed against the government (CIR v. San Miguel, 2019).'],
 ['Application','Failure to prove the income was declared defeats the claim.']],
['Refunds strictly construed','Burden on claimant','Exception: erroneous government interpretation'],
[]),

// ===== VIII-A: BIR =====
E('VIII-A','Collecting estate tax during probate','Original · Marcos v. CA',
'The BIR assessed estate tax on a deceased former official\'s estate. The assessment became final, and the BIR levied on estate properties. The heirs argue the BIR must wait for the probate court to approve the inventory and that the probate court must authorize any collection.',
'Can the BIR collect without probate court approval?',
[['Answer','Yes.'],
 ['Basis','Marcos v. CA: assessment and collection of internal revenue taxes are executive functions of the BIR. Its assessments are presumed correct and made in good faith. The approval of the probate court is not required before the BIR may collect estate tax through its summary remedies of distraint and levy.'],
 ['Application','The assessment became final for failure to protest, so the BIR may enforce it directly.']],
['Assessment and collection are executive','No need for probate court approval','Final assessment may be enforced'],
[]),

E('VIII-A','RDO compromises a P2 million assessment','Original · Sec. 7, NIRC',
'A Revenue District Officer, acting under a memorandum from the CIR, approved a compromise of a P2 million deficiency assessment at 40%. He also issued a ruling of first impression on the tax treatment of a new financial product.',
'Were the RDO\'s acts valid?',
[['Answer','No, as to both.'],
 ['Basis','Sec. 7 lets the CIR delegate powers to officials of division chief rank or higher, but not (a) recommending regulations, (b) issuing rulings of first impression or reversing rulings, (c) compromising or abating tax liabilities, and (d) assigning officers to excise establishments.'],
 ['Application','Only regional evaluation boards may compromise assessments of P500,000 or less, and above P1 million the Evaluation Board of the CIR and four Deputy Commissioners must approve (Sec. 204(A)). The ruling of first impression is reserved to the CIR.']],
['Non-delegable powers under Sec. 7','Regional evaluation board limit','Evaluation Board above P1 million'],
[C2.s7,C.s204]),

E('VIII-A','Relying on a BIR ruling later reversed','Original · Sec. 246; CIR v. San Roque',
'A company relied in good faith on a published BIR ruling that its transactions were VAT-exempt. Three years later, the CIR reversed the ruling and assessed deficiency VAT for all prior years.',
'Is the retroactive assessment valid?',
[['Answer','No.'],
 ['Basis','Under Sec. 246, a revocation or reversal of a ruling is not given retroactive effect if prejudicial to the taxpayer, unless the taxpayer misstated facts, the facts were materially different, or the taxpayer acted in bad faith. CIR v. San Roque (2013): taxpayers may rely on a ruling from its issuance until its reversal.'],
 ['Application','None of the exceptions apply, so the reversal operates only prospectively. A mere administrative practice would not have been enough; here there was a formal ruling.']],
['Non-retroactivity of rulings','Three exceptions','Must be a formal ruling, not mere practice'],
[C2.s246]),

E('VIII-A','Who interprets the tax code?','Original · Sec. 4; Philamlife v. SOF',
'A taxpayer received an adverse BIR ruling on whether its transaction is subject to donor\'s tax. It wants to know its remedies.',
'What are the taxpayer\'s remedies against the ruling?',
[['Answer','Seek review by the Secretary of Finance, then appeal to the CTA.'],
 ['Basis','Under Sec. 4, the power to interpret the NIRC is within the exclusive and original jurisdiction of the CIR, subject to review by the Secretary of Finance. The taxpayer may seek review within 30 days from receipt of the ruling (DOF Order 007-02). The Secretary\'s decision may be appealed to the CTA as an "other matter" arising under the NIRC (Philamlife v. Secretary of Finance, 2014).'],
 ['Note','A ruling is presumed valid until modified, reversed or superseded by the Secretary of Finance.']],
['Sec. 4 review by SOF','30 days','Appeal to CTA'],
[C2.s4]),

// ===== IT-B / IT-C =====
E('IT-B','Classifying a lawyer\'s different incomes','Original · Sec. 24, NIRC',
'Atty. R, a resident citizen, earns: (1) a salary as in-house counsel of a company; (2) fees from her private practice; (3) interest on a peso savings deposit; and (4) cash dividends from a domestic corporation.',
'Classify each income and state how it is taxed.',
[['(1) Salary','Compensation income, taxed at graduated rates under Sec. 24(A).'],
 ['(2) Practice fees','Income from the exercise of a profession. Since she also earns compensation, she is a mixed-income earner: her practice income is taxed at graduated rates or, if her gross receipts do not exceed the VAT threshold, at her option, 8% of gross receipts.'],
 ['(3) Interest','Passive income subject to 20% final tax, withheld by the bank (Sec. 24(B)(1)).'],
 ['(4) Dividends','Passive income subject to 10% final tax (Sec. 24(B)(2)).'],
 ['Point','This illustrates the schedular features of individual taxation: different types of income are taxed under different rates and bases.']],
['Compensation vs. professional vs. passive','Mixed-income earner rules','Final taxes on interest and dividends'],
[C2.s24A,C2.s24B]),

E('IT-C','Global and schedular features','Original · theory',
'Your professor asks whether the Philippine income tax system is global or schedular.',
'Explain the two systems and how the Philippines combines them for individuals and corporations.',
[['Global system','All income is added together and taxed under a single set of rates. It better reflects the taxpayer\'s total ability to pay but is harder to administer.'],
 ['Schedular system','Different types of income are taxed separately at different rates and bases, such as capital gains and passive income. It is easier to administer, but the burden falls on the type of income rather than total income.'],
 ['Philippines','A mixed or semi-schedular system. For individuals, compensation and business income are combined at graduated rates, while passive income and capital gains are taxed separately at final rates, making it more schedular. For corporations, most income is pooled and taxed at one rate, making it more global.']],
['Definition of each system','Advantages of each','Philippine mixed system'],
[])
);

const CASES = [{"name": "Hilado v CIR, G.R. No. L-9408, October 31, 1956 100 Phil 288", "tag": "Internal revenue laws are not political in nature and continue despite change of sovereignty", "topic": "I", "doctrine": "Internal revenue laws are not political in nature. Thus, they continue in force despite enemy occupation or a change of sovereignty, unless altered by a competent legislative authority. Tax laws are deemed laws of the occupied territory, not laws of the occupying enemy, and remain effective until validly changed.", "facts": "Hilado claimed as a deduction in his 1951 income tax return a portion of his property losses sustained during World War II, relying on BIR General Circular No. V-123, which allowed certain unpaid war losses to be deducted in a later year. BIR subsequently revoked that circular and assessed Hilado for deficiency income tax, ruling that the losses were deductible only in the taxable year when they were actually sustained. Hilado argued that he could not have deducted them during the war because there was “no taxable year” during the Japanese occupation, Philippine internal revenue laws supposedly being unenforceable then. SC rejected this argument. Internal revenue laws are not political in nature and remained in force during enemy occupation; indeed, income tax returns were filed and taxes were paid during that period. Thus, the wartime years remained taxable years, and Hilado could not shift his wartime losses to 1951.", "nature": "Appeal from deficiency income tax assessment"}, {"name": "Sison v Ancheta (1984)", "tag": "Legislature may classify taxpayers; compensation vs net income", "topic": "I", "doctrine": "The power to tax is an attribute of sovereignty and the strongest of all the powers of government, but for all its plenitude, it is not unconfined and remains subject to constitutional limitations. Within these limits, it is inherent in the power to tax that the State is free to select the subjects of taxation and to make reasonable and natural classifications for purposes of taxation.", "facts": "Sison challenged B.P. Blg. 135 for imposing higher tax rates on income from business or profession than on compensation income, alleging violations of due process, equal protection, and uniformity in taxation. SC upheld the law, emphasizing that the power to tax is an inherent attribute of sovereignty and the strongest of all governmental powers, necessary to provide the revenues for vital State functions, but for all its plenitude, it is not unconfined and remains subject to constitutional limitations. A tax may be struck down if it is arbitrary or confiscatory, beyond the State’s jurisdiction, not for a public purpose, or, if retroactive, so harsh and unreasonable as to violate due process. Here, Sison failed to establish arbitrariness, and the presumption of constitutionality prevailed. SC further held that it is inherent in the power to tax that the State is free to select the subjects of taxation and make reasonable and natural classifications. Compensation earners could validly be distinguished from professionals and businessmen because the former have practically no overhead expenses, while the latter incur varying costs in producing income; hence, the classification rested on substantial distinctions and did not violate equal protection or uniformity in taxation.", "nature": "Petition for declaratory relief/prohibition challenging the constitutionality of B.P. Blg. 135, which imposed different income tax treatment on compensation earners and professionals/businessmen."}, {"name": "Lutz v Araneta (1955)", "tag": "Taxation may be used as an implement of police power", "topic": "I", "doctrine": "Taxation may be made the implement of the State’s police power. When a tax is levied with a regulatory purpose to promote the general welfare, legislative discretion must be allowed full play, subject only to the test of reasonableness. Once the objective and the means adopted are constitutionall
