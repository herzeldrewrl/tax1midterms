ses. The City argued that the Section 21 tax was an indirect tax borne by consumers rather than a tax on the petitioners’ businesses. SC rejected this distinction because all the taxes were imposed on the same subject matter, the privilege of doing business in Manila, and for the same purpose of contributing to city revenues. They were likewise imposed by the same taxing authority, within the same jurisdiction and taxing period, and were all local business taxes. The Sec 21 assessment therefore constituted double taxation, and the taxes collected from the petitioners under that provision were ordered refunded.", "nature": ""}, {"name": "CIR v Fisher (1961)", "tag": "*California-Philippine Estate Tax Reciprocity – “Total or None at All”", "topic": "VII", "doctrine": "The reciprocity must be TOTAL — with respect to transfer or death taxes of any and every character. If either state imposes and does not exempt any transfer, death, legacy or succession tax of any character, the reciprocity does not work. There can be no partial reciprocity; it is \"total or none at all.\" Since the Philippines imposes both estate and inheritance taxes, while California exempts only the inheritance tax and the US Federal law imposes an estate tax on non-resident aliens without reciprocity, there is no total reciprocity; the estate of a California resident is not exempt from Philippine inheritance tax.", "facts": "Walter Stevenson, a British subject who died in California, left intangible personal property consisting of 210,000 shares of stock in a Philippine corporation. His estate claimed exemption from Philippine inheritance tax under Section 122 of the National Internal Revenue Code, invoking reciprocity with California. Although California law granted an exemption from inheritance tax on intangibles under certain reciprocal conditions, the Philippines imposed both estate and inheritance taxes, while U.S. federal law imposed an estate tax on nonresident noncitizens without a reciprocity exemption. The Supreme Court held that the reciprocity contemplated by Section 122 must be complete and cover taxes of every character. Because there was no total reciprocity, the estate was not entitled to the inheritance-tax exemption.", "nature": ""}, {"name": "Sison Jr v. Ancheta (1984)", "tag": "*Professional Income Taxed at Higher Rates – Taxing Power Limited by Due Process", "topic": "VII", "doctrine": "Adversely aﬀecting as it does property rights, both the due process and equal protection clauses may properly be invoked to invalidate in appropriate cases a revenue measure. If it were otherwise, there would be truth to the 1803 dictum of Chief Justice Marshall that \"the power to tax involves the power to destroy.\" In a separate opinion in Graves v. New York… Justice Frankfurter could rightfully conclude: \"The web of unreality spun from Marshall's famous dictum was brushed away by one stroke of Mr. Justice Holme's pen: 'The power to tax is not the power to destroy while this Court sits.’” So it is in the Philippines.", "facts": "Sison challenged Section 1 of Batas Pambansa Blg. 135, which imposed higher tax rates on taxable net income derived from professions and businesses than on compensation income. He claimed that the distinction was arbitrary, oppressive, and confiscatory, violating due process, equal protection, and uniformity in taxation. The Supreme Court recognized that the taxing power is subject to constitutional limitations and that a tax measure that is arbitrary or amounts to confiscation may be invalidated under due process. However, the mere allegation of arbitrariness was insufficient because there must be a factual foundation showing the alleged unconstitutional taint. The Court found the classification between compensation income and professional/business income reasonable and dismissed the petition.", "nature": ""}, {"name": "Roxas v CTA (1968)", "tag": "*Government-Requested Sale of Nasugbu Hacienda to Tenant-Farmers: Tax Power Must Not Penalize Taxpayer for Helping Land Reform", "topic": "VII", "doctrine": "The power of taxation is sometimes called also the power to destroy. Therefore it should be exercised with caution to minimize injury to the proprietary rights of a taxpayer. It must be exercised fairly, equally and uniformly, lest the tax collector kill the hen that lays the golden egg. In order to maintain the general public's trust and confidence in the Government, this power must be used justly and not treacherously.", "facts": "The Roxas brothers' partnership sold 13,500 hectares of its Nasugbu hacienda to tenant-farmers on installment, at the Government's request and with RFC financing, and reported only 50% of the gains as capital gain under Sec. 34 of the Tax Code. The Commissioner treated the partnership as a real estate dealer because it subdivided and sold to hundreds of farmers, taxed 100% of the gains as ordinary income, and the CTA sustained this with modifications. SC reversed in large part, holding that the sale was an isolated transaction made in line with the Government's land distribution policy, so the lands were capital assets and the gain was taxable at only 50%. The Court stressed that taxation must be exercised fairly, and that the Government cannot enlist a taxpayer's help and then penalize him for it. Roxas y Cia. remained liable only for the P150 dealer's fixed tax for 1952, and the brothers for reduced 1955 deficiencies.", "nature": ""}, {"name": "Collector v. University of Sto. Tomas (1958)", "tag": "*UST Press Refund Barred by Prescription – Deficiency Tax on School Annuals Not Set Off; Doctrine Not Binding in PH", "topic": "VII", "doctrine": "Not Binding in PH* Doctrine: The doctrine of equitable recoupment is a common law principle or doctrine, and is not binding in this jurisdiction. There is nothing in our laws, particularly the tax law, authorizing its acceptance and application. The doctrine means that when the refund of a tax illegally or erroneously collected or overpaid by a taxpayer is barred by the statute of limitations and a tax is being presently assessed against said taxpayer, said present tax may be recouped or set off against the tax, the refund of which has been barred. Its application would lower the bars of prescription and the statute of limitations. The drawbacks to its acceptance and enforcement far outweigh the advantages and benefits, and unless and until the Legislature sees fit and finds it beneficial and necessary to introduce this doctrine into this jurisdiction by means of legislation, the Court is not prepared, neither is it inclined, to accept and introduce the same as a legal principle which the courts may invoke and apply in interpreting and applying the tax laws.", "facts": "UST operated the UST Press, which printed and bound materials for other university departments, the school annuals Thomasian and Veritas, and jobs for the public, and paid 2% percentage tax on all its gross receipts. The tax paid on the receipts from the other university departments (P7,199.45) was later found to have been erroneously collected, but UST filed its refund action in the CTA on September 8, 1954, more than four years after the last payment on July 15, 1950, so the claim was barred by the two-year period in Section 306. Meanwhile, the Collector validly assessed a deficiency percentage tax and surcharge of P2,451.04 on the undeclared receipts from the annuals, which were not exempt under Section 191 for lack of fixed prices for subscription and sale. The CTA, applying equitable recoupment, deemed the deficiency assessment paid by way of set off against the erroneously collected but prescribed P7,199.45 and ordered the Collector to desist from collecting it. The SC reversed on this point, holding that the doctrine is a common law principle not authorized by any Philippine statute and that Sections 306 and 309 give the taxpayer no right of set off or credit where, because of the expiration of the period of prescription, his right to a refund is already barred. Under Section 309, the Collector \"may\" credit or refund taxes erroneously received, but the word \"may\" clearly implies discretion, and he cannot be compelled by the courts to do so. Hence, the Tax Court erred in applying said doctrine, and the Collector may still collect the deficiency percentage tax and surcharge against UST.", "nature": ""}, {"name": "Bagatsing v. San Juan (1996)", "tag": "", "topic": "VII", "doctrine": "To constitute a taxpayer's suit, two requisites must be met: that public funds are disbursed by a political subdivision or instrumentality and in doing so, a law is violated or some irregularity is committed, and that the petitioner is directly affected by the alleged ultra vires act", "facts": "In 1975, Rizal Province acquired four parcels of land from Ortigas for the construction of schools and a hospital, but the construction never materialized. The Province later sold the property to Valley View, but rescinded the sale and eventually entered into a compromise agreement with Ortigas for the reconveyance of the land. The Anti-Graft League challenged the transaction as a taxpayer’s suit, alleging illegal disbursement of public funds. SC dismissed the petition, holding that no illegal disbursement was shown and petitioner had no legal standing or cause of action, being a stranger to the Province-Ortigas contract.", "nature": ""}, {"name": "Marcos v CA (1997)", "tag": "*Marcos Estate Tax Assessment – BIR, Not DOJ or Probate Court, Determines Taxes Due", "topic": "VIII-A", "doctrine": "The assessment and collection of all national internal revenue taxes are executive in character and are powers and duties of the Bureau of Internal Revenue. It is not the Department of Justice which is the government agency tasked to determine the amount of taxes due upon an estate, but the BIR, whose determinations and assessments are presumed correct and made in good faith; the taxpayer has the duty of proving otherwise. If there is any issue as to the validity of the BIR’s decision to assess taxes, it must be pursued through the proper administrative and judicial avenues provided by law: the assessment must first be protested administratively, and the decision on the protest may thereafter be appealed to the Court of Tax Appeals. An assessment not timely protested becomes final and unappealable, and objections to it can no longer be raised through certiorari as a disguised protest.", "facts": "After Ferdinand Marcos Sr.’s death, BIR investigated his and his family’s tax liabilities and assessed his estate approximately ₱23.29 billion in deficiency estate taxes, later proceeding against estate properties through levy and sale. Ferdinand Marcos Jr. challenged the assessment and collection, relying in part on differing findings by a DOJ panel and arguing that the probate proceedings and disputes over estate properties made the assessment premature. SC held that BIR, not the DOJ or the probate court, is the government agency tasked with determining the taxes due upon the estate, and any challenge to its assessment should have been pursued through the administrative protest procedure and, if necessary, an appeal to CTA. Because Marcos and the other heirs failed to protest the assessments despite sufficient notice, the assessments became final, executory, and enforceable and could no longer be attacked through certiorari. SC therefore upheld BIR’s assessment and collection measures and denied the petition.", "nature": "Estate tax assessment and collection case brought by Ferdinand R. Marcos II challenging the BIR’s deficiency estate tax assessment against the estate of Ferdinand E. Marcos and the resulting levy and sale of estate properties."}, {"name": "Philippine American Life v Secretary of Finance (2014)", "tag": "*PhilamCare Share Sale Below Book Value – CIR Tax Interpretation Reviewed by Finance Secretary, Then CTA", "topic": "VIII-A", "doctrine": "The power to interpret the provisions of the NIRC and other tax laws is under the exclusive and original jurisdiction of the Commissioner of Internal Revenue, subject to review by the Secretary of Finance. Although no provision expressly provides where the Secretary of Finance’s ruling in the exercise of this review power is appealable, Sec. 7(a)(1) of R.A. No. 1125, as amended, impliedly vests the CTA with jurisdiction as an other matter arising under the NIRC or other laws administered by the BIR. As the specialized quasi-judicial agency mandated to adjudicate tax, customs, and assessment cases, the CTA is the proper forum for matters calling for technical knowledge of tax treatment. The CTA may also, through its power of certiorari, rule on the validity of an administrative rule or regulation so long as the matter is within its appellate jurisdiction, including the validity of a revenue regulation or memorandum circular on which the tax treatment is based.", "facts": "Philamlife sold its PhilamCare shares through competitive bidding and sought a BIR ruling that the transaction was not subject to donor’s tax, but CIR ruled that the difference between the shares’ book value and selling price was a taxable donation under Sec. 100 of the NIRC. Philamlife sought review by the Secretary of Finance, who affirmed the CIR, and then appealed to the CA, which dismissed the petition for lack of jurisdiction on the ground that the controversy belonged to the CTA. SC clarified that because the CIR had exercised her power to interpret tax laws, her ruling was first reviewable by the Secretary of Finance, rather than directly by the CTA. From the Secretary’s adverse ruling, however, recourse lies with the CTA under its jurisdiction over other matters arising under the NIRC, notwithstanding the absence of an express statutory provision governing such appeals. CTA could also determine the validity of the revenue issuances underlying the disputed tax treatment because those questions fell within its appellate jurisdiction.", "nature": "Donor’s tax case brought by Philippine American Life and General Insurance Company challenging the Secretary of Finance’s affirmance of a BIR ruling that sale of PhilamCare shares below book value was subject to donor’s tax."}, {"name": "CIR v San Miguel Corporation (2019)", "tag": "*Red Horse Excise Tax – BIR Regulation Cannot Add a Tax Qualification Absent from the Tax Code", "topic": "VIII-A", "doctrine": "In case of discrepancy between the basic law and a rule or regulation issued to implement said law, the basic law prevails, as the rule or regulation cannot go beyond the terms and provisions of the basic law. The objective of issuing BIR Revenue Regulations is to establish parameters or guidelines within which tax laws should be implemented, and not to amend or modify their substantive meaning and import. Thus, where nothing in Sec. 143 of the Tax Reform Act of 1997 authorized the additional qualification that the new specific tax rate should not be lower than the excise tax actually being paid prior to January 1, 2000, such qualification in RR No. 17-99 constituted unauthorized administrative legislation and was an invalid exercise of the power to interpret tax laws and promulgate implementing rules.", "facts": "SMC paid excise taxes on Red Horse beer under RR No. 17-99, which provided that the new specific tax rate effective January 1, 2000 could not be lower than the excise tax actually paid before that date, and later sought a refund of the resulting excess payments. SMC argued that this qualification improperly extended the three-year transition rule under the Tax Code, which ended on December 31, 1999. SC agreed that Sec. 143 required the statutory specific tax rates to increase by 12% beginning January 1, 2000 without the additional floor imposed by RR No. 17-99. Because BIR regulation added a substantive qualification unsupported by the statute, it was invalid and could not serve as the basis for collecting the additional excise tax. SMC was therefore entitled to refund or credit of its excess payments, subject to the statutory two-year period for tax refund claims and sufficient proof of the amount claimed.", "nature": "Excise tax refund case involving San Miguel Corporation’s claim for refund or tax credit of excise taxes paid on Red Horse beer pursuant to RR No. 17-99, which imposed a minimum tax rate not found in the Tax Code."}, {"name": "Subic Bay Chamber of Commerce v. DOF (2025)", "tag": "*Subic Domestic Enterprises Excluded from VAT Zero-Rating – BIR and DOF Cannot Narrow CREATE Act", "topic": "VIII-A", "doctrine": "The power to promulgate rules in the implementation of a statute is necessarily limited to what is provided for in the legislative enactment. An administrative agency cannot amend an Act of Congress; its rule-making power must be confined to details for carrying the law into effect and cannot be extended to amend or expand statutory requirements or embrace matters not covered by the statute. If a discrepancy occurs between the basic law and an implementing rule or regulation, the former prevails. Further, CTA has exclusive jurisdiction within the judicial system to resolve tax problems, including direct and indirect challenges to the validity or constitutionality of tax regulations and administrative issuances. However, CTA’s authority does not dispense with exhaustion of administrative remedies: challenges to BIR revenue issuances should generally first be elevated to the Secretary of Finance pursuant to the CIR’s power under Sec. 4 of the Tax Code, subject to recognized exceptions.", "facts": "SBFCC, a Subic Bay Freeport enterprise, challenged CREATE implementing rules and BIR issuances that limited VAT zero-rating on local purchases to registered export enterprises, thereby excluding domestic market enterprises. It filed a petition for declaratory relief before the RTC, which dismissed the case because challenges to the validity of tax regulations and administrative issuances fall within the CTA’s jurisdiction. SC affirmed that CTA is the proper judicial forum and that challenges to BIR issuances ordinarily must first be elevated to the Secretary of Finance, although it excused exhaustion here because the VAT treatment affected all domestic market enterprises registered in the Subic Freeport and involved strong public interest. On the merits, the Court held that the CREATE Act granted VAT zero-rating to registered business enterprises, including both export and domestic market enterprises, so the administrative issuances could not carve out DMEs from the statutory incentive. The challenged provisions were therefore declared void for having been issued in excess of the DOF’s and BIR’s jurisdiction.", "nature": "Petition for Declaratory Relief on VAT zero-rating case brought by Subic Bay Freeport enterprises challenging CREATE Act implementing rules and BIR issuances that excluded registered domestic market enterprises from VAT zero-rating on their local purchases."}, {"name": "CIR v. Pacific Hub Corp. (2024)", "tag": "*Unremitted Taxes and Abatement Request – CIR’s Discretion Reviewable for Grave Abuse", "topic": "VIII-A", "doctrine": "Under Sec. 204(B) of the Tax Code, the CIR has the purely discretionary power to abate or cancel a tax liability when the tax or any portion thereof appears to be unjustly or excessively assessed, or when the administration and collection costs involved do not justify collection of the amount due. While courts may generally not interfere with the exercise of a purely administrative or discretionary power, an exception arises when the issuing authority has gone beyond its statutory authority, exercised unconstitutional powers, or clearly acted arbitrarily or with grave abuse of discretion. Thus, the exercise of the CIR’s discretionary power to abate or cancel taxes, penalties, and interests, if attended by grave abuse of discretion, is appealable to the CTA under its other matters jurisdiction. The CIR must exercise discretion within the parameters set by law and BIR regulations, including the requirement under RR No. 13-2001 that a denial of an application for abatement state the reasons therefor.", "facts": "Pacific Hub declared but failed to fully remit its withholding taxes and VAT for 2005 and 2006, later paid the basic deficiency taxes, and applied for abatement of the penalties, surcharges, and interests because of continued financial losses. The CIR denied the application without stating any reason and subsequently issued a warrant of distraint and/or levy, prompting Pacific Hub to seek relief before CTA. SC held that although the power to grant or deny abatement is discretionary, CTA may review its exercise for grave abuse of discretion under its other matters jurisdiction. CIR gravely abused its discretion by failing to comply with RR No. 13-2001’s positive duty to state the reasons for denying the application, while the warrant was likewise void because no prior final assessment had established Pacific Hub’s actual tax liability. The nullification of the denial and warrant, however, did not mean that the application for abatement was granted, as the ultimate determination of whether abatement should be allowed remained within CIR’s discretion.", "nature": "Application for abatement and collection case arising from Pacific Hub Corporation’s application to abate penalties, surcharges, and interest on previously unremitted withholding taxes and VAT, which the CIR denied without stating reasons before issuing a warrant of distraint and levy."}, {"name": "Pacquiao v. CTA (2016)", "tag": "*₱3.3-Billion Tax Collection – CTA May Suspend Collection and Dispense with Bond", "topic": "VIII-B", "doctrine": "Under Sec. 11 of R.A. No. 1125, an appeal to the CTA does not suspend the payment, levy, distraint, or sale of the taxpayer’s property for satisfaction of the tax liability. However, when collection may jeopardize the interest of the Government and/or the taxpayer, the CTA may suspend collection and require a cash deposit or surety bond. The CTA has ample authority to restrain the collection of tax and even dispense with the deposit or bond whenever the method employed by the CIR in the collection of tax jeopardizes the taxpayer’s interests for being patently in violation of law. This authority is not confined to cases where prescription has set in and emanates from both Sec. 11 and the CTA’s jurisdiction under Sec. 7 of R.A. No. 1125 over disputed assessments and other matters arising under the Tax Code. Whether the CIR employed methods not sanctioned by law is a question of fact requiring reception of evidence, which the CTA, as the specialized tax court, is in the proper position to determine.", "facts": "CIR assessed spouses Manny and Jinkee Pacquiao billions of pesos in deficiency income taxes and VAT and pursued collection through warrants of distraint, levy, and garnishment while their challenge to the assessments was pending before the CTA. CTA suspended collection but required them to deposit approximately ₱3.3 billion or post a ₱4.95-billion bond as security under Sec. 11 of R.A. No. 1125. The Pacquiaos argued that the security requirement should be dispensed with because the assessment and collection methods themselves were patently illegal and violated due process. SC held that the CTA may dispense with or reduce the security when the CIR’s collection methods are shown to be patently contrary to law, but the existing record was insufficient to determine whether that exception applied. The case was therefore remanded to the CTA for a preliminary hearing to determine whether the bond should be dispensed with or reduced before proceeding with the underlying tax case.", "nature": "Tax assessment and collection case brought by spouses Manny and Jinkee Pacquiao challenging the CTA’s requirement that they post a multibillion-peso cash deposit or surety bond as a condition for suspending the BIR’s collection of alleged deficiency income taxes."}, {"name": "Commissioner of Internal Revenue v. V.Y. Domingo Jewellers, Inc. (2019)", "tag": "*Preliminary Collection Letter Before Protest – Assessment Itself Is Not Appealable to CTA", "topic": "VIII-B", "doctrine": "CTA, being a court of special jurisdiction, can take cognizance only of matters clearly within its jurisdiction. The word decisions under Sec. 7 of R.A. No. 1125, as amended, means the decisions of the CIR on the protest of the taxpayer against the assessments, and does not signify the assessment itself. Where a taxpayer questions an assessment and asks the CIR to reconsider or cancel it, the assessment becomes a disputed assessment which the CIR must decide, and the taxpayer may appeal to the CTA only upon receipt of the CIR’s decision on the disputed assessment or upon the CIR’s inaction within the period provided by law. Thus, Sec. 228 of the Tax Code requires the taxpayer to exhaust administrative remedies by filing a request for reconsideration or reinvestigation within 30 days from receipt of the assessment before resorting to the CTA.", "facts": "V.Y. Domingo received a Preliminary Collection Letter informing it of deficiency income tax and VAT assessments and subsequently obtained certified copies of the assessment notices on September 15, 2011. Instead of administratively protesting the assessments within 30 days, it filed a petition for review with the CTA the following day, treating the Preliminary Collection Letter as the CIR’s final decision. SC held that the collection letter was neither a decision on a disputed assessment nor equivalent to the final decision involved in Allied Banking, whose language expressly characterized itself as the CIR’s final decision and directed the taxpayer to appeal. Because V.Y. Domingo had not yet disputed the assessment administratively, there was no decision on a disputed assessment for the CTA to review, and its immediate resort to the CTA violated the doctrine of exhaustion of administrative remedies. CTA First Division therefore correctly dismissed the petition for lack of jurisdiction.", "nature": "Deficiency tax assessment case involving V.Y. Domingo Jewellers’ direct appeal to the CTA after receiving a Preliminary Collection Letter for deficiency income tax and VAT without first filing an administrative protest against the final assessment notices."}, {"name": "CIR v CTA (2021)", "tag": "*Shell Alkylate Importations – CTA May Review BIR Ruling and Issue TRO, but Suspension Order Requires Existing Tax Liability", "topic": "VIII-B", "doctrine": "Within the judicial system, the law intends the CTA to have exclusive jurisdiction to resolve all tax problems, including direct challenges to the constitutionality or validity of tax laws, regulations, and administrative issuances. A BIR ruling is distinguished by its relation to a particular taxpayer’s facts and circumstances and the consequent determination of taxability or exemption. In aid of its jurisdiction, the CTA may issue TROs or writs of preliminary injunction to enjoin the implementation of a challenged tax issuance, while a Suspension Order under Sec. 11 of the CTA Law requires an existing tax liability based on a disputed tax assessment, decision, ruling, or inaction mandating payment of taxes. The CTA’s appellate jurisdiction must have as its object a final assessment coupled with a formal demand to pay, not a preliminary assessment or an inchoate future assessment. Further, the CTA En Banc has jurisdiction over final orders or judgments, but not interlocutory orders issued by a CTA Division.", "facts": "CIR issued Document No. M-059-2012 declaring Shell’s alkylate importations subject to excise tax, which resulted in a demand for approximately ₱1.99 billion and assessments on subsequent importations. SC held that the document was a BIR ruling because it interpreted the Tax Code as applied to Shell’s particular transactions and determined their taxability, and that CTA had jurisdiction to directly review its validity under BDO CTA could suspend collection of the ₱1.99-billion assessment because the demand letter constituted a final assessment ripe for judicial review, but it could not issue Sec. 11 Suspension Orders covering subsequent or future importations that had not yet resulted in final assessments properly elevated to it. A TRO or WPI, rather than a Suspension Order, was the proper provisional remedy to enjoin implementation of the BIR ruling itself and could indirectly suspend taxes arising from it. SC also upheld CTA En Banc’s refusal to entertain an appeal from CTA Division’s interlocutory denial of a motion to dismiss.", "nature": "Tax collection and prescription case involving the BIR’s efforts to collect deficiency taxes and the determination of whether its right to collect had prescribed under the Tax Code."}, {"name": "People v. Mendez (2023)", "tag": "*Unfiled and Inaccurate ITRs – Criminal Tax Case Carries Civil Tax Collection Without Prior Assessment", "topic": "VIII-B", "doctrine": "When a criminal action for violation of the tax laws is filed, a prior assessment is not required. Neither is a final assessment a precondition to collection of delinquent taxes in the criminal tax case. The criminal action is deemed a collection case. Under Sec. 7(b)(1) of R.A. No. 9282, the filing of the criminal action necessarily carries with it the corresponding civil action for the recovery of taxes and penalties, thereby dispensing with delinquency or a formal assessment as a condition precedent to collection in the same criminal case. The government must therefore prove the guilt of the accused beyond reasonable doubt and the accused’s civil liability for taxes by competent evidence other than an assessment.", "facts": "Mendez was prosecuted for willfully failing to file his 2002 ITR and for failing to report income from his other clinics in his 2003 ITR, with the BIR reconstructing his income through third-party information and the best evidence obtainable. CTA convicted him under Sec. 255 but refused to impose civil liability for the deficiency taxes because the CIR had not issued a final assessment. SC affirmed the convictions but held that CTA erred in requiring a formal assessment before determining Mendez’s civil tax liability. Under R.A. No. 9282, the criminal action necessarily carries with it the civil action for recovery of the taxes and penalties, and a formal assessment is no longer a condition precedent to such recovery. The cases were remanded to the CTA Division to determine Mendez’s civil liability for taxes and penalties based on competent evidence.", "nature": "Criminal tax evasion case involving the prosecution of taxpayers for alleged violations of the Tax Code arising from their failure to file or correctly report and pay taxes, raising issues concerning the CTA’s jurisdiction over criminal tax cases."}, {"name": "DOE v. CIR (2023)", "tag": "*DOE’s ₱18.38-B Excise Tax Assessment – Intra-Government Tax Dispute Goes to Administrative Settlement, Not CTA", "topic": "VIII-B", "doctrine": "P.D. No. 242 is the special law governing all disputes exclusively between government agencies, offices, and instrumentalities, while R.A. No. 1125, as amended, is the general law governing the CTA’s appellate jurisdiction, including disputed tax assessments. Thus, notwithstanding the CTA’s jurisdiction over disputed assessments, disputes solely between agencies or offices of the Executive Branch must be submitted to administrative settlement under P.D. No. 242. The authority to resolve such disputes is vested in the President as part of the President’s power of control and may be exercised through the Secretary of Justice or the Solicitor General, as the case may be.", "facts": "BIR assessed the DOE approximately ₱18.38 billion in deficiency excise taxes and subsequently issued warrants of distraint, levy, and garnishment after treating the assessment as final and demandable. DOE challenged the assessment and collection measures before the CTA, arguing that it was not liable for the excise tax, that condensates were exempt, and that the BIR had violated its right to due process in issuing and serving the FLD/FAN. CTA dismissed the petition for lack of jurisdiction because the controversy was exclusively between two executive agencies, and SC affirmed. SC held that although R.A. No. 1125 generally grants the CTA jurisdiction over disputed assessments, P.D. No. 242 specifically governs disputes solely among government agencies and therefore requires their administrative settlement. Accordingly, the DOE-BIR dispute had to be resolved through the administrative mechanism under P.D. No. 242 rather than by the CTA.", "nature": "Deficiency excise tax assessment and collection case brought by the Department of Energy challenging the BIR’s approximately ₱18.38-billion assessment and warrants of distraint, levy, and garnishment, raising the proper forum for resolving tax disputes exclusively between executive government agencies."}, {"name": "CIR v. Marilyn Development Corp. (2025)", "tag": "*Unraised LoA Issue – CTA Cannot Resolve Issue Requiring Additional Evidence", "topic": "VIII-B", "doctrine": "CTA may consider issues not specifically raised by the parties only if two conditions concur: first, the issue is related to the principal issue and is necessary to achieve an orderly disposition of the case; and second, its resolution would not require the presentation of additional evidence and must rely solely on factual bases already matters of record. Thus, where the existence or validity of a LoA was never put in issue, CTA cannot invalidate the assessment for lack of a LoA because doing so deprives the CIR of the opportunity to present evidence to refute the issue and conjures up secondary issues and factual matters requiring adjudication. Nevertheless, a valid LoA is a jurisdictional requirement of a valid audit or investigation by BIR, and therefore of a valid assessment, because taxpayer must be able to verify that revenue officers examining its records are duly authorized.", "facts": "CIR assessed MDC for approximately ₱8.10M in deficiency taxes for 2006, but the CTA cancelled the assessments after finding that CIR failed to present a LoA authorizing the examination of MDC’s books and that the assessments had prescribed. SC held that CTA should not have passed upon the LoA issue because neither party raised it in the pleadings or during trial, and resolving it required evidence outside the existing record. Although the CIR had waived the presentation of evidence, SC held that CTA should have reopened the case when the CIR later submitted the LoA, subject to MDC’s right to examine and challenge its validity and authenticity. On prescription, SC stressed that prescription is a matter of defense, and the taxpayer bears the burden of proving when the period began and that the full period had expired; MDC could not invoke prescription for its income tax and VAT assessments because it failed to prove the actual filing of those returns. The case was remanded to CTA Division to determine MDC’s remaining deficiency tax liabilities, excluding assessments already shown to have prescribed.", "nature": "Deficiency tax assessment case involving the validity of assessments against Marily Development Corporation for income tax, VAT, EWT, and WTC for taxable year 2006, particularly the CTA’s authority to consider an unraised LoA issue and whether the assessments had prescribed."}, {"name": "CIR v. Standard Insurance Co. (2025)", "tag": "*Unauthorized Revenue Officers – CTA Raised the LoA Issue on Its Own", "topic": "VIII-B", "doctrine": "Under Rule 14, Sec. 1 of RRCTA, in deciding a case, CTA may not limit itself to the issues stipulated by the parties but may also rule upon related issues necessary to achieve an orderly disposition of the case. Thus, CTA may consider on its own initiative matters necessary for the complete adjudication of the case, even if not specifically raised by the parties, so long as they are closely related to the issues presented. The authority of the revenue officers to conduct the audit is a related issue to the validity of the tax assessment and enforceability of collection because whether an assessment was made in the manner prescribed by law, including whether the requisite authority was obtained, is inextricably intertwined with the very question of the validity and enforceability of the assessment. CIR is not denied due process where it is afforded an opportunity to be heard and to rebut the issue.", "facts": "Standard Insurance was assessed deficiency DST based on an audit conducted by revenue officers who were not named in the original LoA, but it did not question their authority in its administrative protests or before the CTA Division. On appeal, the CTA En Banc considered the LoA issue on its own initiative and held the assessment void because the officers who conducted the subsequent audit lacked the required authority. SC upheld the CTA’s authority to do so because the revenue officers’ authority was directly related to the validity and enforceability of the assessment and was necessary for the complete disposition of the case. The CIR was not deprived of due process because it was given the opportunity to address and rebut the LoA issue, including in its motion for reconsideration. The Court ultimately affirmed the cancellation of the assessment, which was void for lack of a valid LoA and, independently, could no longer be collected because the government’s right to collect had prescribed.", "nature": "Deficiency documentary stamp tax assessment and collection case involving a 2001 DST audit conducted by revenue officers not named in the original LoA, raising the CTA’s authority to consider the LoA issue on its own initiative and whether the BIR’s right to collect had prescribed."}, {"name": "Commissioner of Internal Revenue v. Tours Specialists, Inc. (1990)", "tag": "Tourist Hotel Payments Held in Trust – Money That Never Belonged to the Travel Agency Is Not Income", "topic": "IT-A", "doctrine": "Gross receipts subject to tax under the Tax Code do not include monies or receipts entrusted to the taxpayer which do not belong to them and do not redound to the taxpayer’s benefit; and it is not necessary that there must be a law or regulation which would exempt such monies and receipts within the meaning of gross receipts under the Tax Code. The hotel room charges entrusted by foreign travel agencies to Tours Specialists did not form part of its gross receipts because the said receipts never belonged to the taxpayer and it never benefited from their payment to the local hotels. The arrangement was merely an accommodation whereby the taxpayer held the amounts in trust and transmitted them to the hotels.", "facts": "Tours Specialists provided travel services to foreign tourists and, in some cases, received funds from foreign travel agencies specifically earmarked for the tourists’ hotel accommodations. The BIR included these entrusted amounts in the company’s gross receipts and assessed a deficiency 3% independent contractor’s tax. The CTA found that the funds were paid entirely to the hotels without any portion being diverted to Tours Specialists and that the arrangement was merely an accommodation for the foreign agencies. The SC affirmed, holding that amounts which never belonged to the taxpayer and did not redound to its benefit cannot constitute its taxable gross receipts. Thus, the entrusted hotel room charges were excluded from Tours Specialists’ gross receipts for purposes of the contractor’s tax.", "nature": "Contractor’s tax assessment case involving whether hotel room charges entrusted by foreign travel agencies to Tours Specialists, Inc. solely for payment to local hotels formed part of its gross receipts subject to the 3% independent contractor’s tax."}, {"name": "Commissioner of Internal Revenue v. Isabela Cultural Corporation (2007)", "tag": "*Professional Fees Billed Late – All-Events Test Determines When Expenses Accrue", "topic": "IT-A", "doctrine": "Under the accrual method, amounts of income accrue where the right to receive them becomes fixed, while liabilities are accrued when fixed and determinable in amount, without regard to indeterminacy merely of time of payment. The all-events test requires: (1) fixing of a right to income or liability to pay; and (2) the availability of the reasonable accurate determination of such income or liability. The test does not demand that the amount be known absolutely; it is sufficient that the taxpayer has the information necessary to compute it with reasonable accuracy. The propriety of an accrual must be judged by the facts the taxpayer knew, or could reasonably be expected to have known, at the closing of its books for the taxable year, and the taxpayer bears the burden of establishing the accrual of an item of income or deduction.", "facts": "ICC, which used the accrual method of accounting, claimed in 1986 deductions for legal services rendered in 1984 and 1985 and auditing services relating to its 1985 financial statements, arguing that the amounts became determinable only when it received the bills in 1986. SC rejected this argument because ICC failed to prove that the liabilities could not have been determined with reasonable accuracy in the years the services were rendered, particularly considering its longstanding relationship with its counsel and its ability to inquire into the amounts due. The professional fees therefore accrued in the earlier taxable years and could not be deducted in 1986 merely because billing was delayed. In contrast, the security expenses were properly deductible because they were actually incurred in 1986, while BIR also erred in compounding ICC’s interest income absent a stipulation for compound interest. The assessment was thus sustained only insofar as the BIR disallowed the deductions for the legal and auditing professional fees.", "nature": "Deficiency income tax and expanded withholding tax assessment case involving whether professional fees for legal and auditing services rendered in prior years could be deducted by an accrual-basis taxpayer in 1986 when the corresponding bills were received and paid."}, {"name": "Association of Non-Profit Clubs, Inc. v. Bureau of Internal Revenue (2019)", "tag": "*Club Membership Dues for Maintenance – Capital, Not Income", "topic": "IT-A", "doctrine": "The essential difference between capital and income is that capital is a fund; income is a flow. Capital is wealth, while income is the service of wealth. In order to constitute income, there must be realized gain. Membership fees, assessment dues, and similar fees collected by recreational clubs from their members for the maintenance, preservation, and upkeep of their general operations and facilities constitute contributions to and/or replenishment of the clubs’ funds and are therefore infusions of capital, not income. This is distinct from fees derived from income-generating facilities or activities, where gain is realized upon collection. Certainly, an income tax is arbitrary and confiscatory if it taxes capital because capital is not income.", "facts": "RMC No. 35-2012 declared that recreational clubs were subject to income tax and VAT on collections including membership fees and assessment dues after their statutory income tax exemption was omitted from the 1997 NIRC. SC agreed that recreational clubs were no longer generally exempt from income tax, but rejected BIR’s treatment of membership fees and assessment dues as taxable income because these collections were inherently dedicated to maintaining the clubs’ operations and facilities and therefore produced no realized gain. Such collections constituted capital, unlike revenues from income-generating facilities and activities such as bars, restaurants, equipment rentals, and other services, from which gain is realized. The fees were likewise not subject to VAT because their collection did not involve a sale of services by the clubs to their members. Accordingly, BIR exceeded its rule-making authority insofar as RMC No. 35-2012 classified membership fees, assessment dues, and similar collections as taxable income and VATable gross receipts.", "nature": "Declaratory relief case brought by an association of non-profit recreational clubs challenging RMC No. 35-2012, which treated membership fees, assessment dues, and similar collections as income subject to income tax and as gross receipts subject to VAT."}, {"name": "Sison v. Ancheta (1984)", "tag": "*Professional vs. Salaried Income – Different Tax Bases for Different Classes of Taxpayers", "topic": "IT-B", "doctrine": "Taxpayers may be classified into different categories, provided the classification rests upon substantial distinctions that make real differences. Compensation income earners may be treated as a separate class because there is practically no overhead expense in earning their income, while professionals and businessmen incur varying costs and expenses necessary to produce income. Thus, there is ample justification to adopt the gross system of income taxation for compensation income while continuing the net income system for professional and business income. Uniformity does not require perfect equality; it is sufficient that the tax applies equally to all persons, firms and corporations placed in similar situation.", "facts": "Sison, a professional taxpayer, challenged B.P. Blg. 135 on the ground that it subjected income from the exercise of a profession to higher tax treatment than compensation income earned by salaried taxpayers. The SC rejected the challenge, explaining that the distinction concerned not merely tax rates but also the tax base applicable to different classifications of income. Compensation earners could reasonably be subjected to gross income taxation because they generally have no overhead expenses, whereas professionals and businessmen have varying expenses necessary to produce their income and are therefore taxed on net income. The classification rested on substantial distinctions and applied uniformly to taxpayers similarly situated, satisfying equal protection and the constitutional requirement of uniform taxation. Accordingly, the different tax treatment of compensation income and professional or business income was upheld.", "nature": "Constitutional challenge by a professional taxpayer against B.P. Blg. 135, alleging that the imposition of different income tax treatment on professionals and businessmen, on one hand, and compensation income earners, on the other, violated due process, equal protection, and the constitutional requirement of uniform and equitable taxation."}, {"name": "Iconic Beverages, Inc. v. Commissioner of Internal Revenue (2015)", "tag": "*IP Licensing as Main Business – Royalties Are Active, Not Passive, Income", "topic": "IT-B", "doctrine": "If income is generated in the active pursuit and performance of the corporation’s primary purposes, the same is not passive income. Passive income is income generated by the taxpayer’s assets without such active pursuit, while income not forming part of passive income subject to specific rates or final taxes remains part of the taxpayer’s gross income subject to the normal corporate income tax. Thus, although royalties may generally constitute passive income, the determination of whether royalty income is passive depends on whether it was generated in the active pursuit and performance of the corporation’s primary purpose. Where licensing intellectual property rights is part of the corporation’s primary purpose and the royalties constitute its main source of income, the royalties are active business income subject to regular corporate income tax.", "facts": "Iconic Beverages reported ₱856.06 million in royalties from licensing its intellectual property rights to SMBI and MPLI and treated the royalties as passive income subject to 20% final withholding tax. BIR assessed deficiency income tax on the ground that the royalties were earned in the active pursuit of Iconic’s business and were therefore subject to the regular corporate income tax. CTA found that owning and licensing intellectual property rights formed part of Iconic’s primary corporate purpose and that its financial statements showed royalties as its main source of income, with no operating expenses indicating substantial manufacturing or beverage-selling activities. Thus, the licensing transactions were not merely isolated or incidental, and the royalty income constituted active business income rather than passive income. CTA upheld the deficiency income tax assessment, but cancelled the compromise penalty because Iconic had not consented to it.", "nature": "Deficiency income tax assessment case involving whether royalties earned by Iconic Beverages from licensing its intellectual property rights to San Miguel Brewery, Inc. and My Philippines Lifestyle, Inc. constituted passive income subject to 20% final withholding tax or active business income subject to the regular corporate income tax."}, {"name": "Tan v. Del Rosario (1994)", "tag": "", "topic": "IT-D", "doctrine": "The phrase “income taxpayers” is an all-embracing term under the Tax Code that practically covers all persons who derive taxable income. For purposes of income taxation, the Tax Code classifies taxpayers into four main groups: Individuals Corporations Estates under Judicial Settlement Irrevocable Trusts — irrevocable as to both corpus and income. Partnerships are classified as either taxable partnerships or exempt partnerships: Taxable partnerships are ordinarily subject to income tax and are assimilated to corporations for income-tax purposes. Exempt partnerships, on the other hand, are not considered independent taxable entities for income-tax purposes. A general professional partnership (GPP) is an example. A general professional partnership is not itself an income taxpayer. The income tax is imposed upon the individual partners, who are liable in their individual capacities on their respective distributive shares of the partnership profits, whether distributed or otherwise. Thus, a GPP operates essentially as a “flow-through entity” or mechanism through which income is generated and ultimately distributed to the individual partners. There is no distinction in income-tax liability between a professional who practices individually and one who practices through a general professional partnership; in either case, the professional is taxed as an individual taxpayer. A GPP qualifies for this treatment only when it is formed for the sole purpose of exercising a common profession and no part of its income is derived from engaging in trade or business. Otherwise, it is treated as an ordinary business partnership, which is taxed as a corporation. Uniformity of taxation does not require that every taxpayer be taxed identically. It permits reasonable classifications, provided that similarly situated taxpayers within the same class receive the same treatment in privileges and liabilities.", "facts": "Rufino R. Tan, claiming to be a taxpayer adversely affected by its implementation, challenged the constitutionality of Republic Act No. 7496, otherwise known as the Simplified Net Income Taxation Scheme (SNIT). He argued, among others, that the law violated the constitutional requirements of uniform and equitable taxation, equal protection, and due process, particularly because it treated self-employed individuals and professionals differently from corporations and partnerships. The Court explained that uniformity of taxation does not prohibit reasonable classification; it requires taxpayers or objects similarly situated to be treated alike. A tax classification is permissible when it rests on substantial distinctions, is germane to the legislative purpose, applies to present and future conditions, and applies equally to everyone within the same class. In resolving the related controversy concerning professionals practicing through general professional partnerships, the Court clarified the different kinds of income taxpayers under the Tax Code. It emphasized that a GPP is not itself an income taxpayer; rather, the individual partners are taxed on their respective distributive shares of the partnership profits. SC dismissed the petitions, sustaining the challenged tax scheme and explaining that the relevant revenue regulation merely confirmed the existing rule on the taxation of individual partners and did not improperly make a GPP an independently taxable entity.", "nature": ""}, {"name": "Afisco Insurance Corporation v. Court of Appeals (1999)", "tag": "", "topic": "IT-D", "doctrine": "The term partnership includes a syndicate, group, pool, joint venture or other unincorporated organization, through or by means of which any business, financial operation, or venture is carried on. The fact that the pool does not retain any profit or income does not obliterate an antecedent fact, that of the pool being used in the transaction of business for profit. The pool is a taxable entity distinct from the individual corporate entities of the ceding companies.", "facts": "The 41 non-life insurance corporations entered into Quota Share and Surplus Reinsurance Treaties with Munchener Ruckversicherungs-Gesselschaft (Munich), a nonresident foreign insurance corporation, and pursuant to those treaties formed a Pool of Machinery Insurers to facilitate their reinsurance business. The Commissioner of Internal Revenue assessed the pool for deficiency corporate income tax and withholding taxes, treating it as a taxable entity, and the CTA and subsequently the CA sustained the assessment. The petitioners elevated the case to the SC arguing principally that the pool was merely a clearing house or agent, not a partnership or association taxable as a corporation, and that the remittances to the members and Munich were not taxable dividends. SC denied the petition and affirmed the CA, holding that the pool was taxable as a corporation, its relevant remittances were taxable, and the government's right to assess and collect had not prescribed.", "nature": ""}, {"name": "Commissioner of Internal Revenue v. Baier-Nickel (2006)", "tag": "", "topic": "IT-D", "doctrine": "Pursuant to the NIRC, non-resident aliens, whether or not engaged in trade or business, are subject to Philippine income taxation on their income received from all sources within the Philippines. Thus, the keyword in determining the taxability of non-resident aliens is the income's \"source.\" \"Source of income\" relates to the property, activity or service that produced the income. With respect to rendition of labor or personal service, as in the instant case, it is the place where the labor or service was performed that determines the source of the income.", "facts": "Juliane Baier-Nickel, a nonresident German citizen and President of JUBANITEX, Inc., was separately engaged as the corporation's commission agent, entitled to a 10% sales commission on sales actually concluded and collected through her efforts. In 1995, she received ₱1,707,772.64 in commissions, from which JUBANITEX withheld ₱170,777.26 as tax; she later sought a refund on the ground that the commissions compensated services allegedly performed in Germany and therefore constituted income from sources outside the Philippines. The CTA denied the refund, while the Court of Appeals reversed and ordered the refund, reasoning that the income-producing marketing activities were performed in Germany, prompting the CIR to appeal to the Supreme Court. SC granted CIR's petition, reversed the CA, and reinstated CTA's denial of the refund, because although the controlling rule is that the source of personal-service income is the place where the services were actually performed, Baier-Nickel failed to present sufficient evidence that the income-producing services underlying the commissions were actually performed in Germany.", "nature": ""}, {"name": "Marubeni Corporation v. Commissioner of Internal Revenue (1989)", "tag": "", "topic": "IT-D", "doctrine": "A resident foreign corporation is one that is \"engaged in trade or business\" within the Philippines. When the foreign corporation transacts business in the Philippines independently of its branch, the principal-agent relationship is set aside. The transaction becomes one of the foreign corporation, not of the branch. Consequently, the taxpayer is the foreign corporation, not the branch or the resident foreign corporation. Corollarily, if the business transaction is conducted through the branch office, the latter becomes the taxpayer, and not the foreign corporation", "facts": "Marubeni Corporation, a Japanese corporation licensed to do business in the Philippines through a Philippine branch, separately held equity investments in Atlantic Gulf and Pacific Co. of Manila (AG&P), from which its Japanese head office received dividends; AG&P withheld both the 10% final dividend tax and the 15% branch profit remittance tax from those dividends. BIR initially recognized that the dividends were not effectively connected with Marubeni's Philippine business, but the Commissioner later denied Marubeni's claim for refund of the ₱229,424.40 branch profit remittance tax, reasoning that the total taxes withheld effectively satisfied the 25% rate under the Philippines-Japan Tax Treaty; CTA affirmed the denial. The dispute reached the SC principally on whether, with respect to the dividend income, Marubeni's Japanese head office should be treated as a resident or nonresident foreign corporation, despite Marubeni's Philippine branch. SC reversed the CTA, held Marubeni to be a nonresident foreign corporation with respect to the transaction in question, applied the 15% tax on dividends under Section 24(b)(1)(iii), and ordered the Commissioner to refund or grant a tax credit of ₱144,452.40 representing the overpayment.", "nature": ""}, {"name": "Commissioner of Internal Revenue v. Deutsche Knowledge Services Pte. Ltd (2020)", "tag": "", "topic": "IT-D", "doctrine": "For purposes of zero-rating under Section 108(B)(2) of the Tax Code, a taxpayer claiming that its client is a nonresident foreign corporation (NRFC) doing business outside the Philippines must establish two components: The client was established under the laws of a country other than the Philippines, i.e., it is not a domestic corporation; and The client is not engaged in trade or business in the Philippines. Thus, it is insufficient merely to prove that the recipient of the service is a foreign corporation; there must also be sufficient proof that it does not conduct business in the Philippines. The SEC Certifications of Non-Registration show that their aﬃliates are foreign corporations. On the other hand, the articles of association/certificates of incorporation stating that these aﬃliates are registered to operate in their respective home countries, outside the Philippines are prima facie evidence that their clients are not engaged in trade or business in the Philippines.", "facts": "Deutsche Knowledge Services Pte. Ltd. (DKS) is the Philippine branch of a multinational company organized under the laws of Singapore and licensed in the Philippines as a Regional Operating Headquarters (ROHQ), through which it rendered qualifying services to its foreign affiliates and earned service revenues. As a VAT-registered enterprise, DKS sought a refund of ₱33,868,101.19 in unutilized input VAT attributable to alleged zero-rated sales to 34 foreign affiliates-clients, but the CIR challenged the claim, including DKS's proof that its clients were nonresident foreign corporations (NRFCs) doing business outside the Philippines. The CTA Division partially granted the claim, while the CTA En Banc, after finding that DKS sufficiently established the NRFC status of only 11 foreign affiliates-clients, reduced the refundable amount to ₱14,527,282.57; the CIR then elevated the case to SC SC denied the CIR's petition and affirmed the CTA En Banc, holding that the relevant documents sufficiently established the NRFC status of the 11 affiliates and supported DKS's entitlement to the corresponding refund.", "nature": ""}, {"name": "Commissioner of Internal Revenue v. Estate of Mr. Charles Marvin Romig (2024)", "tag": "", "topic": "IT-D", "doctrine": "Foreign currency deposits covered by R.A. No. 6426 are exempt from “any and all taxes whatsoever,” whether the depositor is a resident or non-resident, provided that the deposits are eligible or allowed under the applicable foreign currency deposit laws. Thus, the exemption applies notwithstanding the depositor's resident status. Section 6, RA 6426: Tax Exemption. — All foreign currency deposits made under this Act, as amended by Presidential Decree No. 1035, as well as foreign currency deposits authorized under Presidential Decree No. 1034, including interest and all other income or earnings of such deposits, are hereby exempted from any and all taxes whatsoever irrespective of whether or not these deposits are made by residents or non-residents so long as the deposits are eligible or allowed under aforementioned laws and, in the case of non-residents, irrespective of whether or not they are engaged in trade or business in the Philippines. (As amended by Presidential Decree No. 1246, prom. November 21, 1977.)", "facts": "Charles Marvin Romig, an American national and resident of the Philippines, died intestate on November 20, 2011, leaving, among his properties, a US-dollar deposit with the Foreign Currency Deposit Unit (FCDU) of HSBC. His estate initially sought confirmation that the deposit was exempt from taxation under Section 6 of Republic Act No. 6426, but later paid ₱4,565,349.07 in additional estate tax and subsequently filed administrative and judicial claims for its refund; the CTA Second Division granted the refund, and the CTA En Banc ultimately affirmed the result. CIR elevated the case to the SC arguing, among others, that Romig's foreign currency deposit was subject to estate tax because Romig was a resident of the Philippines, and that the exemption under R.A. No. 6426 had been superseded by the 1997 NIRC. The Supreme Court rejected these arguments, holding that R.A. No. 6426 is a special law governing foreign currency deposits, while the NIRC is a general law, and that the NIRC contained no express repeal of the tax exemption granted by R.A. No. 6426. SC denied the CIR's petition and affirmed the CTA, ruling that Romig's HSBC USD Savings Account was exempt from any and all taxes, including estate tax, and that the Estate was entitled to recover the ₱4,565,349.07 erroneously paid.", "nature": ""}];

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

const quizCfg={topics:new Set(TOPICS.map(t=>t[0])),types:new Set(Object.keys(TYPES)),srcs:new Set(Object.keys(SRC)),count:20,missedOnly:false};
let quiz=null; // {items, i, results:{id:true/false}, state}
function poolQ(){
  return QUESTIONS.filter(q=>quizCfg.topics.has(q.topic)&&quizCfg.types.has(q.type)&&q.srcs.some(s=>quizCfg.srcs.has(s))&&(!quizCfg.missedOnly||missed.has(q.id)));
}
function startQuiz(){
  const pool=shuffle(poolQ());
  const n=quizCfg.count==='all'?pool.length:Math.min(+quizCfg.count,pool.length);
  quiz={items:pool.slice(0,n),i:0,results:{},st:{}};
}
function recordResult(q,ok){
  quiz.results[q.id]=ok;
  if(ok) missed.delete(q.id); else missed.add(q.id);
  saveMissed();
}
function renderQuiz(){
  const pool=poolQ();
  const side=`
  <aside class="side stack">
    <div class="card pad stack">
      <h3>Session</h3>
      <div class="row">
        <label for="qcount" class="small">Items</label>
        <select id="qcount" style="width:auto">${['10','20','40','all'].map(v=>`<option value="${v}" ${String(quizCfg.count)===v?'selected':''}>${v==='all'?'All':v}</option>`).join('')}</select>
      </div>
      <label class="row small" style="cursor:pointer"><input type="checkbox" id="qmissed" ${quizCfg.missedOnly?'checked':''} style="width:18px;height:18px;accent-color:var(--blue)"> Missed items only (${missed.size})</label>
      <span class="small muted">${pool.length} items match these filters.</span>
      <button class="btn primary" id="qstart" ${pool.length?'':'disabled'}>${quiz?'Restart with these settings':'Start drill'}</button>
    </div>
    <div class="card pad stack">
      <h3>Question types</h3>
      <div class="row">${Object.entries(TYPES).map(([k,v])=>`<button class="chip" data-qtype="${k}" aria-pressed="${quizCfg.types.has(k)}">${v}</button>`).join('')}</div>
    </div>
    <div class="card pad stack">
      <div class="row between"><h3>Topics</h3><span class="row" style="gap:6px"><button class="chip" id="tall">All</button><button class="chip" id="tnone">None</button></span></div>
      <div class="checks">${TOPICS.map(t=>`<label><input type="checkbox" data-qtopic="${t[0]}" ${quizCfg.topics.has(t[0])?'checked':''}><span class="topicnum">${t[0]}</span>${t[1]}</label>`).join('')}</div>
    </div>
    <div class="card pad stack">
      <h3>Sources</h3>
      <div class="checks">${Object.entries(SRC).map(([k,v])=>`<label><input type="checkbox" data-qsrc="${k}" ${quizCfg.srcs.has(k)?'checked':''}>${v}</label>`).join('')}</div>
    </div>
  </aside>`;
  $('#app').innerHTML=`<div class="layout"><section class="mainc stack" id="qmain"></section>${side}</div>`;
  $('#qcount').onchange=e=>{quizCfg.count=e.target.value};
  $('#qmissed').onchange=e=>{quizCfg.missedOnly=e.target.checked;renderQuiz()};
  $('#qstart').onclick=()=>{startQuiz();renderQuiz()};
  document.querySelectorAll('[data-qtype]').forEach(b=>b.onclick=()=>{const k=b.dataset.qtype;quizCfg.types.has(k)?quizCfg.types.delete(k):quizCfg.types.add(k);renderQuiz()});
  document.querySelectorAll('[data-qtopic]').forEach(c=>c.onchange=()=>{const k=c.dataset.qtopic;c.checked?quizCfg.topics.add(k):quizCfg.topics.delete(k);renderQuiz()});
  document.querySelectorAll('[data-qsrc]').forEach(c=>c.onchange=()=>{const k=c.dataset.qsrc;c.checked?quizCfg.srcs.add(k):quizCfg.srcs.delete(k);renderQuiz()});
  $('#tall').onclick=()=>{quizCfg.topics=new Set(TOPICS.map(t=>t[0]));renderQuiz()};
  $('#tnone').onclick=()=>{quizCfg.topics=new Set();renderQuiz()};
  renderQMain();
}
function renderQMain(){
  const m=$('#qmain');
  if(!quiz){
    m.innerHTML=`<div class="card pad stack"><h2>Objective drill</h2>
      <p class="muted">Pick topics, question types and sources on the right, then start. Each answer shows the rule, the case or section behind it, and where it came from. Items you miss are saved so you can re-drill them tonight.</p>
      <div><button class="btn primary" id="qstart2" ${poolQ().length?'':'disabled'}>Start drill (${Math.min(quizCfg.count==='all'?1e9:+quizCfg.count,poolQ().length)} items)</button></div></div>`;
    const b=$('#qstart2'); if(b) b.onclick=()=>{startQuiz();renderQuiz()};
    return;
  }
  if(!quiz.items.length){m.innerHTML=`<div class="card pad"><p>No items match. Adjust the filters on the right.</p></div>`;return;}
  if(quiz.i>=quiz.items.length){
    const ids=quiz.items.map(q=>q.id);const right=ids.filter(id=>quiz.results[id]).length;
    const wrong=quiz.items.filter(q=>quiz.results[q.id]===false);
    m.innerHTML=`<div class="card pad stack"><h2>Session done: ${right} of ${ids.length}</h2>
      ${wrong.length?`<p class="muted">Missed in this session:</p><ul style="margin:0;padding-left:20px" class="stack small">${wrong.map(q=>`<li>${esc(q.q||q.s1)} <span class="tag">${q.topic}</span></li>`).join('')}</ul>`:'<p>No misses. Try a different topic or type.</p>'}
      <div class="row"><button class="btn primary" id="again">New session</button>${wrong.length?'<button class="btn" id="redo">Re-drill these misses</button>':''}</div></div>`;
    $('#again').onclick=()=>{startQuiz();renderQMain()};
    if(wrong.length) $('#redo').onclick=()=>{quiz={items:shuffle(wrong),i:0,results:{},st:{}};renderQMain()};
    return;
  }
  const binds=[];
  const q=quiz.items[quiz.i]; const st=quiz.st[q.id]||(quiz.st[q.id]={});
  const n=quiz.items.length; const score=Object.values(quiz.results).filter(Boolean).length;
  let body='';
  const head=`<div class="row"><span class="tag strong">${TYPES[q.type]}</span><span class="tag">${q.topic} · ${esc(TNAME[q.topic])}</span>${srcTags(q.srcs)}</div>`;
  if(q.type==='tf'||q.type==='mcq'||q.type==='both'){
    let opts, correct;
    if(q.type==='tf'){opts=['True','False'];correct=q.answer?0:1;}
    else if(q.type==='mcq'){opts=q.choices;correct=q.answer;}
    else {opts=['Both statements are true','Both statements are false','Only Statement I is true','Only Statement II is true'];correct={TT:0,FF:1,TF:2,FT:3}[q.answer];}
    const stem=q.type==='both'?`<div class="stack" style="gap:8px"><p class="qtext" style="font-size:18px"><b>Statement I.</b> ${esc(q.s1)}</p><p class="qtext" style="font-size:18px"><b>Statement II.</b> ${esc(q.s2)}</p></div>`:`<p class="qtext">${esc(q.q)}</p>`;
    body=`${stem}<div class="choices ${q.type==='tf'?'tf':''}">${opts.map((o,k)=>{
      let cls='';if(st.pick!=null){if(k===correct)cls='right';else if(k===st.pick)cls='wrong';}
      return `<button class="choice ${cls}" data-pick="${k}" ${st.pick!=null?'aria-disabled="true"':''}>${q.type==='mcq'?String.fromCharCode(97+k)+') ':''}${esc(o)}</button>`}).join('')}</div>
      ${st.pick!=null?`<div class="feedback"><p class="verdict ${st.pick===correct?'ok':'no'}">${st.pick===correct?'Correct.':'Not quite.'} ${q.type==='tf'?'The statement is '+(q.answer?'TRUE':'FALSE')+'.':'Answer: '+esc(opts[correct])}</p><p>${esc(q.explain)}</p></div>`:''}`;
    binds.push(()=>document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{if(st.pick!=null)return;st.pick=+b.dataset.pick;recordResult(q,st.pick===correct);renderQMain();}));
  } else if(q.type==='id'){
    body=`<p class="qtext">${esc(q.q)}</p>
      <div class="row"><label for="idans" class="small" style="width:100%">Your answer</label><input type="text" id="idans" value="${esc(st.text||'')}" ${st.checked?'disabled':''} style="flex:1 1 260px"><button class="btn primary" id="idcheck" ${st.checked?'disabled':''}>Check</button></div>
      ${st.checked?`<div class="feedback"><p class="verdict ${st.ok?'ok':'no'}">${st.ok?'Correct.':'Not quite.'} Answer: ${esc(q.answer)}</p><p>${esc(q.explain)}</p>
        <div class="row small muted">Graded by keyword. <button class="btn" id="idflip" style="min-height:36px">${st.ok?'Mark as missed':'Mark as correct'}</button></div></div>`:''}`;
    binds.push(()=>{const inp=$('#idans');if(inp&&!st.checked){inp.focus();inp.onkeydown=e=>{if(e.key==='Enter')$('#idcheck').click()};}
      const c=$('#idcheck');if(c)c.onclick=()=>{const t=inp.value.trim();st.text=t;const low=t.toLowerCase();st.ok=!!t&&q.accept.some(a=>low.includes(a.toLowerCase()));st.checked=true;recordResult(q,st.ok);renderQMain();};
      const f=$('#idflip');if(f)f.onclick=()=>{st.ok=!st.ok;recordResult(q,st.ok);renderQMain();};});
  } else if(q.type==='enum'){
    body=`<p class="qtext">${esc(q.q)}</p>
      <div class="stack" style="gap:6px"><label for="enans" class="small">Your list (one per line)</label><textarea id="enans" rows="${Math.min(8,q.items.length+1)}" ${st.revealed?'disabled':''}>${esc(st.text||'')}</textarea></div>
      ${st.revealed?`<div class="feedback"><p class="verdict">Answer key · ${q.items.length} items. Tick the ones you got.</p>
        <div class="stack" style="gap:8px">${q.items.map((it,k)=>`<label class="enumrow"><input type="checkbox" data-en="${k}" ${st.got&&st.got[k]?'checked':''} ${st.graded?'disabled':''}><span>${esc(it)}</span></label>`).join('')}</div>
        <p class="small">${esc(q.explain)}</p>
        ${st.graded?`<p class="verdict ${st.ok?'ok':'no'}">${st.ok?'Complete.':'Saved to missed items.'} You got ${st.count} of ${q.items.length}.</p>`:`<div><button class="btn primary" id="engrade">Save my score</button></div>`}</div>`
      :`<div><button class="btn primary" id="enreveal">Check my list</button></div>`}`;
    binds.push(()=>{const r=$('#enreveal');if(r)r.onclick=()=>{st.text=$('#enans').value;st.revealed=true;st.got={};renderQMain();};
      document.querySelectorAll('[data-en]').forEach(c=>c.onchange=()=>{st.got[c.dataset.en]=c.checked});
      const g=$('#engrade');if(g)g.onclick=()=>{st.count=Object.values(st.got).filter(Boolean).length;st.ok=st.count===q.items.length;st.graded=true;recordResult(q,st.ok);renderQMain();};});
  } else if(q.type==='def'){
    body=`<p class="qtext">${esc(q.q)}</p>
      <div class="stack" style="gap:6px"><label for="dfans" class="small">Your answer</label><textarea id="dfans" rows="4" ${st.revealed?'disabled':''}>${esc(st.text||'')}</textarea></div>
      ${st.revealed?`<div class="feedback"><p class="verdict">Model answer</p><p>${esc(q.model)}</p>
        <p class="small muted">Key points. Tick the ones your answer covered.</p>
        <div class="stack" style="gap:8px">${q.points.map((it,k)=>`<label class="enumrow"><input type="checkbox" data-df="${k}" ${st.got&&st.got[k]?'checked':''} ${st.graded?'disabled':''}><span>${esc(it)}</span></label>`).join('')}</div>
        ${st.graded?`<p class="verdict ${st.ok?'ok':'no'}">${st.ok?'Good.':'Saved to missed items.'}</p>`:`<div><button class="btn primary" id="dfgrade">Save my score</button></div>`}</div>`
      :`<div><button class="btn primary" id="dfreveal">Show model answer</button></div>`}`;
    binds.push(()=>{const r=$('#dfreveal');if(r)r.onclick=()=>{st.text=$('#dfans').value;st.revealed=true;st.got={};renderQMain();};
      document.querySelectorAll('[data-df]').forEach(c=>c.onchange=()=>{st.got[c.dataset.df]=c.checked});
      const g=$('#dfgrade');if(g)g.onclick=()=>{const c=Object.values(st.got).filter(Boolean).length;st.ok=c>=Math.ceil(q.points.length*0.75);st.graded=true;recordResult(q,st.ok);renderQMain();};});
  }
  const answered=quiz.results[q.id]!==undefined;
  m.innerHTML=`<div class="row between small muted"><span>Question ${quiz.i+1} of ${n}${quizCfg.missedOnly?' · missed items':''}</span><span>${score} correct so far</span></div>
    <div class="progress"><div style="width:${Math.round(quiz.i/n*100)}%"></div></div>
    <article class="card pad stack" style="gap:18px">${head}${body}</article>
    <div class="row"><button class="btn ${answered?'primary':''}" id="qnext">${answered?'Next question':'Skip'}</button>${quiz.i>0?'<button class="btn" id="qprev">Previous</button>':''}<button class="btn" id="qend">End session</button></div>`;
  binds.forEach(f=>f());
  $('#qnext').onclick=()=>{quiz.i++;renderQMain();window.scrollTo(0,0)};
  const p=$('#qprev');if(p)p.onclick=()=>{quiz.i--;renderQMain()};
  $('#qend').onclick=()=>{quiz.i=quiz.items.length;renderQMain()};
}
