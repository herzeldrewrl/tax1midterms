pt from local taxes under Sections 133(o) and 234(a) of the LGC. Charging passenger fares is merely an equitable user's tax for system maintenance and does not destroy public dominion. Only portions leased to private commercial concessionaires are taxable, and that tax liability attaches strictly to the private lessees, not LRTA. Thus, the Court declared LRTA's public dominion properties exempt, declared all assessments and warrants of levy issued against LRTA void, and nullified any public auction sales of LRTA's properties.", "nature": ""}, {"name": "The Collector of Internal Revenue v. Domingo de Lara, as Ancillary Administrator of the Estate of Hugo H. Miller (Deceased), and the Court of Tax Appeals (1958)", "tag": "", "topic": "IV-A", "doctrine": "For estate and inheritance tax purposes, \"residence\" is synonymous with \"domicile\"; while intangible personal property is generally taxed at the owner's domicile under mobilia sequuntur personam, shares of stock in domestic corporations acquire an actual tax situs in the Philippines when the decedent avails himself of the protection and benefits of Philippine laws.", "facts": "Hugo H. Miller, an American citizen domiciled in Santa Cruz, California, lived in Manila hotels and the Army and Navy Club from 1905 until his execution by Japanese forces in 1944 while working as a textbook representative. He never acquired a residential house in the Philippines, maintained the bulk of his savings and properties in the United States, and consistently declared Santa Cruz, California as his residence in his will and insurance contracts. The Collector assessed deficiency estate and inheritance taxes on Miller's worldwide assets, contending that Miller acquired a Philippine residence. The Supreme Court held that \"residence\" under estate tax laws means \"domicile,\" establishing that Miller was a non-resident alien domiciled in California; thus, only his properties situated in the Philippines—specifically shares of stock in domestic corporations valued at ₱51,906.45—fell within Philippine tax jurisdiction. The Court ruled that although intangibles generally follow the owner's domicile (mobilia sequuntur personam), these stock certificates acquired an actual tax situs in the Philippines because the corporations were domiciled here and the exercise of corporate rights enjoyed Philippine legal protection. However, the Court ultimately declared the intangible properties exempt from Philippine inheritance tax pursuant to the reciprocity proviso of Section 122 of the Tax Code, as Section 6 of the California Inheritance Tax Act granted a similar exemption to non-residents.", "nature": ""}, {"name": "Commissioner of Internal Revenue v. British Overseas Airways Corporation and Court of Tax Appeals (1987)", "tag": "", "topic": "IV-A", "doctrine": "The situs of income taxation is determined by the \"source\" test, which points to the specific activity, property, or service that produced the income; ticket sales within the Philippines by an offline foreign airline constitute Philippine-sourced income derived from business activity regularly pursued within Philippine jurisdiction.", "facts": "British Overseas Airways Corporation (BOAC), a foreign government-owned airline, had no flight operations or landing rights in the Philippines, but appointed local general sales agents (Warner Barnes & Co. and Qantas Airways) to market and issue passage tickets in the country. The CIR assessed BOAC for deficiency income taxes on ticket sales in the Philippines. The CTA canceled the assessments and ordered a refund, reasoning that income from transportation is sourced where the physical carriage service is performed (outside the Philippines). The Supreme Court reversed the CTA, holding that BOAC was a resident foreign corporation doing business in the Philippines through its local sales agents. Applying the \"source\" test of income taxation, the Court ruled that the source is the activity that produced the income—in this case, the continuous sale of passage documents and receipt of fare payments in Philippine currency within the Philippines. The Court emphasized that physical flight operations are not determinative of tax situs; because the flow of wealth originated from business activities regularly pursued within Philippine territory under the protection of Philippine laws, the income is derived from sources within the Philippines and is subject to Philippine income tax.", "nature": ""}, {"name": "Philippine Cellular Satellite Corp. v CIR (2022)", "tag": "Satellites located in outer space but services are rendered in the PH; hence, taxable in the Philippines", "topic": "IV-A", "doctrine": "2-tiered approach in determining whether the satellite airtime fees to Aces BERMUDA is subject to FWT: 1. Determine source of income In ascertaining the income source, We must inquire into the property, activity, or service that produced the income, or where the inflow of wealth originated. It is insufficient to identify just any property, activity, or service. The subject may only be regarded as an income source if the particular property, activity, or service causes an increase in economic benefits, which may be in the form of an inflow or enhancement. 2. Determine situs of the source Where the inflow of wealth and/or economic benefits proceeds from, and occurs within PH territory, it enjoys protection of the Philippine government. In consideration of such protection, the flow of wealth should share the burden of supporting the government, and thus, is subject to tax.", "facts": "Aces Philippines paid satellite airtime fees to Aces Bermuda for satellite communication services. Aces Philippines argued that the income was foreign-sourced because the satellite was in outer space and the transmission and routing occurred outside the Philippines. The Supreme Court, however, held that the income was Philippine-sourced because the service was not completed until the satellite signals were successfully received through Aces Philippines’ Philippine gateways, which was an essential part of the revenue-generating activity. Thus, the satellite airtime fees constituted income from sources within the Philippines and were subject to final withholding tax. The Court emphasized that the source of income is determined by where the activity that produced the income was actually conducted, not merely where the payment was made or where the service provider was located.", "nature": ""}, {"name": "Wigberto E. Tañada, et al. v. Edgardo Angara, et al. (1997)", "tag": "", "topic": "IV-A", "doctrine": "The sovereign power of taxation may be legitimately restricted or waived by international treaties and executive agreements based on the doctrine of incorporation, pacta sunt servanda, and the principle of international comity and reciprocity.", "facts": "Petitioners filed a petition for certiorari, prohibition, and mandamus seeking to nullify Senate Resolution No. 97, which concurred in the ratification of the WTO Agreement, contending that its parity and national treatment provisions violate constitutional principles of economic nationalism and improperly restrict Philippine sovereignty, including the legislative power to tax and set tariff rates. The Supreme Court dismissed the petition, holding that the Senate did not commit grave abuse of discretion. The Court ruled that sovereignty is not absolute and may be validly limited by international treaties voluntarily entered into under the doctrine of auto-limitation, pacta sunt servanda, and international comity. The Court emphasized that the Philippines routinely limits its sovereign taxing power through bilateral tax conventions, double taxation agreements, and tax/customs exemptions granted to foreign states and entities in exchange for reciprocal international commitments. Thus, the tariff reductions and trade commitments under the WTO Agreement represent a valid exercise of sovereign power based on equality and reciprocity, rather than an unconstitutional impairment of the legislative power to tax.", "nature": ""}, {"name": "Mitsubishi Corporation-Manila Branch v. Commissioner of Internal Revenue (2017)", "tag": "", "topic": "IV-A", "doctrine": "An Exchange of Notes is a binding executive agreement under international comity that validly creates a tax assumption obligation on the Government, rendering taxes paid directly by a covered foreign contractor erroneously collected and refundable by the BIR.", "facts": "Under an Exchange of Notes between Japan and the Philippines for an OECF loan to fund the Calaca II Coal-Fired Thermal Power Plant Project, the Philippine Government undertook to assume all Philippine fiscal levies and taxes imposed on Japanese contractors. National Power Corporation (NPC) contracted Mitsubishi Corporation for the project, agreeing to shoulder all directly imposable taxes. However, Mitsubishi Corporation-Manila Branch paid ₱44,288,712.00 in income tax and ₱8,324,100.00 in BPRT to the BIR for fiscal year 1998, and subsequently filed a claim for refund under Sections 204 and 229 of the NIRC. The CTA En Banc denied the refund, holding that the Exchange of Notes granted no tax exemption and could not act as a treaty without Senate concurrence. Reversing the CTA En Banc, the Supreme Court granted the refund, holding that an Exchange of Notes is a binding executive agreement under international law executed through executive action without need for Senate concurrence. The Court ruled that the tax assumption clause passed tax liability to the Philippine Government (NPC) rather than granting a tax exemption, making the contractor's direct tax payments to the BIR erroneous under Section 229 of the NIRC. Finally, the Court struck down BIR administrative circulars requiring the taxpayer to claim refunds from NPC, holding that administrative issuances cannot override the CIR's statutory mandate under the NIRC to refund erroneously collected taxes.", "nature": ""}, {"name": "Lung Center of the Philippines v. Quezon City (2004)", "tag": "*Lung Center Leased Portions – Charitable Institution, but Only Property Actually Used for Charity Is Exempt", "topic": "IV-B", "doctrine": "Under Article VI, Section 28(3) of the Constitution, what is exempted is not the charitable institution itself, but the lands, buildings, and improvements actually, directly, and exclusively used for charitable purposes. To claim the exemption, the taxpayer must prove that (1) it is a charitable institution, and (2) its real property is actually, directly, and exclusively used for charitable purposes. Actual, direct, and exclusive use means the direct and immediate and actual application of the property itself to the charitable purposes for which the institution is organized. It is not the use of the income from the real property that is determinative. If the property is used for commercial purposes, that portion is taxable.", "facts": "The Lung Center of the Philippines (LCP) is a non-stock and non-profit entity established by virtue of PD 1823 to help combat the high incidence of lung and pulmonary diseases in the Philippines. It is the registered owner of a parcel of land in Quezon City, some portions of which are allocated to the hospital – which provides services to both paying and non-paying patients – while some parts are leased out to private entities. In 1993, both the land and the hospital building of LCP were assessed for real property taxes (RPT) in the amount of P4,554,860 by the City Assessor of Quezon City. LCP filed a claim for tax exemption, arguing that as a charitable institution, it is not subject to pay RPT in accordance with the Constitutional prohibition against taxation of charitable institutions. The Court partially granted LCP’s petition, holding that the portions of LCP’s land leased to private entities as well as those parts of the hospital leased to private individuals are NOT exempt from RPT. On the other hand, the portions of the land occupied by the hospital and portions of the hospital used for its patients, whether paying or non-paying, are EXEMPT from RPT.", "nature": "Portions of a charitable institution’s real property that are leased to private entities are NOT exempt from real property taxes as these are NOT actually, directly and exclusively used for charitable purposes."}, {"name": "CIR v. CA", "tag": "&", "topic": "IV-B", "doctrine": "Under Article VI, Section 28(3) of the Constitution, what is exempted is not the charitable institution itself; the exemption covers lands, buildings, and improvements actually, directly, and exclusively used for religious, charitable, or educational purposes. Thus, the constitutional exemption covers property taxes only, not income tax. For the broader exemption under Article XIV, Section 4(3), the taxpayer must prove that (1) it is a non-stock, non-profit educational institution, and (2) the income sought to be exempted is used actually, directly, and exclusively for educational purposes. An educational institution, for this purpose, refers to a school or formal educational establishment, not merely an organization that conducts educational activities.", "facts": "YMCA earned rental income from portions of its premises leased to shops and restaurants and from parking fees, which it used to support its non-profit activities. SC held that this rental income was taxable under the Tax Code regardless of its disposition because YMCA’s status as a charitable organization did not itself exempt its income from taxation. Art VI, Sec 28(3) exempts only property actually, directly, and exclusively used for charitable purposes from property tax, rather than granting the institution a general income tax exemption. YMCA likewise could not invoke the broader exemption for non-stock, non-profit educational institutions under Art XIV because it failed to prove that it was an educational institution within the constitutional meaning or that the rental income was actually, directly, and exclusively used for educational purposes. Accordingly, its rental income was subject to income tax.", "nature": "Petition for review questioning whether rental income earned by YMCA, a non-stock, non-profit welfare, educational, and charitable corporation, from portions of its property and parking fees was exempt from income tax under Tax Code and Constitution."}, {"name": "De La Salle University, Inc. v. CIR (2016)", "tag": "*University Rental Income – Educational Use, Not Source, Determines Tax Exemption", "topic": "IV-B", "doctrine": "Prohibition against Taxation of Non-stock Non-profit Educational Institutions The income, revenues, and assets of non-stock, non-profit educational institutions proved to have been used actually, directly, and exclusively for educational purposes are EXEMPT from duties and taxes. The taxpayer must factually prove such use to avail of the exemption. Requisites for Availing Tax Exemption under Art. XIV, Sec. 4(3), 1987 Constitution the taxpayer falls under the classification of a non-stock, non-profit educational institution; and the income it seeks to be exempted from taxation is used actually, directly, and exclusively for educational purposes. The last paragraph of Section 30 of the Tax Code is without force and effect with respect to non-stock, non-profit educational institutions, provided that the non-stock, non-profit educational institutions prove that its assets and revenues are used actually, directly, and exclusively for educational purposes. The tax-exemption constitutionally granted to non-stock, non­ profit educational institutions is NOT subject to limitations imposed by law. Test of Exemption from Taxation → The use of the property for purposes mentioned in the Constitution. *(Abra Valley College, Inc. v. Aquino)* The exemption extends to facilities which are incidental to and reasonably necessary for the accomplishment of the main purposes.", "facts": "DLSU, a non-stock, non-profit educational institution, was assessed deficiency taxes on rental income earned from leasing portions of its premises to concessionaires. CIR argued that Section 30 of the Tax Code subjected income from property or profit-making activities to tax regardless of how the income was ultimately used. The Court rejected this limitation, holding that the Constitution grants non-stock, non-profit educational institutions a broader exemption that depends on the use of the revenues rather than their source, and declared the last paragraph of Section 30 without force and effect insofar as it taxes revenues actually, directly, and exclusively used for educational purposes. SC distinguished the taxation of assets from the taxation of revenues: a commercially leased portion of school property may itself be subject to real property tax, but the rental income generated from that property is exempt if actually used for educational purposes. DLSU proved that most of its assessed rental income was used for educational purposes, leaving only the unsubstantiated portion subject to income tax and VAT.", "nature": "Consolidated petitions for review involving deficiency tax assessments against DLSU, principally concerning whether the rental income of a non-stock, non-profit educational institution is constitutionally exempt when actually, directly, and exclusively used for educational purposes."}, {"name": "De La Salle Lipa v. CIR (2025)", "tag": "*School Canteen and Rental Income – Tax Exemption Depends on Actual Educational Use, Not Source", "topic": "IV-B", "doctrine": "Under Article XIV, Section 4(3) of the Constitution, all revenues and assets of non-stock, non-profit educational institutions used actually, directly, and exclusively for educational purposes shall be exempt from taxes and duties. The exemption is based on the usage of the income and not on its source. Thus, income of a non-stock, non-profit educational institution, regardless of its source, is exempt from duties and taxes provided that the same is actually, directly, and exclusively used for educational purposes. To avail of the exemption, the taxpayer bears the burden of factually proving such use. A non-stock, non-profit educational institution which fails to comply with the requirements for tax exemption under Section 30(H), but remains a proprietary non-profit educational institution, may still avail of the preferential tax rate under Section 27(B), as long as the conditions set forth in the latter are satisfied. In such a case, the lens by which the income is examined shifts from the usage of the income [for complete tax exemption under Section 30(H)] to its source under Section 27(B). It is then incumbent upon the taxpayer, as the one claiming preferential tax rate, to prove by competent evidence that its income from unrelated trade, business, or activity does not exceed 50% of the total gross income. Failing this, the regular corporate income tax rate of 32% applies.", "facts": "DLSLI, a non-stock, non-profit educational institution in Lipa City, entered into a contract with Vintage Food Service, Inc. granting exclusive use of its canteen premises for 10 school years in exchange for ₱14.66 million paid in advance as a purported “conditional donation,” and also earned ₱9.5 million in rental income, prompting the BIR to assess deficiency income tax, VAT, DST, and EWT; the CTA upheld the assessment, finding the purported donation to be a lease and taxable only one-tenth for TY 2005. However, SC held that DLSLI was not exempt, because under Article XIV, Sec 4(3) of the Constitution and Section 30(H) of NIRC, an NSNP educational institution’s exemption depends on the actual, direct, and exclusive use of income for educational purposes, which DLSLI failed to prove, and although CIR v. St. Luke’s recognizes the 10% preferential rate under Section 27(B) when Sec 30(H) is not satisfied, DLSLI likewise failed to establish that its unrelated income did not exceed 50% of total gross income, so the regular 32% corporate income tax rate applied.", "nature": "Consolidated petitions for review involving deficiency income tax, VAT, and EWT assessments against De La Salle Lipa, Inc. (DLSLI), a non-stock, non-profit educational institution, particularly whether its canteen and rental revenues were constitutionally exempt from taxation."}, {"name": "American Bible Society v. Manila (1957)", "tag": "*Bible Distribution and Sales – License Tax Cannot Burden Religious Evangelism", "topic": "IV-B", "doctrine": "The constitutional guarantee of the free exercise and enjoyment of religious profession and worship carries with it the right to disseminate religious information. Any restraint on such right can be justified only upon a clear and present danger of a substantive evil which the State has the right to prevent. A license tax imposed as a condition for engaging in the distribution of religious literature is unconstitutional because the power to tax the exercise of a privilege is the power to control or suppress its enjoyment. Religious organizations are not free from all financial burdens of government, but the State cannot exact a tax for the privilege of exercising a right guaranteed by the Constitution.", "facts": "The American Bible Society, a non-stock, non-profit religious missionary corporation, distributed and sold Bibles and religious literature as part of its missionary work, generally at prices intended to support rather than profit from its operations. Manila required it to pay license fees based on gross sales and obtain a Mayor’s permit, treating its activities as the business of selling merchandise. The Court held that the Society was not engaged in a commercial venture for profit and that distributing and selling Bibles constituted the dissemination of religious beliefs protected by the free exercise guarantee. Applying the license tax to this activity would therefore impair its free exercise of religion, although the Mayor’s permit requirement was not unconstitutional in itself because it imposed no charge on religious exercise. Since Manila could not license or tax the Society’s protected religious activity, both ordinances were inapplicable to it, and the fees collected were ordered refunded. Rule: Activities that are simply and purely for the propagation of faith are exempt. However, income derived by religious organizations from activities conducted for profit or from their property remains taxable.", "nature": "Action challenging the application of Manila ordinances requiring the American Bible Society to pay license fees and obtain a Mayor’s permit for its distribution and sale of Bibles and other religious literature."}, {"name": "Tolentino v. Sec of Finance (1994)", "tag": "*Bible Sales Subject to VAT – Generally Applicable Tax Does Not Violate Religious Freedom", "topic": "IV-B", "doctrine": "The Free Exercise of Religion Clause does not prohibit imposing a generally applicable sales and use tax on the sale of religious materials by a religious organization. RA 7716 did not single out religious publications for taxation but merely withdrew a previously granted exemption as part of the general expansion of the VAT base. Moreover, a registration fee imposed merely to defray part of the administrative cost of the VAT system is not a tax or license imposed as a condition for the exercise of religion. Unlike a fixed license fee imposed for the privilege of exercising a constitutional right, the VAT and its registration requirement are generally applicable economic regulations.", "facts": "The Philippine Bible Society challenged RA 7716 after it deleted the VAT exemption previously covering the printing, publication, importation, and sale of books and religious articles. It argued that subjecting its religious materials to VAT and requiring VAT registration infringed freedom of thought, conscience, and religion. SC held that the VAT was a generally applicable tax and did not target religious activity, relying on the principle that religious organizations are not constitutionally immune from generally applicable sales and use taxes. It distinguished American Bible Society v. City of Manila, where a license fee operated as a condition on the exercise of religious freedom, because the VAT registration fee merely defrayed administrative costs. The Court therefore found no violation of the constitutional guarantee of free exercise of religion.", "nature": "Consolidated petitions challenging the constitutionality of RA 7716, including the Philippine Bible Society’s claim that removing the VAT exemption for the printing, publication, importation, and sale of religious materials violated the constitutional guarantee of religious freedom."}, {"name": "Aglipay v Ruiz (1937)", "tag": "*Eucharistic Congress Stamps – Religious Event Used to Promote Philippine Tourism", "topic": "IV-B", "doctrine": "The constitutional prohibition against using public money or property for the use, benefit, or support of any sect or church is a direct corollary of the principle of separation of church and state. What the Constitution guarantees is religious liberty, not mere religious toleration. However, religious freedom does not prohibit government action undertaken for a legitimate secular purpose merely because it produces incidental benefits of a religious character. The main purpose should not be frustrated by its subordination to mere incidental results not contemplated. Government must not take sides or favor a particular religious sect, but no constitutional violation arises where the governmental purpose is legitimate and any benefit to religion is merely incidental.", "facts": "Despite Aglipay’s protest, Ruiz proceeded with the issuance and sale of postage stamps commemorating the 33rd International Eucharistic Congress, which Aglipay challenged as violating the constitutional prohibition against using public money or property for the benefit or support of a religious institution. The Court held that there was no constitutional violation because the stamps were not issued or sold for the benefit of the Roman Catholic Church and no proceeds went to it, the Government merely used an internationally significant event to publicize the Philippines and attract tourists, as reflected in the final design highlighting Manila as the congress’s seat, so any benefit to the Church was merely incidental and not the Government’s purpose.", "nature": "Petition for prohibition seeking to stop the Director of Posts from issuing and selling postage stamps commemorating the Thirty-third International Eucharistic Congress, allegedly in violation of the constitutional prohibition against using public money or property for the benefit or support of any religion."}, {"name": "Tolentino v Secretary of Finance (1994)", "tag": "*Expanded VAT – House-Originated Revenue Bill May Be Rewritten by Senate and Conference Committee", "topic": "IV-B", "doctrine": "It is not the law—but the revenue bill—which is required by the Constitution to \"originate exclusively\" in the House of Representatives. A bill originating in the House may undergo such extensive changes in the Senate that the result may be a rewriting of the whole. As a result of the Senate action, a distinct bill may be produced. To insist that a revenue statute—and not only the bill which initiated the legislative process culminating in the enactment of the law—must substantially be the same as the House bill would be to deny the Senate's power not only to \"concur with amendments\" but also to \" propose amendments.\" It would be to violate the coequality of legislative power of the two houses of Congress and in fact make the House superior to the Senate.", "facts": "RA 7716 originated from House Bill No. 11197, which sought to restructure and expand the VAT system; after its receipt, the Senate considered and approved its own version, Senate Bill No. 1630, and a bicameral conference committee subsequently reconciled the two into the measure eventually signed into law. Petitioners argued that the resulting law did not constitutionally originate in the House, that the Senate bill improperly passed second and third readings on the same day, and that the conference committee exceeded its authority by introducing provisions not found in either version. SC rejected these challenges, holding that only the revenue bill initiating the legislative process must originate in the House, while the Senate retains broad constitutional authority to propose amendments, and that the President’s certification validly dispensed with the separate-day requirement. The conference committee could formulate a germane compromise version, which became valid upon approval by both Houses, and its report did not itself require three readings. Thus, the constitutional procedural requirements for the enactment of RA 7716 were satisfied, and the petitions were dismissed.", "nature": "Consolidated petitions for certiorari and prohibition challenging the constitutionality of RA 7716, the Expanded VAT Law, particularly its compliance with the constitutional requirements on the passage of revenue bills."}, {"name": "ABAKADA v. Executive Secretary (2008)", "tag": "*RA 9335 Oversight Committee Approval of IRR – Legislative Veto Violates Bicameralism and Presentment", "topic": "IV-B", "doctrine": "Two steps are required before a bill becomes a law: first, it must be approved by both Houses of Congress; second, it must be presented to and approved by the President. A valid exercise of legislative power requires the act of both chambers and cannot be exercised solely by one chamber or by a committee of either or both chambers. Every bill passed by Congress must also be presented to the President for approval or veto; without presentment, no bill passed by Congress can become law. Thus, when Congress delegates rule-making authority to the executive, the law must be complete in all its essential terms and conditions when it leaves the legislature. Congress may thereafter exercise scrutiny and investigation, but it cannot retain the power to approve or disapprove implementing rules because such a legislative veto bypasses the constitutionally prescribed requirements of bicameralism and presentment.", "facts": "RA 9335 created a Joint Congressional Oversight Committee empowered to approve the IRR prepared by executive agencies for the law’s implementation. Petitioners challenged this arrangement as an unconstitutional continuation of legislative participation after enactment SC held that requiring congressional approval of the IRR amounted to a legislative veto because Congress retained a direct role in implementing a law that had already taken effect without complying with bicameralism and presentment. Accordingly, Section 12 creating the Oversight Committee was declared unconstitutional and void, while the remainder of RA 9335 remained valid under its separability clause.", "nature": "Petition for prohibition challenging the constitutionality of RA 9335, particularly the creation of a Joint Congressional Oversight Committee empowered to approve the law’s implementing rules and regulations."}, {"name": "Luzon Stevedoring v Trinidad (1922)", "tag": "", "topic": "V", "doctrine": "Revenue laws imposing taxes on business must be strictly construed in favor of the citizen. In construing a word or expression in the statute susceptible of two or more meanings, the court will adopt that interpretation most in accord with the manifest purpose of the statute as gathered from the context. Where a particular word is obscure or of doubtful meaning, taken by itself, its obscurity or doubt may be removed by reference to associate words.", "facts": "Luzon Stevedoring Company’ (LSC) business consisted of loading and unloading cargo from vessels in port at certain rates per unit of cargo. All work was conducted under the direct supervision, control, and instruction of the captain and officers of the ships. No discretion was left to the stevedoring company or its laborers, and the captain remained responsible for the proper loading of the cargo. The parties agreed that the statutory tax provision had been in force for 8 years prior to 1921 without the BIR ever attempting to collect this percentage tax from stevedoring businesses. In 1921, LSC was assessed by CIR Trinidad for percentage taxes under Sec. 1462 of Act 2711. The tax was levied on the company's gross receipts of Php 242k resulting in an assessment of Php 2.4k which the company paid under protest. The Court resolved the question whether a stevedoring company whose work is performed under the direct control and supervision of ship officers is a \"contractor\" within the meaning of Sec. 1462 of Act 2711, thereby making its gross receipts subject to the business percentage tax. Here, the Court held that the term \"contractor\" in a tax statute cannot be given a broad lexicographical definition that covers all contracts. Under the strict rules of tax statutory construction, any doubt as to whether a business is taxable must be resolved strictly in favor of the citizen and against the government.", "nature": ""}, {"name": "Petron Corp. v CIR (2023)", "tag": "", "topic": "V", "doctrine": "The rule applicable in this case is the doctrine of strict construction of tax laws in favor of the taxpayer. The rule that tax exemptions should be construed strictly against the taxpayer presupposes that the taxpayer is clearly subject to the tax being levied against him. Unless a statute imposes a tax clearly, expressly and unambiguously, what applies is the equally well-settled rule that the imposition of a tax cannot be presumed. Where there is doubt, tax laws must be construed strictly against the government and in favor of the taxpayer. This is because taxes are burdens on the taxpayer, and should not be unduly imposed or presumed beyond what the statutes expressly and clearly import.", "facts": "Petitioner Petron Corporation is a domestic corporation engaged in manufacturing and marketing petroleum products. It operates its own oil refinery in Limay, Bataan, where it manufactures gasoline products. Between July and November 2012, Petron imported alkylate on five different occasions. July 18, 2012, the BOC issued CMC 164-2012, implementing a June 2012 BIR letter. The CMC declared that alkylate is \"a product of distillation similar to that of naphtha\" and is therefore subject to excise tax under NIRC 148(e) . Under threat of non-release of its shipments, Petron paid excise taxes in the aggregate amount of Php 219M. Petron subsequently filed administrative claims for refund, asserting that alkylate is not covered by NIRC 148(e) and was thus illegally collected. It also filed two corresponding Petitions for Review before the CTA to prevent the two-year prescriptive period from lapsing The Court resolved the questions (1) whether alkylate is subject to excise tax under NIRC 148(e), as amended by RA 3337, and (2) whether Petron is entitled to a refund of the Php 219M excise taxes paid under the proper rules of statutory construction Here, the Court granted Petron’s petition and ordered the refund. Petron was not claiming a tax exemption, but rather challenging the lack of a law imposing a tax on alkylate. Applying the proper rule of construction, the SC held that tax-imposing statutes must be strictly construed against the government. Because alkylate is produced by alkylation, is not listed in NIRC 148(e), and is not similar to naphtha, it is not taxable", "nature": ""}, {"name": "Roxas v. Rafferty (1918)", "tag": "", "topic": "V", "doctrine": "It is a general rule that those provisions of a statute relating to the assessment of taxes, which are intended for the security of the citizen, or to insure the equality of taxation, or certainty as to the nature and amount of each person's tax, are mandatory; but those designed merely for the information or direction of officers or to secure methodical and systematic modes of proceedings are merely directory. When the regulations prescribed are intended for the protection of the citizen and to prevent a sacrifice of his property, and by a disregard of which his right might be, and generally would be, injuriously affected, they are not directory but mandatory.", "facts": "Plaintiffs owned a parcel of land situated on the Escolta in the City of Manila. In the latter part of 1913, the existing improvements on this land were demolished, and the construction of a new reinforced concrete building (the Roxas Building) was initiated. No RPTs on the improvements were levied or paid for the year 1914. In November and December of 1914, the city assessor and collector inspected the building and attempted to assess it for taxation for the year 1915 at a valuation of Php 300k. However, as of December 1914, the building was still heavily incomplete and was only finished in all respects on February 15, 1915. On December 1, 1914, the city assessor and collector sent the plaintiffs a notice (received on December 25, 1914) requiring them to declare the new improvements for assessment for 1915. On January 15, 1915, the plaintiffs were formally notified of the Php 300k assessment . The plaintiffs paid the corresponding taxes, amounting to Php 3k under protest. They subsequently filed a complaint in the CFI Manila to recover the illegally collected sum with interest The Court resolved the question whether the assessor's failure to serve the written notice of the proposed assessment in the month of November, as required under Sec. 2487 of the Administrative Code of 1917, invalidated the assessment Here, SC held that the assessment was wholly void because the building was incomplete at the time of the assessment. The requirement in Sec. 2487 to notify the taxpayer in writing of an assessment change sometime in the month of November is mandatory. It is a requirement of substantive due process. In this case, the assessor's attempted notification on Dec 25, 1914, fell outside the mandatory statutory window of November. Because there was no substantial compliance with this mandatory due process requirement, the entire assessment of the Roxas Building for 1915 was void.", "nature": ""}, {"name": "PLDT v. Davao City (2001)", "tag": "", "topic": "VI", "doctrine": "The tax exemption must be expressed in the statute in clear language that leaves no doubt of the intention of the legislature to grant such exemption. And, even if it is granted, the exemption must be interpreted in strictissimi juris against the taxpayer and liberally in favor of the taxing authority. When exemption is claimed, it must be shown indubitably to exist. At the outset, every presumption is against it. A well-founded doubt is fatal to the claim. It is only when the terms of the concession are too explicit to admit fairly of any other construction that the proposition can be supported.", "facts": "In January 1999, PLDT applied for a Mayor's Permit to operate its Davao Metro Exchange. Respondent City of Davao withheld action on PLDT's permit application pending payment of local franchise tax in the amount of Php 3.7M covering Q1 to Q4 of 1999. On May 31, 1999, PLDT protested the assessment and requested a refund of franchise taxes paid for 1997 and Q1 to Q3 of 1998 (claiming Php 2.6M for 1998; the 1997 claim having prescribed under LGC 196. PLDT asserted tax immunity based on the BLGF Opinion which opind that under Sec. 23 of RA 7925 (Public Telecommunications Policy Act of the Philippines), the tax exemptions granted in the legislative franchises of Smart and Globe (enacted after the LGC) automatically extended to PLDT under the \"most favored clause\" / equality of treatment provision . On September 27, 1999, Davao City denied PLDT's protest and refund claim, relying on City Ordinance No. 230, s. 1991, as amended, which imposes a franchise tax on businesses enjoying a franchise within Davao City, notwithstanding any exemption granted by law. PLDT appealed the denial to the RTC under Sec. 195 and 196 of the LGC Here, the SC affirmed the RTC decision, holding that: Tax exemptions are highly disfavored, odious to the law, and must be strictly construed strictissimi juris against the taxpayer and liberally in favor of the taxing power. Sec. 23 of RA 7925 is a general policy provision aimed at telecom deregulation and level competition; its reference to \"exemption\" pertains to regulatory or reporting requirements, not local tax exemptions. Accepting PLDT's theory would produce absurd results, requiring continuous downward adjustments of tax rates across the industry whenever any single franchise receives a favorable tax clause. The BLGF is not a quasi-judicial body like the CTA; its legal interpretations of statutes carry no controlling weight in court. Constitutional and statutory principles mandate that doubts in interpreting local taxing powers are resolved in favor of municipal corporations", "nature": ""}, {"name": "Republic v Caguioa (2007)", "tag": "", "topic": "VI", "doctrine": "There is no vested right in a tax exemption, more so when the latest expression of legislative intent renders its continuance doubtful. Being a mere statutory privilege, a tax exemption may be modified or withdrawn at will by the granting authority. To state otherwise is to limit the taxing power of the State, which is unlimited, plenary, comprehensive and supreme.", "facts": "By virtue of RA 7227, private respondents were granted tax exemption benefits. Subsequently, Congress enacted RA 9334 withdrawing the tax exemption. Hence, private respondents were required to pay taxes on their imports of liquor and tobacco products. Private respondents moved for reconsideration of such directives and subsequently filed an action for declaratory relief, with prayer for issuance of WPI/TRO and WMPI to enjoin the implementation of the law. Lower Court granted the prayer despite public petitioner’s opposition, prompting them to seek recourse from the SC. Without ruling on the issue of constitutionality of RA 9334, SC held that the WPI/TRO was issued with grave abuse of discretion, declaring the same null and void.", "nature": ""}, {"name": "Surigao Con. Min. v. Collector (1963)", "tag": "", "topic": "VI", "doctrine": "A condonation of tax liability is in the nature of a tax exemption and must be expressed in explicit, unambiguous terms. A statute providing for the condonation of unpaid taxes cannot be extended by interpretation to authorize a refund of taxes already paid.", "facts": "Prior to World War II, Surigao Consolidated Mining Company operated mining concessions. Under Sec. 246 of the Internal Revenue Code, the company regularly filed quarterly returns and paid ad valorem taxes on extracted minerals, subject to final adjustment upon receipt of smelter returns showing actual market value from shipments to the US. Due to war-related communication disruptions, the main office lost contact with the mines. To avoid tax penalties, the company deposited a check for Php 27k with the City Treasurer of Iloilo, as an approximate ad valorem tax payment for Q4 of 1941. Under CA 722, which extended the period for filing returns for 1941 mineral production, the company filed returns on December 28, 1945 (declaring a tax liability of Php 43.5k). On February 26, 1946, it filed an amended return lowering its declared liability to Php 37.2k and paid the remaining balance of Php 10.2k after crediting its Php 27k deposit. In late 1946 and early 1947, the company submitted statements of adjustment requesting a refund of Php 17k consisting of three specific items: Php 1.2k – Ad valorem tax on minerals removed from the mines but allegedly lost in transit due to the war. Php 15.6k – Ad valorem tax on minerals extracted but allegedly looted during the Japanese occupation. Php 250 – Alleged overpayment of ad valorem tax on minerals shipped to the US. The CIR denied the refund claim which led the company to file a civil action before the CFI Manila, which was remanded to the CTA pursuant to RA 1125. CTA denied the claim for refund. Here, the SC affirmed the CTA Decision, holding that: The condonation of a tax liability is equivalent to a tax exemption, which must be strictly construed against the taxpayer. RA 81 condones only unpaid taxes, not taxes that have already been paid. Furthermore, the taxpayer failed to discharge its burden of proof regarding the alleged war losses and overpayments.", "nature": ""}, {"name": "Makati City v. CIR (2023)", "tag": "", "topic": "VI", "doctrine": "Compromise may be the favored method to settle disputes, but when it involves taxes, it may be subject to closer scrutiny by the courts. A compromise agreement involving taxes would affect not just the taxpayer and the BIR, but also the whole nation, the ultimate beneficiary of the tax revenues collected.\" There is solutio indebiti when: (1) payment is made when there exists no binding relation between the payor, who has no duty to pay, and the person who received the payment; and (2) the payment is made through mistake and not through liberality or some other cause... Neither of these elements is present here. First, the City of Makati, as a payor, has a binding relation with the BIR as the taxing authority in this jurisdiction. Second, the finality of the FDDA dated October 16, 2003 rendered the assessments for 1999-2001 demandable, enforceable, and collectible.\"", "facts": "On September 20, 2002, BIR Region No. 8 (Makati) issued a PAN finding petitioner MAKATI liable for Php 1.3B in deficiency income tax, VAT, and withholding taxes for taxable years 1999–2002. On October 15, 2002, a FAN was issued assessing Php 1.3B. MAKATI filed administrative protests. On October 16, 2003, BIR RD Adriano issued a FDDA with Amended Assessment Notices demanding Php 1.15B for deficiency taxes for 1999–2001. The FDDA was received by Makati on October 20, 2003. Instead of appealing to the CTA or elevating the protest to the CIR within 30 days, MAKATI filed a request for re-computation with BIR RD Adriano on October 24, 2003. Thus, the FDDA became final, executory, and demandable on November 19, 2003. On April 29, 2005, RD Adriano informed MAKATI that Deputy CIR Buñag approved the re-opening of the case, leading to a reduced revised assessment of Php 520M on August 4, 2005. Following a meeting presided over by SOF Teves, MAKATI offered to pay Php 100M in full settlement of 1999–2001 deficiency taxes and another Php 100M for 2002–2004 deficiency taxes. Between 2005 and 2006, MAKATI paid a total of Php 200M in installments. On November 22, 2006, newly appointed BIR RD Aspe informed Makati that its offer of compromise settlement was not accepted by the BIR and demanded payment of the balance of Php 581M for 1999–2001, alongside deficiency assessments totaling Php 323M (later adjusted to Php 317M) for 2002–2004. On May 2, 2007, the BIR issued a Warrant of Garnishment for Php 1.15B. BIR RD Guerrero ruled on October 9, 2007 that both 1999–2001 and 2002–2004 assessments were final. On June 20, 2008, the CIR dismissed MAKATI’s appeal as time-barred. MAKATI then filed a Petition for Review before the CTA. While the case was pending before the SC, MAKATI made further payments (Php 400M on July 3, 2013 and Php 302M on April 25, 2017) and filed a Motion to Dismiss with Prejudice, alleging that a compromise settlement had been perfected. However, neither party could produce a written compromise agreement approved by the CIR or the National Evaluation Board. Here, the SC denied the Petition of MAKATI ruling that: A compromise agreement involving taxes affects public revenues and is subjected to strict judicial scrutiny. Under NIRC 204(A), where the basic tax involved exceeds Php 1M, any compromise settlement must be approved by the Evaluation Board (composed of the CIR and 4 Deputy Commissioners). Makati failed to establish the existence of an approved compromise agreement. The BIR Payment Slip (Form 0605) submitted by MAKATI showing payment of Php 302M does not prove a compromise agreement, as Form 0605 is an ordinary deposit/payment form used for various tax payments, delinquencies, and deposits.", "nature": ""}, {"name": "Qatar Airways v. CIR (2020)", "tag": "", "topic": "VI", "doctrine": "Pursuant to SEC. 204 (b) of the NIRC, the CIR may abate or cancel a tax liability when: The tax or any portion thereof appears to be unjustly or excessively assessed; or The administration and collection costs involved do not justify the collection of the amount due.", "facts": "On November 30, 2011, Qatar Airways filed through the BIR's eFPS its 2nd Quarterly ITR for FY ending March 31, 2012, and paid the tax due of Php30M. The filing was one day late. Qatar Airways wrote the CIR on April 11, 2012 requesting abatement of the surcharge. On May 18, 2012, the BIR issued an Assessment Notice for: 25% surcharge — Php 7.4M; Interest for late payment — Php 16.2k; and Compromise penalty — Php 50k. On July 3, 2012, Qatar Airways paid Php 66.2k covering the interest and compromise penalty, but sought abatement or cancellation of the Php 7.4M surcharge as unjust and excessive because: It paid only one day after the deadline; The late filing was due to circumstances beyond its control (a technical failure from faulty internet connection at its office on November 29, 2011); and It acted in good faith. The BIR denied the application for abatement, denied the request for reconsideration for lack of new justification under RR 13-2001 , and denied the second request for reconsideration with finality. The CIR noted there was no advice of eFPS unavailability on November 29, 2011; if there were log-in problems that night, the return should have been filed during the first working hour the next day, but it was filed only at 1:38 p.m. The taxpayer had 60 days to file but chose the last day; only a major natural catastrophe would be an acceptable reason, and other reasons could have been avoided by filing earlier. Here, the SC upheld the CTA En Banc Decision which ruled that: While the appeal was seasonably filed, the 25% surcharge imposed by the BIR pursuant to NIRC 248(A)(1) was neither unjust nor excessive. It found no recorded eFPS unavailability on November 29, 2011, and noted that the taxpayer could have avoided the delay by filing before the 11th hour or by filing a tentative return under NIRC 6(A).", "nature": ""}, {"name": "CIR v. Marubeni (2001)", "tag": "", "topic": "VI", "doctrine": "A tax amnesty is a general pardon or intentional overlooking by the State of its authority to impose penalties on persons otherwise guilty of evasion or violation of a revenue or tax law. It partakes of an absolute forgiveness or waiver by the government of its right to collect what is due it and to give tax evaders who wish to relent a chance to start with a clean slate. A tax amnesty, much like a tax exemption, is never favored nor presumed in law. If granted, the terms of the amnesty, like that of a tax exemption, must be construed strictly against the taxpayer and liberally in favor of the taxing authority.", "facts": "In November 1985, the BIR examined MARUBENI Manila's books for the fiscal year ending March 31, 1985, and found undeclared income from two turn-key construction projects completed in 1984. On August 27, 1986, MARUBENI received a BIR assessment letter dated August 15, 1986 demanding payment for: Deficiency Income Tax: Php 291M Deficiency Branch Profit Remittance Tax: Php 83M Deficiency Contractor's Tax: Php 86M Deficiency Commercial Broker's Tax: Php 3.6M On September 26, 1986, MARUBENI filed two petitions for review with the CTA (1) challenging deficiency income, branch profit remittance, and contractor's taxes and (2) challenging commercial broker's tax). MARUBENI availed of Tax Amnesties: EO 41 (effective August 22, 1986) declared a one-time amnesty covering unpaid income taxes for 1981–1985. On October 30, 1986, Marubeni filed an income tax amnesty return and paid Php 2.9M. EO 64 (effective November 17, 1986) expanded the amnesty to cover business taxes (including contractor's tax), estate, and donor's taxes for 1981–1985. On December 15, 1986, MARUBENI filed a supplemental return under EO 64 and paid an additional Php 1.4M EO 41 Sec. 4(b) excepted from amnesty coverage taxpayers \"with income tax cases already filed in Court as of the effectivity hereof. Here, the SC rule in favor of MARUBENI and: Upheld the income tax and branch profit remittance tax amnesty as validly availed of under EO 41. Ruled that MARUBENI was disqualified from the contractor's tax (business tax) amnesty under EO 64 because the CTA Case was already pending in court when EO 64 took effect on November 17, 1986 . Held that MARUBENI was NOT liable for deficiency contractor's tax on the Foreign Offshore Portion of the contracts because the services were performed entirely outside PH territorial jurisdiction (in JP)", "nature": ""}, {"name": "BIR v. Samuel Cagang (2022)", "tag": "", "topic": "VI", "doctrine": "Tax amnesty refers to the \"absolute waiver by a sovereign of its right to collect taxes and power to impose penalties on persons or entities guilty of violating a tax law. Tax amnesty aims to grant a general reprieve to tax evaders who wish to come clean by giving them an opportunity to straighten out their records.”", "facts": "On March 4, 2003, CEDCO, Inc. received a LOA authorizing BIR officers to examine its accounting records for taxable years 1997 to 2001. On May 24, 2005, CEDCO received a PAN assessing deficiency income tax, Value-Added Tax (VAT), Expanded Withholding Tax (EWT), and Withholding Tax on Compensation (WTC) for taxable years 2000 and 2001. CEDCO protested the PAN, but the BIR issued a FLD, demanding Php 127M in total deficiency taxes. CEDCO protested the FLD/FAN. On September 28, 2007, the BIR issued a FDDA denying CEDCO's protest for lack of factual and legal basis. The FDDA detailed the following liabilities: Taxable Year 2000: Income Tax (Php 75.2M); EWT (Php 503k); VAT (Php 29.2M). Taxable Year 2001: Income Tax (Php 15.2M); EWT (Php 136k ; VAT (Php 6M); WTC (Php 149k). On November 28, 2007, CEDCO availed of the Tax Amnesty Program under RA 9480 (Tax Amnesty Law of 2007), covering all national internal revenue taxes for 2005 and prior years. CEDCO filed its tax amnesty payment form and paid the corresponding amnesty tax on November 29, 2007. On June 24, 2008, the BIR issued a collection letter directing CEDCO to pay its tax liabilities based on the FDDA. Upon CEDCO's failure to settle, the BIR filed a criminal complaint-affidavit against CEDCO Treasurer Cagang and President Paredes for willful failure to pay taxes under NICR 255 of the NIRC. Here, the Court ruled in favor of the BIR CIR and held that: CEDCO is disqualified from tax amnesty for withholding tax liabilities Sec. 8(a) of RA 9480 and Sec. 5(a) of its IRR explicitly state that the tax amnesty shall not extend to withholding agents with respect to their withholding tax liabilities. The records reveal that as early as the September 28, 2007 FDDA, CEDCO was assessed for failure to withhold and remit EWT for 2000 and 2001, and WTC for 2001 under NIRC 57 and NIRC 79. Consequently, CEDCO is disqualified from availing of the tax amnesty under R.A. No. 9480 insofar as its withholding tax liabilities (EWT and WTC) are concerned. CEDCO is qualified for tax amnesty for deficiency income tax and VAT CEDCO complied with all statutory requirements under RA 9480, and there were no pending criminal cases filed against it at the time of its availment on November 28, 2007.", "nature": ""}, {"name": "CIR v CA", "tag": "&", "topic": "VI", "doctrine": "Organizations otherwise exempt from income tax under the NIRC are not exempt from income derived from their properties, real or personal, or from activities conducted for profit, under the last paragraph of then Section 27 of the NIRC, as amended by Presidential Decree No. 1457. The phrase activities conducted for profit does not qualify the word properties. Thus, income from the property of an exempt organization is taxable regardless of how that income is used or disposed of, even when the income is used for lofty non-profit purposes or is merely incidental to the organization’s operations. Because tax exemptions are construed strictly, a claimed exemption must be expressly granted in a statute in language too clear to be mistaken. Applied here, YMCA’s rental income from leasing portions of its real property to small shop owners, restaurants, canteen operators, and its parking fees were subject to income tax, notwithstanding YMCA’s non-stock, non-profit and charitable character and its use of the income to support its activities.", "facts": "YMCA, a non-stock, non-profit institution, earned income from leasing portions of its premises to small shop owners, restaurants and canteen operators, and from parking fees. The CTA found these activities reasonably incidental and necessary to YMCA’s objectives and exempted the rental income from income tax, while the CA initially reversed but later reinstated the CTA ruling. The Supreme Court held that the last paragraph of Section 27 of the NIRC expressly subjects income from the properties of otherwise exempt organizations to tax, regardless of whether the income is collected for profit or used for non-profit purposes. The Court further rejected YMCA’s constitutional claims because the constitutional property-tax exemptions did not create an income-tax exemption, and YMCA failed to establish that it was a covered educational institution or that the rental income was actually, directly, and exclusively used for educational purposes. The petition was granted,bthe CA Resolutions were reversed and set aside, and the CA Decision ruling that the rental income was subject to income tax was reinstated.", "nature": ""}, {"name": "Misamis Oriental Assoc. V. DOF (1994)", "tag": "", "topic": "VI", "doctrine": "Tax exemptions must be strictly construed against the taxpayer and liberally in favor of the State. In classifying copra as an agricultural non-food product, the CIR correctly gave Sec. 103(a) and (b) of the NIRC a strict construction. Under Sec. 103(a), the sale of non-food agricultural products in their original state is VAT-exempt only if made by the primary producer or landowner; under Sec. 103(b), the sale of agricultural food products in their original state is exempt at all stages regardless of the seller. Copra is not food (\"nobody eats copra for food\"); hence, its sale by traders and dealers is subject to VAT. The CIR's interpretation, as the agency charged with enforcing tax laws, is entitled to great weight unless plainly wrong. The CIR is not bound by the rulings of his predecessors. An interpretative rule (unlike a legislative rule) does not require prior notice and hearing. There is a substantial distinction between copra producers (who produce and sell) and traders/dealers (who merely sell); differential tax treatment does not violate equal protection.", "facts": "Misamis Oriental Association of Coco Traders, Inc. is a domestic corporation whose members are engaged in buying and selling copra in Misamis Oriental. Sec. 103 of the NIRC exempts from VAT: (a) the sale of non-food agricultural, marine and forest products in their original state by the primary producer or owner of the land where produced; and (b) the sale or importation in their original state of agricultural and marine food products ... for human consumption (exempt at all stages, regardless of seller). Before 1991, copra was classified as an agricultural food product under Sec. 103(b) (VAT Ruling Nos. 009-88 and 279-88) and was thus VAT-exempt at all stages of production or distribution. On June 11, 1991, the CIR issued Revenue Memorandum Circular (RMC) No. 47-91, implementing VAT Ruling No. 190-90, which reclassified copra as an agricultural non-food product, exempt from VAT only if sold by the primary producer under Sec. 103(a). As a result, the association's members (traders and dealers) lost the VAT exemption they previously enjoyed. The association relied on a letter of Dr. Quintin Kintanar of the Bureau of Food and Drug (April 10, 1991), opining that under the broader definition of food, copra should be classified as an agricultural food product since it comes from coconut meat and over 80% of copra products are edible. The association filed a petition for prohibition and injunction with the Supreme Court to nullify RMC No. 47-91 and enjoin the collection of VAT on its members' copra sales. Here, the SC held that tax exemptions must be strictly construed against the taxpayer and liberally in favor of the State, and the CIR correctly classified copra as a non-food product.", "nature": ""}, {"name": "Secretary of Finance v. Semirara Mining Corporation (2021)", "tag": "", "topic": "VI", "doctrine": "Tax exemptions are granted for specific public interests that the Legislature considered sufficient to offset the monetary loss in the grant of exemptions. To limit the tax-free importation privilege of FEZ enterprises by requiring them to pay subject to a refund clearly runs counter to the Legislature's intent to create a free port where the 'free flow of goods or capital within, into, and out of the zones' is ensured. The State's inherent power to tax is vested exclusively in the Legislature. We have since ruled that the power to tax includes the power to grant tax exemptions. Thus, the imposition of taxes, as well as the grant and withdrawal of tax exemptions, shall only be valid pursuant to a legislative enactment. The power of the petitioners to interpret tax laws is not absolute. The rule is that regulations may not enlarge, alter, restrict, or otherwise go beyond the provisions of the law they administer; administrators and implementors cannot engraft additional requirements not contemplated by the legislature.", "facts": "Respondent Semirara Mining Corporation (SMC) is a coal mine operator enjoying statutory tax exemptions under PD 972 and its Coal Operating Contract with the Department of Energy (dtd July 11, 1977, as amended on January 16, 1981). These tax incentives exempt SMC from paying VAT and excise taxes on its direct importation of petroleum products exclusively used for its coal mining operations. Petitioners DOF Secretary, BIR Commissioner, and BOC Commissioner issued Revenue Regulations No. 2-2012 (RR 2-2012): Designed to curb petroleum smuggling Sec. 3 of RR 2-2012 required all importers of petroleum products, without distinction, to first pay VAT and excise taxes upon importation at the port of entry, including Freeport and Economic Zones (FEZ), and thereafter file a claim for tax refund/credit with the BOC, subject to BIR endorsement. SMC filed a petition for declaratory relief before the RTC of Makati City to protect its tax immunity under PD 972 and its Coal Operating Contract, contending that RR 2-2012 illegally restricted and burdened its statutory exemption Here, the SC dismissed the petition for being MOOT and held that: The case was rendered moot because RR 2-2012 had already been declared unconstitutional and null and void in toto by the SC En Banc in Purisima v. Lazatin (2016)", "nature": ""}, {"name": "Petron Corp v. CIR (2023)", "tag": "", "topic": "VI", "doctrine": "The rule applicable in this case is the doctrine of strict construction of tax laws in favor of the taxpayer The rule that tax exemptions should be construed strictly against the taxpayer presupposes that the taxpayer is clearly subject to the tax being levied against him. Unless a statute imposes a tax clearly, expressly and unambiguously, what applies is the equally well-settled rule that the imposition of a tax cannot be presumed. Where there is doubt, tax laws must be construed strictly against the government and in favor of the taxpayer. This is because taxes are burdens on the taxpayer, and should not be unduly imposed or presumed beyond what the statutes expressly and clearly import.", "facts": "Petitioner Petron Corporation is a domestic corporation engaged in manufacturing and marketing petroleum products. It operates its own oil refinery in Limay, Bataan, where it manufactures gasoline products. Between July and November 2012, Petron imported alkylate on five different occasions. July 18, 2012, the BOC issued CMC 164-2012, implementing a June 2012 BIR letter. The CMC declared that alkylate is \"a product of distillation similar to that of naphtha\" and is therefore subject to excise tax under NIRC 148(e) . Under threat of non-release of its shipments, Petron paid excise taxes in the aggregate amount of Php 219M. Petron subsequently filed administrative claims for refund, asserting that alkylate is not covered by NIRC 148(e) and was thus illegally collected. It also filed two corresponding Petitions for Review before the CTA to prevent the two-year prescriptive period from lapsing The Court resolved the questions (1) whether alkylate is subject to excise tax under NIRC 148(e), as amended by RA 3337, and (2) whether Petron is entitled to a refund of the Php 219M excise taxes paid under the proper rules of statutory construction Here, the Court granted Petron’s petition and ordered the refund. Petron was not claiming a tax exemption, but rather challenging the lack of a law imposing a tax on alkylate. Applying the proper rule of construction, the SC held that tax-imposing statutes must be strictly construed against the government. Because alkylate is produced by alkylation, is not listed in NIRC 148(e), and is not similar to naphtha, it is not taxable", "nature": ""}, {"name": "Brewery Properties v CIR (2023)", "tag": "", "topic": "VI", "doctrine": "Tax refunds are in the nature of tax exemptions, and hence, construed strictissimi Juris. Tax refunds derogate the State's power of taxation; thus, they must be construed strictly against the taxpayer and liberally in favor of the State. Consequently, a taxpayer must justify its claim for refund by words too plain to be mistaken and too categorical to be misinterpreted.", "facts": "Petitioner Brewery Properties, Inc. (BPI) is a domestic corporation engaged in holding, developing, and leasing real estate, and is a wholly-owned subsidiary of San Miguel Brewery, Inc. (SMBI). Following an audit of BPI's 2009 internal revenue tax liabilities, the Bureau of Internal Revenue (BIR) issued a Formal Letter of Demand (FLD) and Assessment Notices for deficiency income tax, VAT, and DST aggregating Php 6.3M. BPI filed a protest against the assessment. On September 14, 2012, the BIR issued an FDDA demanding deficiency DST on non-interest bearing advances received by BPI from its affiliates (SMC and SMBI) totaling Php 82M, as disclosed in Note 6 of BPI's Audited Financial Statements. BPI received the FDDA on September 19, 2012. On September 24, 2012, BPI paid under protest the total assessed amount of Php 760k (consisting of Php 411k basic DST, Php 103k surcharge, Php 231k interest, and Php 16k compromise penalty). BPI did not file an appeal with the CTA within thirty (30) days from its receipt of the FDDA (the appeal period expired on October 19, 2012). On June 30, 2014, BPI filed an administrative claim for refund with the BIR. On September 18, 2014, BPI filed a Petition for Review for refund before the CTA. Here, the SC ruled in favor of the CIR and affirmed that inter-company advances disclosed in financial statement notes are subject to DST as loan agreements/debt instruments under Section 179 of the NIRC.", "nature": ""}, {"name": "Phil. Mining Dev Corp v CIR (2021)", "tag": "*GOCC Filed in CTA Before PSALM – New Jurisdiction Rule Cannot Apply Retroactively", "topic": "VII", "doctrine": "While, as a general rule, judicial interpretation becomes part of the law as of the date that law was originally passed, when a doctrine of this Court is overruled, and a different view is adopted, the new doctrine should be applied prospectively and should not apply to parties who relied on the old doctrine and acted in good faith. Thus, although PSALM subsequently held that the Secretary of Justice, not the CTA, has jurisdiction over tax disputes solely between government entities, the reversal of the interpretation cannot be given retroactive effect to the prejudice of parties who may have relied on the first interpretation.", "facts": "PMDC, a GOCC, filed a petition with the CTA in March 2016 challenging the BIR’s deficiency income tax assessment, when prevailing jurisprudence under PNOC and PAGCOR recognized the CTA’s jurisdiction over disputed tax assessments even when the parties were government entities. While the case was pending and after the parties had already presented their evidence, the SC decided PSALM in 2017, holding that intra-governmental tax disputes fall within the jurisdiction of the Secretary of Justice. CTA applied PSALM and dismissed PMDC’s case for lack of jurisdiction. SC held that PMDC had properly relied on the prevailing doctrine when it filed its petition and could not be prejudiced by the subsequent reversal of that interpretation. Accordingly, PSALM was applied prospectively as to PMDC, and the SC reinstated the petition and directed the CTA to resolve it.", "nature": ""}, {"name": "San Miguel Corp. v CIR (2023)", "tag": "*2009 Intercompany Advances – 2011 Filinvest Interpretation Applied Retroactively", "topic": "VII", "doctrine": "Judicial decisions applying or interpreting the law form part of the legal system, and the interpretation placed upon a law by a competent court establishes the contemporaneous legislative intent of the law. Thus, such interpretation constitutes a part of the law as of the date the statute is enacted. A judicial interpretation does not amount to a new law but merely construes a pre-existing one. However, when a prior doctrine of the Court is overruled and a different view is adopted, the new doctrine should be applied prospectively and should not apply to parties who relied on the old doctrine and acted in good faith. Thus, because Filinvest did not overturn any prior binding doctrine, its interpretation of Sec. 179 of the NIRC applied to SMC’s 2009 transactions even though Filinvest was decided only in 2011.", "facts": "SMC made intercompany advances to related parties in 2009, which the BIR later subjected to DST based on the 2011 Filinvest ruling that instructional letters and journal and cash vouchers evidencing advances may qualify as loan agreements subject to DST. SMC argued that applying Filinvest to its earlier transactions violated the rule on prospectivity because, in 2009, such advances were supposedly not treated as taxable loan agreements. SC held that Filinvest merely interpreted Sec. 179 of the NIRC and therefore its interpretation formed part of the statute from the time the law took effect. SMC failed to establish any prior binding Supreme Court doctrine holding that such intercompany advances were not subject to DST; the APC Minute Resolution was not binding precedent, while BIR rulings issued to other taxpayers could not be invoked by SMC. Accordingly, Filinvest could be applied to SMC’s 2009 transactions, and SMC remained liable for the DST and corresponding interest.", "nature": ""}, {"name": "CIR v CTA 2nd Division and QL Development Inc (2022)", "tag": "*2010 Deficiency Taxes Already Prescribed – CTA Enjoined BIR Collection", "topic": "VII", "doctrine": "While an injunction is not available to restrain the collection of taxes, the rule admits of an exception under Sec. 11 of R.A. No. 1125, as amended. CTA may enjoin the collection of taxes if such collection will jeopardize the interest of the government or the taxpayer, and may require the taxpayer either to deposit the amount claimed or file a surety bond for not more than double the amount. CTA has ample authority to issue injunctive writs to restrain the collection of tax, especially in cases where prescription has set in. Thus, CTA properly enjoined collection from QLDI because the CIR’s right to collect the deficiency taxes had already prescribed and QLDI had posted a surety bond approved by CTA.", "facts": "BIR assessed QL Development for deficiency taxes for taxable year 2010 but did not commence collection by distraint, levy, or judicial proceeding within the applicable prescriptive period. QLDI challenged the collection before the CTA, which found that the CIR’s right to collect had already prescribed and enjoined further collection after approving QLDI’s surety bond. CIR argued that the CTA had no authority to issue an injunction against tax collection and could only suspend collection. SC rejected this distinction, holding that Sec. 11 of R.A. No. 1125 authorizes the CTA to restrain collection when it may jeopardize the government’s or taxpayer’s interest. Because the CIR’s collection right had already prescribed, the injunction had sufficient basis and was properly issued.", "nature": ""}, {"name": "CIR v. Ayala Securities Corp. (1980)", "tag": "*25% Surtax on Unreasonably Accumulated Surplus – No Statutory Prescriptive Period", "topic": "VII", "doctrine": "Limitations upon the right of the government to assess and collect taxes will not be presumed in the absence of clear legislation to the contrary. Where the government has not by express statutory provision provided a limitation upon its right to assess unpaid taxes, such right is imprescriptible. Thus, there was no time limit on the CIR’s right to assess the 25% tax on unreasonably accumulated surplus under Sec. 25 of the Tax Code because there was no express statutory provision limiting such right or providing for its prescription. The five-year period under Sec. 331 and the ten-year period under Sec. 332 did not apply because those provisions contemplated taxes requiring the filing of a return, while no return was required for unreasonably accumulated surplus.", "facts": "Ayala Securities filed its income tax return for fiscal year 1955, but the CIR assessed it in 1961 for a 25% surtax on its unreasonably accumulated surplus. The Court initially held that the assessment had prescribed under the five-year period in Sec. 331, but reconsidered because no return was required to be filed specifically for accumulated surplus. Since Secs. 331 and 332 applied to taxes requiring returns, neither supplied a prescriptive period for the Sec. 25 surtax. Applying the principle that limitations on the government’s right to assess taxes must rest on an express statutory provision, the Court held that the CIR’s right to assess the surtax was imprescriptible and upheld the assessment.", "nature": ""}, {"name": "CIR v. Standard Chartered Bank (2015)", "tag": "*1998 Deficiency Taxes – Defective Waivers Failed to Extend 3-Year Prescription", "topic": "VII", "doctrine": "Under Sec. 203 of the NIRC, the government generally has three years from the actual filing of the return or the last date prescribed by law for its filing, whichever comes later, to assess an internal revenue tax. Sec. 222(b) permits extension through a written agreement executed before the applicable period expires, but a waiver is not automatically a renunciation of the defense of prescription; it is an agreement between the taxpayer and the BIR that the period to issue an assessment and collect the taxes due is extended to a date certain. The law on prescription, being a remedial measure, should be liberally construed to protect taxpayers, while its exceptions should perforce be strictly construed. Thus, failure to comply with the mandatory requirements for a valid waiver renders it defective and ineffectual and does not extend the prescriptive period.", "facts": "BIR assessed Standard Chartered Bank in 2004 for deficiency taxes covering taxable year 1998, relying on several waivers to extend the three-year prescriptive period. The first two waivers were defective because, among others, they were not signed by the CIR as required for assessments exceeding ₱1 million, lacked dates of BIR acceptance, and failed to specify the kind and amount of tax due. Because these waivers were invalid, the original prescriptive period was never extended, and the subsequent waivers could not revive a period that had already prescribed. The Bank’s partial payment of its deficiency WTC and FWT did not estop it from invoking prescription as to the remaining assessments because it consistently maintained that defense. Accordingly, the deficiency income tax, FCDU, and EWT assessments issued beyond the three-year period were void.", "nature": ""}, {"name": "CIR v. SC Johnson", "tag": "&", "topic": "VII", "doctrine": "Tax treaties seek to eliminate international juridical double taxation, which is the imposition of comparable taxes in two or more states on the same taxpayer in respect of the same subject matter and for identical periods. Double taxation may be relieved through the exemption method, where income or capital taxable in the source state is exempted in the residence state, or the credit method, where the tax paid in the source state is credited against the tax levied in the residence state. The underlying rationale for reducing the source-state tax is that the Philippines gives up part of its tax in the expectation that the tax given up for this particular investment is not taxed by the other country. Thus, under the most-favored-nation clause of the RP-US Tax Treaty, the 10% royalty rate under the RP-Germany Tax Treaty could apply only if the taxes were paid under similar tax-related circumstances, including comparable relief from double taxation.", "facts": "S.C. Johnson Philippines paid royalties to its U.S. parent for the use of trademarks, patents, and technology and withheld Philippine tax at 25%, but later sought a refund based on the 10% royalty rate under the RP-Germany Tax Treaty through the most-favored-nation clause of the RP-US Tax Treaty. The German treaty paired its reduced royalty rate with a 20% matching tax credit in Germany, while the RP-US Tax Treaty contained no comparable matching credit. SC explained that tax treaties allocate taxing rights and provide exemption or credit mechanisms so that the same income is not subjected to an unrelieved tax burden in both the source and residence states. Because the U.S. and German treaty arrangements did not provide similar tax relief, the royalties were not taxed under similar circumstances. S.C. Johnson was therefore not entitled to the German treaty’s 10% rate or the claimed refund.", "nature": ""}, {"name": "Star Appliance v. City of Manila (2014)", "tag": "*Manila Businesses Taxed Under Two Ordinance Sections – Same Privilege of Doing Business", "topic": "VII", "doctrine": "There is double taxation when the same taxpayer is taxed twice when he should be taxed only once for the same purpose by the same taxing authority within the same jurisdiction during the same taxing period, and the taxes are of the same kind or character. Otherwise described as direct duplicate taxation, the two taxes must be imposed (1) on the same subject matter; (2) for the same purpose; (3) by the same taxing authority; (4) within the same taxing jurisdiction; (5) during the same taxing period; and (6) be of the same kind or character. Double taxation is obnoxious. Here, the taxes under Sections 15/17 and 21 of the Manila Revenue Code satisfied all these elements because they were local business taxes imposed on the same privilege of doing business in Manila, for the same revenue-raising purpose, by the City of Manila, within the same jurisdiction and taxing period.", "facts": "The City of Manila already collected local business taxes from the petitioners as wholesalers, distributors, dealers, or retailers under Sections 15 and 17 of the Manila Revenue Code, but additionally assessed them under Section 21 as a condition for renewing their business licen
