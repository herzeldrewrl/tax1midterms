<style>
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface2:#EEF1F5; --ink:#0F1B2D; --muted:#46536A; --line:#D9DEE5; --line2:#E7EAEF;
  --blue:#1D3A8A; --blue-soft:#E8EDF8; --blue-line:#B8C4DD; --orange:#9A4508; --orange-btn:#B4530A; --orange-soft:#FBEDE2;
  --on-blue:#FFFFFF; --head:#0F1B2D; --head-ink:#FFFFFF; --head-muted:#C9D3E3; --head-active:#22344F;
  --serif:'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --sans:'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1622; --surface:#16202F; --surface2:#1E2A3C; --ink:#E8EDF5; --muted:#A7B3C6; --line:#2C3A50; --line2:#253246;
    --blue:#9DB4F0; --blue-soft:#1F2D4D; --blue-line:#3A4D78; --orange:#F2A56B; --orange-btn:#C9661C; --orange-soft:#3A2516;
    --head:#0A111B; --head-active:#1C2A40; --on-blue:#0E1622;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1622; --surface:#16202F; --surface2:#1E2A3C; --ink:#E8EDF5; --muted:#A7B3C6; --line:#2C3A50; --line2:#253246;
  --blue:#9DB4F0; --blue-soft:#1F2D4D; --blue-line:#3A4D78; --orange:#F2A56B; --orange-btn:#C9661C; --orange-soft:#3A2516;
  --head:#0A111B; --head-active:#1C2A40; --on-blue:#0E1622;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
header.top{background:var(--head);color:var(--head-ink)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--serif);font-weight:600;font-size:20px}
.brand span{font-size:13px;color:var(--head-muted)}
nav.main{display:flex;flex-wrap:wrap;gap:4px}
nav.main button{background:none;border:0;color:#DDE4EF;padding:10px 14px;border-radius:6px;cursor:pointer;font-size:14px;min-height:44px}
nav.main button[aria-current="page"]{background:var(--head-active);color:#fff;font-weight:600}
main{padding:28px 0 64px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0}
h2{font-size:20px;font-weight:600;margin:0}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.case{font-family:var(--serif);font-style:italic}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:22px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.layout{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.layout>.side{flex:1 1 280px;min-width:0}
.layout>.mainc{flex:999 1 560px;min-width:0}
.btn{min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--blue-line);background:var(--surface);color:var(--blue);font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.warm{background:var(--orange-btn);border-color:var(--orange-btn);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;border-radius:999px;padding:7px 13px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.tag{display:inline-block;font-size:13px;border-radius:4px;padding:2px 8px;background:var(--surface2);color:var(--muted)}
.tag.strong{background:var(--blue-soft);color:var(--blue);font-weight:600}
.checks{display:flex;flex-direction:column;gap:2px;font-size:14px}
.checks label{display:flex;gap:10px;align-items:center;min-height:34px;cursor:pointer}
.checks input{width:18px;height:18px;accent-color:var(--blue)}
.topicnum{display:inline-block;width:48px;font-weight:600;color:var(--blue)}
.progress{height:6px;background:var(--line2);border-radius:3px;overflow:hidden}
.progress>div{height:6px;background:var(--blue)}
.qtext{font-size:21px;line-height:1.45;font-weight:500}
.choices{display:grid;gap:10px}
.choice{text-align:left;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:16px;min-height:52px}
.choice.right{border:2px solid var(--blue);background:var(--blue-soft);color:var(--blue);font-weight:600}
.choice.wrong{border:2px solid var(--orange);background:var(--orange-soft);color:var(--orange);font-weight:600}
.tf{grid-template-columns:repeat(2,minmax(0,1fr))}
.tf .choice{text-align:center;font-weight:600;font-size:18px}
.verdict{font-weight:700;font-size:18px}
.verdict.ok{color:var(--blue)} .verdict.no{color:var(--orange)}
.feedback{border-top:1px solid var(--line2);padding-top:18px;display:flex;flex-direction:column;gap:10px}
textarea,input[type=text],input[type=search],select{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 12px;width:100%}
textarea{line-height:1.6;resize:vertical}
select,input[type=text],input[type=search]{min-height:44px}
.codal{background:var(--surface2);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.note{background:var(--orange-soft);color:var(--orange);border-radius:8px;padding:12px 14px;font-size:15px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.item{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--ink)}
.item:hover{background:var(--surface2)}
.item[aria-current="true"]{background:var(--blue-soft);color:var(--blue)}
.item b{display:block;font-size:15px}
.item small{display:block;font-size:13px;color:var(--muted)}
.done-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:6px;vertical-align:middle}
.scroll{max-height:560px;overflow:auto}
.timer{font-variant-numeric:tabular-nums;font-size:24px;font-weight:600}
.timer.low{color:var(--orange)}
.grid-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.mode{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:20px;color:var(--ink)}
.mode b{font-size:17px}
.cov{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:13px 20px;border-top:1px solid var(--line2)}
.cov:first-child{border-top:0}
.cov .t{flex:1 1 300px;min-width:0}
.cov .n{font-size:13px;color:var(--muted);min-width:190px}
.flash{min-height:320px;width:100%;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:32px}
.flash .name{font-family:var(--serif);font-style:italic;font-weight:500;font-size:clamp(24px,3vw,34px);line-height:1.2}
.ai{border:1px solid var(--blue-line);border-radius:10px;padding:16px;white-space:pre-wrap;font-size:15px}
.hidden{display:none!important}
.enumrow{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.enumrow input{width:18px;height:18px;margin-top:3px;accent-color:var(--blue)}
.kbd{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.cb{width:100%;border-collapse:collapse;min-width:900px;font-size:15px}
table.cb td.d{width:32%}
table.cb td.f{color:var(--ink);line-height:1.55}
table.cb th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2);padding:10px 14px;border-bottom:1px solid var(--line)}
table.cb td{padding:12px 14px;border-top:1px solid var(--line2);vertical-align:top}
table.cb tr:first-child td{border-top:0}
table.cb td.n{width:40px;color:var(--muted);font-variant-numeric:tabular-nums}
table.cb td.c{width:22%}
table.cb td.c b{font-family:var(--serif);font-style:italic;font-weight:500;font-size:16px;display:block}
table.cb td.s{width:110px}
mark{background:var(--orange-soft);color:inherit;border-radius:2px}
.topichead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;padding-top:6px}
@media print{header.top,.noprint{display:none!important}body{background:#fff;color:#000}main{padding:0}.tablewrap{border:0;overflow:visible}table.cb{min-width:0;font-size:11px}table.cb th{background:#eee}h2.tp{break-after:avoid}tr{break-inside:avoid}}
@media (max-width:640px){.qtext{font-size:18px}.pad{padding:16px}.flash{padding:22px}}
@media (prefers-reduced-motion:no-preference){.choice,.btn,.chip{transition:background-color .15s,border-color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Tax 1 Reviewer</b><span>Law 129-A · Midterms Oct 8</span></div>
    <nav class="main" aria-label="Main">
      <button data-go="home">Home</button>
      <button data-go="quiz">Objective drill</button>
      <button data-go="essay">Essay drill</button>
      <button data-go="cards">Case cards</button>
      <button data-go="bank">Case bank</button>
    </nav>
  </div>
</header>
<main><div class="wrap" id="app"></div></main>

<script>
// Objective question bank. Sources: N = class notes, Q = UST QuAMTO 2026, B = UP BarOps 2026, C = NIRC, S = syllabus
const tf=(t,q,a,e,s)=>({type:'tf',topic:t,q,answer:a,explain:e,src:s});
const mcq=(t,q,c,a,e,s)=>({type:'mcq',topic:t,q,choices:c,answer:a,explain:e,src:s});
const idq=(t,q,a,acc,e,s)=>({type:'id',topic:t,q,answer:a,accept:acc,explain:e,src:s});
const en=(t,q,items,e,s)=>({type:'enum',topic:t,q,items,explain:e,src:s});
const df=(t,q,model,pts,s)=>({type:'def',topic:t,q,model,points:pts,src:s});
const both=(t,s1,s2,a,e,s)=>({type:'both',topic:t,s1,s2,answer:a,explain:e,src:s});

const QUESTIONS = [
// ---------- I. TAXATION ----------
tf('I','Internal revenue laws are political in nature; hence, they were suspended during the Japanese occupation.',false,'Internal revenue laws are not political. They stay in force during enemy occupation and are deemed laws of the occupied territory, so wartime years remained taxable years. (Hilado v. CIR)','N'),
tf('I','The power to tax is the strongest of the inherent powers of the State, and for that reason it is not subject to any limitation.',false,'Sison v. Ancheta calls it the strongest power of government, but "for all its plenitude" it remains subject to inherent and constitutional limitations.','N'),
tf('I','A tax does not become invalid merely because it regulates, discourages, or even deters the activity taxed.',true,'Tio v. Videogram Regulatory Board: a levy may serve regulatory and revenue purposes at the same time; taxation may be an implement of police power.','N'),
tf('I','A taxpayer may refuse to pay a tax by showing that he receives no personal benefit from it.',false,'Lorenzo v. Posadas: the obligation rests on the necessity of money for the support of the State, not on the benefit a particular taxpayer receives.','N'),
tf('I','Under the Constitution, every individual tax law must itself be progressive, otherwise it is void.',false,'Tolentino v. Secretary of Finance: the command to "evolve a progressive system of taxation" is a directive to Congress, not a judicially enforceable standard. The system as a whole must be progressive; regressive taxes like VAT are not invalid per se.','N'),
tf('I','Continuing to collect real property taxes on outdated valuations despite rising property values is consistent with the principle of fiscal adequacy.',false,'Chavez v. Ongpin: fiscal adequacy requires revenue sources adequate to meet government expenditures; outdated valuations run against a sound tax system.','N'),
tf('I','Levy is performed by the legislature, while assessment and collection are performed by the executive through the BIR.',true,'Levy (imposition by law) is legislative. Assessment and collection are acts of administration by the BIR. Payment is the taxpayer\'s act of compliance.','N, B'),
mcq('I','Which statement best expresses the lifeblood theory?',['Assessed taxes must be enforced by the government.','The underlying basis of taxation is government necessity; without taxes, government can neither exist nor endure.','Taxation is an arbitrary exaction by those in power.','Taxation is an inherent power to impose burdens on subjects within the jurisdiction to raise revenue.'],1,'This was a 2012 Bar question. Choice B states the lifeblood or necessity rationale (CIR v. Algue; NAPOCOR v. City of Cabanatuan). Choice D is a definition of taxation, not the theory.','Q, N'),
mcq('I','The principle that the tax burden should be in proportion to the taxpayer\'s ability to pay is called:',['Fiscal adequacy','Administrative feasibility','Theoretical justice','Uniformity'],2,'Theoretical justice (or equality) requires taxes proportional to ability to pay, in line with the mandate to evolve a progressive system.','B, N'),
mcq('I','Which power may be exercised by private entities such as public utilities, if granted by law?',['Taxation','Police power','Eminent domain','All of them'],2,'Eminent domain may be delegated to public service companies and utilities. Taxation and police power are exercised only by the government and its political subdivisions.','B'),
idq('I','What theory holds that taxation rests on reciprocal duties: the taxpayer supports the State, and the State gives back tangible and intangible benefits?','Benefits-protection or symbiotic relationship theory',['benefit','symbiotic','reciprocal','protection'],'CIR v. Algue describes taxation as a symbiotic relationship between the State and the taxpayer.','N'),
idq('I','What is the name for the doctrine that the power to tax "should be exercised with caution" lest the tax collector "kill the hen that lays the golden egg"?','Power to tax involves the power to destroy (Roxas v. CTA)',['destroy','roxas','golden egg'],'Roxas v. CTA: because the power to tax may destroy, it must be exercised fairly, equally, uniformly, and justly.','N'),
en('I','Enumerate the three principles (canons) of a sound tax system.',['Fiscal adequacy','Administrative feasibility','Theoretical justice (equality)'],'Non-observance of these canons alone does not invalidate a tax unless a constitutional or statutory limitation is also impaired (Diaz v. Secretary of Finance).','B, N'),
en('I','Enumerate the stages or aspects of taxation.',['Levy (imposition by Congress)','Assessment (determination of the amount due)','Collection (payment and enforcement)'],'Some authors add refund as a fourth stage; your notes mention it as included in the professor\'s book.','N, B'),
df('I','Define taxation.','Taxation is the inherent power of the sovereign State, exercised through its legislature, to impose burdens upon persons, property, rights, or transactions within its jurisdiction in order to raise revenue for the support of the government and to defray public needs.',['Inherent in sovereignty','Exercised through the legislature','Burden on persons, property, rights or transactions','Within the jurisdiction','To raise revenue for public purposes'],'N, B'),

// ---------- II. TAXES ----------
tf('II','Taxes may be the subject of set-off or compensation against a claim of the taxpayer against the government.',false,'Republic v. Mambulao Lumber; Caltex v. COA: the government and taxpayer are not mutually creditors and debtors; taxes arise from sovereignty, not contract.','N, Q'),
tf('II','An exemption of religious property from "taxes" automatically covers special assessments for public improvements.',false,'Apostolic Prefect v. Treasurer of Baguio: a special assessment is not strictly a tax, so an exemption from taxes does not extend to it.','N, B'),
tf('II','Toll fees are taxes because they are collected for the use of public infrastructure.',false,'Diaz v. Secretary of Finance: tolls are demands of proprietorship, taxes are demands of sovereignty. Tolls may be collected by private operators.','N, B'),
tf('II','If revenue is at least one of the real and substantial purposes of an exaction, it is properly classified as a tax even if it also regulates.',true,'PAL v. Edu; Municipality of San Mateo v. Smart. The primary-purpose test controls; the name given to the exaction does not.','N'),
tf('II','Failure to pay a license fee makes the business illegal, while failure to pay a tax does not.',true,'A license fee is a condition for engaging in a regulated activity; non-payment of a tax does not by itself make the business illegal.','B'),
tf('II','Tax avoidance and tax evasion are both punishable because both reduce government revenue.',false,'Avoidance uses legally permissible means and is not punishable (Delpher Trades). Evasion uses illegal or fraudulent means and is punishable.','N, Q, B'),
tf('II','A purchaser who bears the economic burden of a shifted excise tax becomes the statutory taxpayer.',false,'Pilipinas Shell v. CIR (2021): passing on shifts the burden, not the liability. The seller remains the statutory taxpayer.','N'),
tf('II','A final assessment is a precondition before a criminal case for violation of the Tax Code may be filed.',false,'People v. Mendez (2023): only probable cause is required. The criminal action carries with it the civil action for the tax, so no prior assessment is needed.','N, Q'),
mcq('II','Which of the following is NOT an essential element of a tax?',['An enforced proportional contribution from persons and property','Imposed by the State by virtue of its sovereignty','Levied for the support of the government','Payable only in money'],3,'The three elements per Republic v. COCOFED and Mandanas are A, B, and C. Taxes are generally payable in money, but that is a characteristic, not an element.','N, B'),
mcq('II','Which tax can be shifted to the buyer?',['Income tax','Donor\'s tax','Value-added tax','Estate tax'],2,'Indirect taxes like VAT, percentage tax, and excise tax may be shifted. Direct taxes like income, donor\'s, and estate tax cannot.','B'),
mcq('II','In Ferrer v. Bautista, Quezon City\'s garbage fee was held to be:',['A tax, because it raised revenue','A fee, because regulation was its primary purpose','A special assessment','A toll'],1,'Garbage fees are charges for regulating an activity, valid under the LGC and RA 9003, but must still be reasonable and not violate equal protection.','N'),
idq('II','What is the point where the tax burden finally rests, after shifting?','Incidence of taxation',['incidence'],'Impact is the point of initial imposition (the statutory taxpayer). Incidence is where the burden ultimately settles.','B'),
idq('II','What kind of shifting occurs when the burden moves from the producer through distribution to the ultimate consumer?','Forward shifting',['forward'],'Backward shifting moves from consumer back to producer; onward shifting happens two or more times.','B'),
en('II','Enumerate the elements of tax evasion.',['The end to be achieved: payment of less than what is known to be legally due, or none','A state of mind that is evil, in bad faith, willful, or deliberate','A course of action or failure of action that is unlawful'],'CIR v. Estate of Toda. Fraud need not be shown by direct evidence; it may be inferred from circumstances.','B, N'),
en('II','Enumerate the classifications of taxes as to rate.',['Specific (fixed amount per unit)','Ad valorem (based on value)','Mixed (both specific and ad valorem)'],'Other bases of classification: object, purpose, burden, scope, and graduation.','N'),
en('II','Enumerate the classifications of taxes as to graduation of rate.',['Proportional','Progressive','Regressive'],'A progressive tax rate is different from a progressive system of taxation, which looks at the system as a whole.','N'),
df('II','Define a tax and give its essential elements.','Taxes are the enforced proportional contributions exacted by the State from persons and property, by virtue of its sovereignty, for the support of the government and all public needs.',['Enforced proportional contribution from persons and property','Imposed by the State by virtue of sovereignty','Levied for the support of the government'],'B (Mandanas v. Ochoa), S (Republic v. COCOFED), N'),
df('II','Distinguish tax avoidance from tax evasion.','Tax avoidance is the use of legally permissible means to reduce or avoid tax; it is a tax-saving device and is not punishable. Tax evasion is the use of illegal or fraudulent means to defeat or lessen the payment of a tax; it is punishable under the Tax Code.',['Avoidance: legal means, tax minimization, not punishable','Evasion: illegal or fraudulent means, tax dodging, punishable','Case: Delpher Trades v. IAC; CIR v. Estate of Toda'],'N, Q, B'),
both('II','A debt may be paid in money, property or services, while a tax is generally payable in money.','Non-payment of a debt may result in imprisonment, while non-payment of any tax never results in imprisonment.','TF','Statement I is true. Statement II is false: non-payment of tax may result in imprisonment except for poll tax; it is non-payment of debt that generally does not.','B'),

// ---------- III. SOURCES ----------
tf('III','A revenue regulation that adds a qualification not found in the statute is valid as long as it was issued by the Secretary of Finance.',false,'CIR v. San Miguel Corp. (2019): rules must stay within the law they implement; a regulation that adds a condition not in the statute is void.','N'),
tf('III','An administrative rule that substantially increases the burden of those governed requires prior notice, hearing, and publication.',true,'Hypermix Feeds; PSE v. Secretary of Finance (2022). A rule that merely fills in details does not.','N'),
tf('III','The BIR may impose additional requirements, like a prior application, before a taxpayer may enjoy treaty relief.',false,'Deutsche Bank v. CIR (2013): pacta sunt servanda; the BIR cannot impose requirements that would defeat or frustrate treaty relief.','N'),
tf('III','A challenge to the legality of a tax ordinance must be appealed to the Secretary of Justice within 30 days from its effectivity.',true,'Hagonoy Market Vendor v. Municipality of Hagonoy: the 30-day period is mandatory and runs from effectivity, not from actual knowledge.','N'),
tf('III','Requiring amortization of input VAT on capital goods over 60 months is void because it deprives the taxpayer of the credit.',false,'CIR v. Taganito Mining (2021): the rule merely fills in details and only delays full application of the credit; it is valid.','N'),
mcq('III','Who promulgates revenue regulations under Sec. 244 of the NIRC?',['The Commissioner of Internal Revenue alone','The Secretary of Finance, upon recommendation of the Commissioner','The President','Congress'],1,'Sec. 244, NIRC. The CIR\'s power to recommend rules and regulations cannot be delegated (Sec. 7).','C, N'),
en('III','Enumerate the sources of tax laws.',['Constitution','Statutes (NIRC, CMTA, LGC Book II, special laws)','Administrative issuances (revenue regulations, rulings, circulars)','Tax or revenue ordinances','Tax treaties and international agreements','Judicial decisions (SC and CTA)'],'Legislative materials may also aid interpretation, per the syllabus.','S, N'),
en('III','Enumerate the requisites for the validity and effectivity of tax regulations.',['Reasonable','Within the authority conferred by law','Not contrary to law and the Constitution','Published'],'For regulations that enforce or implement the law, publication in a newspaper of general circulation and filing with the ONAR are required.','B'),

// ---------- IV-A. INHERENT LIMITATIONS ----------
tf('IV-A','A tax whose proceeds go to a special fund for the industry taxed is automatically void for lack of public purpose.',false,'Lutz v. Araneta: protecting and stabilizing a vital national industry is a legitimate public purpose, even if the proceeds benefit that industry.','N'),
tf('IV-A','A levy collected primarily to pay the debts of a private corporation is unconstitutional.',true,'Planters Products v. Fertiphil (2008): a tax for the financial viability of a private corporation lacks public purpose.','N'),
tf('IV-A','Congress, under the 1987 Constitution, may abolish the power of local governments to tax.',false,'2003 Bar. Sec. 5, Art. X grants LGUs the power directly; Congress may only provide guidelines and limitations.','Q'),
tf('IV-A','A city mayor may impose an "elevator tax" by executive order without an ordinance.',false,'2003 Bar. Under Sec. 132 of the LGC, the power to impose taxes is exercised by the sanggunian through an appropriate ordinance.','Q'),
tf('IV-A','A revenue regulation using gross income as the tax base for corporations, where the law uses net income, is valid as mere implementation.',false,'1994 Bar. Changing the tax base changes the amount of tax, which is a legislative function; it is unauthorized legislation.','Q'),
tf('IV-A','Government instrumentalities with corporate powers, like MWSS and LRTA, are exempt from real property tax, but the tax on portions leased to private persons falls on those lessees.',true,'MWSS v. CBAA (2021); LRTA v. City of Pasay (2022); Philippine Heart Center v. Quezon City (2020).','N'),
tf('IV-A','The withdrawal of tax exemptions under the Local Government Code also revoked exemptions from national internal revenue taxes.',false,'CIR v. Semirara Mining and Power Corp. (2026): the LGC withdrawal applies only to local taxes and does not revoke exemptions from national taxes.','N'),
tf('IV-A','The source of income from ticket sales of an offline foreign airline is the place where its planes fly.',false,'CIR v. BOAC: the source is the activity that produced the income. Sales of tickets in the Philippines produced Philippine-source income.','N, Q'),
tf('IV-A','An executive agreement exempting interest on loans from Philippine income tax is valid under international comity.',true,'1992 Bar; Mitsubishi Corp. v. CIR (2017): an Exchange of Notes is a binding executive agreement that can validly create tax exemptions or assumptions.','Q, N'),
tf('IV-A','Congress may impose a real property tax on land owned by Filipinos abroad, since citizens are subject to Philippine jurisdiction.',false,'2025 Bar. Real property may be taxed only by the State where it is located. Territoriality limits the power to tax.','Q'),
mcq('IV-A','Which of the following is NOT a recognized exception to the non-delegability of the taxing power?',['Delegation to local government units','Delegation to the President of tariff powers under Sec. 28(2), Art. VI','Delegation of emergency powers in times of war','Delegation to private persons to fix tax rates'],3,'Exceptions: LGUs, the President (flexible tariff clause and emergency powers), and administrative agencies filling in details. Never to private persons.','B, N'),
mcq('IV-A','Entrusting the collection of market stall fees to a private corporation:',['Is valid as an exercise of police power','Violates the public purpose limitation','Is valid if approved by the Mayor','Is valid if the fees are reasonable'],1,'1989 Bar. Sec. 130(c), LGC prohibits letting to private persons the collection of local taxes and fees; part of public funds would go to a private purpose.','Q'),
mcq('IV-A','Under ABAKADA Guro v. Purisima, which part of the Attrition Act was struck down?',['The revenue targets','The rewards and sanctions system','The Joint Congressional Oversight Committee\'s power to approve implementing rules','The fixing of collection districts'],2,'Delegating the fixing of revenue targets with standards was valid. A post-enactment legislative veto over implementing rules violated separation of powers.','N'),
idq('IV-A','What test determines whether a tax is for a public purpose by asking if the statute promotes the public interest rather than private advantage?','Public purpose test (Pascual v. Secretary of Public Works)',['pascual','public purpose','public interest'],'Pascual: public revenues can only be spent for public purposes; an appropriation for private property is void.','N, B'),
en('IV-A','Enumerate the inherent limitations on the power of taxation.',['Public purpose','International comity','Non-delegation of the taxing power (inherently legislative)','Exemption of government entities, agencies and instrumentalities','Situs or territoriality'],'Mnemonic PINES. The 2009 Bar suggested answer lists only four (leaving out government exemption); your syllabus and notes list five.','Q, B, S, N'),
en('IV-A','Enumerate the exceptions to the rule that the power to tax cannot be delegated.',['Delegation to local government units (Sec. 5, Art. X)','Delegation to the President of tariff powers (Sec. 28(2), Art. VI)','Delegation to the President of emergency powers (Sec. 23(2), Art. VI)','Delegation to administrative agencies of the power to fill in details'],'Congress cannot delegate the determination of the subject, rate, exemptions, and manner of collection.','B, N'),

// ---------- IV-B. CONSTITUTIONAL LIMITATIONS ----------
tf('IV-B','The exemption of charitable institutions under Sec. 28(3), Art. VI covers income tax.',false,'CIR v. CA & YMCA: it covers only property taxes on lands, buildings and improvements actually, directly and exclusively used for the stated purposes.','N, Q'),
tf('IV-B','A charitable hospital that accepts paying patients automatically loses its real property tax exemption over the entire property.',false,'Lung Center: what matters is actual, direct and exclusive use. Portions leased to private parties or used commercially are taxable; portions used for charitable purposes remain exempt.','N'),
tf('IV-B','Under Art. XIV, Sec. 4(3), the exemption of non-stock, non-profit educational institutions depends on the source of the income, not its use.',false,'De La Salle University (2016); De La Salle Lipa (2025): what matters is that the revenues are used actually, directly and exclusively for educational purposes, regardless of source.','N'),
tf('IV-B','A law exempting only doctors and lawyers from VAT, while other professionals remain taxable, violates equal protection.',true,'2004 Bar. Professionals form one class; singling out some members of the class without substantial distinction is invalid classification.','Q'),
tf('IV-B','A license fee imposed as a condition for the distribution of bibles by a non-profit religious society violates religious freedom.',true,'American Bible Society v. City of Manila: the power to tax the exercise of a privilege is the power to suppress its enjoyment.','N, B'),
tf('IV-B','Imposing VAT on the sale of religious articles by a religious organization violates the free exercise clause.',false,'Tolentino v. Secretary of Finance: a generally applicable sales tax is not a license tax on the exercise of religion.','N, B'),
tf('IV-B','A revenue law must be substantially the same as the bill that originated in the House of Representatives.',false,'Tolentino v. Secretary of Finance: only the revenue bill must originate in the House; the Senate may propose amendments that rewrite it completely.','N, B'),
tf('IV-B','The grant of a tax exemption requires the concurrence of a majority of all the Members of Congress.',true,'Sec. 28(4), Art. VI. Withdrawal of an exemption requires only a relative majority.','B'),
tf('IV-B','A law granting a five-year unilateral tax exemption may be repealed before the five years expire without violating the non-impairment clause.',true,'2004 and 1997 Bar. A unilateral or gratuitous exemption is not a contract; it may be withdrawn at will. Only an exemption granted for valuable consideration in a contract is protected.','Q, N'),
mcq('IV-B','The constitutional exemption of charitable institutions, churches, and similar entities covers:',['All kinds of taxes','Income tax only','Value-added tax only','Real property tax only'],3,'2006 Bar. What is exempted is the property actually, directly and exclusively used, so only property taxes.','Q'),
mcq('IV-B','A non-stock, non-profit university leases part of its building to a bank. Which is correct?',['The whole building is exempt from real property tax','Only the leased portion is subject to real property tax','The whole building becomes taxable','The rental income is always exempt from income tax regardless of use'],1,'De La Salle University (2016). The leased portion is not used actually, directly and exclusively for education. Rental income is exempt only if proven to be used for educational purposes.','N, Q'),
en('IV-B','Enumerate the requisites of a valid classification under the equal protection and uniformity clauses.',['It rests on substantial distinctions that make real differences','It is germane to the purpose of the law','It applies not only to present but to future conditions','It applies equally to all members of the same class'],'Ormoc Sugar Co. v. Treasurer of Ormoc City; Tan v. Del Rosario.','N, Q, B'),
en('IV-B','Enumerate what the taxpayer must prove to claim exemption under Sec. 28(3), Art. VI (charitable institutions).',['It is a charitable institution','Its real property is actually, directly and exclusively used for charitable purposes'],'Lung Center of the Philippines v. Quezon City.','N, B'),
df('IV-B','What is uniformity in taxation?','Uniformity means that all taxable articles or kinds of property of the same class are taxed at the same rate, so that the tax operates with the same force and effect wherever the subject is found. It does not forbid classification, as long as the classification is reasonable.',['Same class, same rate','Same force and effect wherever the subject is found','Allows reasonable classification','Churchill v. Concepcion; British American Tobacco v. Camacho'],'Q, B'),

// ---------- V. CONSTRUCTION ----------
tf('V','In case of doubt, tax statutes are construed strictly against the government and liberally in favor of the taxpayer.',true,'Luzon Stevedoring v. Trinidad; Petron v. CIR (2023). The imposition of a tax cannot be presumed.','N, B'),
tf('V','The rule of strict construction against the government also applies when the taxpayer claims an exemption.',false,'Exemptions are construed strictly against the taxpayer. The two rules apply to different situations.','N, B'),
tf('V','Provisions intended for the security of the citizen or to ensure equality of taxation are generally mandatory.',true,'Roxas v. Rafferty: protective provisions are mandatory; those for the guidance of officers are merely directory.','N'),
tf('V','A taxpayer need not prove that it is not subject to tax if it is not expressly enumerated among the taxable subjects; the BIR bears the burden to show it is taxable.',true,'Petron Corp. v. CIR (2023).','N, B'),
mcq('V','Which statement is NOT correct? (2012 Bar)',['In case of doubt, tax statutes are construed strictly against the government','A successor CIR is not bound by a predecessor\'s construction if a different one should be given','Reversal of a ruling is generally not retroactive if prejudicial to the taxpayer','A CIR memorandum circular imposing penalties need not be published because it has the force of law'],3,'A circular imposing penalties must be published; it is not operative until due notice may be presumed (CIR v. PAL, 2009).','Q'),

// ---------- VI. EXEMPTIONS ----------
tf('VI','There is a vested right in a tax exemption once granted by statute.',false,'Republic v. Caguioa: a statutory exemption is a mere privilege that may be withdrawn at will.','N'),
tf('VI','A law condoning unpaid taxes may be interpreted to authorize refund of taxes already paid.',false,'Surigao Consolidated Mining v. Collector: condonation, like exemption, is strictly construed and cannot be extended to refunds.','N'),
tf('VI','Tax refunds are construed strictly against the taxpayer, like tax exemptions.',true,'Brewery Properties v. CIR (2023); Paseo Realty. But a refund based on the government\'s erroneous interpretation is construed against the government (CIR v. San Miguel, 2019).','N, B'),
tf('VI','Criminal violations already filed in court may be compromised by the CIR.',false,'Sec. 204(A), NIRC: all criminal violations may be compromised except those already filed in court and those involving fraud.','C, Q'),
tf('VI','A tax amnesty, like a tax exemption, is never favored nor presumed.',true,'CIR v. Marubeni (2001): amnesty terms are construed strictly against the taxpayer.','N'),
tf('VI','Income of an exempt organization from its property is exempt if used for its exempt purposes.',false,'CIR v. CA & YMCA; last paragraph of Sec. 30, NIRC: income from properties and from activities for profit is taxable regardless of disposition.','N, C'),
mcq('VI','The minimum compromise rate for a case based on financial incapacity is:',['10% of the basic assessed tax','25% of the basic assessed tax','40% of the basic assessed tax','50% of the basic assessed tax'],0,'Sec. 204(A), NIRC: 10% for financial incapacity; 40% for other cases (doubtful validity).','C, B'),
mcq('VI','The CIR may abate or cancel a tax liability when:',['The taxpayer is financially incapable of paying','The tax appears unjustly or excessively assessed','The taxpayer offers 40% of the basic tax','The case is already filed in court'],1,'Sec. 204(B): abatement when the tax is unjustly or excessively assessed, or collection costs do not justify collection. Financial incapacity is a ground for compromise, not abatement.','C, N'),
en('VI','Enumerate the grounds for compromise of a tax liability under Sec. 204(A), NIRC.',['A reasonable doubt as to the validity of the claim against the taxpayer exists','The financial position of the taxpayer demonstrates a clear inability to pay the assessed tax'],'Compromise is subject to the minimum rates of 10% and 40%; amounts above P1 million or offers below the minimum need approval of the Evaluation Board.','C, B'),
en('VI','Enumerate the grounds for abatement or cancellation of a tax liability under Sec. 204(B), NIRC.',['The tax or any portion appears to be unjustly or excessively assessed','The administration and collection costs involved do not justify collection of the amount due'],'Qatar Airways v. CIR (2020); CIR v. Pacific Hub (2024).','C, N'),
df('VI','Define tax amnesty and distinguish it from tax exemption.','A tax amnesty is a general pardon or the intentional overlooking by the State of its authority to impose penalties on persons guilty of evasion or violation of tax laws, giving them a chance to start with a clean slate. It looks to the past. A tax exemption is an immunity from a tax burden that others are subject to, and generally looks to the future.',['Amnesty: waiver of the right to collect and to penalize past violations','Exemption: freedom from a charge going forward','Both strictly construed against the taxpayer (CIR v. Marubeni; BIR v. Cagang)'],'N'),

// ---------- VII. OTHER DOCTRINES ----------
tf('VII','Courts may issue an injunction to restrain the collection of national internal revenue taxes.',false,'Sec. 218, NIRC. The exception is the CTA, which may suspend collection under Sec. 11 of RA 1125 if collection jeopardizes the government or the taxpayer.','C, N'),
tf('VII','The prohibition on injunctions against tax collection applies equally to local taxes.',false,'Angeles City v. Angeles Electric (2010), cited in a 2024 Bar answer: the prohibition applies only to national internal revenue taxes.','Q'),
tf('VII','Where the law provides no prescriptive period to assess a tax, the government\'s right to assess is imprescriptible.',true,'CIR v. Ayala Securities (1980): limitations on the government\'s right to assess are not presumed.','N, B'),
tf('VII','The doctrine of equitable recoupment applies in the Philippines.',false,'Collector v. University of Santo Tomas: it is a common-law doctrine not adopted here.','N'),
tf('VII','Reciprocity under Sec. 104 of the NIRC may be partial, covering only some transfer taxes.',false,'CIR v. Fisher: reciprocity must be total; it is "total or none at all."','N'),
tf('VII','Direct double taxation is prohibited by an express provision of the Constitution.',false,'There is no express constitutional prohibition. Double taxation is not favored but is valid unless it violates equal protection or uniformity (Villanueva v. City of Iloilo).','B, Q'),
tf('VII','A 20% final tax on interest from a time deposit funded by salary already taxed is prohibited double taxation.',false,'2017 Bar. Different subject matter: the salary and the interest. At most it is indirect double taxation, which is allowed.','Q'),
tf('VII','When a doctrine of the Supreme Court is overruled, the new doctrine is applied prospectively to parties who relied in good faith on the old one.',true,'Phil. Mining Development Corp. v. CIR (2021); San Miguel Corp. v. CIR (2023).','N'),
tf('VII','A taxpayer may invoke a BIR ruling issued to another taxpayer in its favor.',false,'San Miguel Corp. v. CIR (2023): only the taxpayer who sought the ruling may invoke it.','B'),
mcq('VII','How long does the government generally have to assess internal revenue taxes when a return is filed on time?',['Two years from filing','Three years from the last day prescribed for filing','Five years from filing','Ten years from discovery'],1,'Sec. 203, NIRC. A return filed early is deemed filed on the last day. Ten years from discovery applies to false or fraudulent returns or failure to file (Sec. 222(a)).','C, B'),
mcq('VII','The prescriptive period to assess in case of a false or fraudulent return with intent to evade is:',['Three years from filing','Five years from filing','Ten years from discovery of the falsity or fraud','None; it is imprescriptible'],2,'Sec. 222(a). The deliberate error test applies to "false" returns (Pilipinas Shell v. CIR, 2021).','C, N'),
en('VII','Enumerate the elements of direct duplicate (prohibited) double taxation.',['Same subject matter or property','Same purpose','Same taxing authority','Same taxing jurisdiction','Same taxing period','Same kind or character of tax'],'Star Appliance v. City of Manila; Swedish Match v. Treasurer. If any element is missing, it is indirect double taxation.','N, B, Q'),
en('VII','Enumerate the requisites of a taxpayer\'s suit.',['Public funds derived from taxation are disbursed by a political subdivision or instrumentality, and in doing so a law is violated or an irregularity is committed','The petitioner is directly affected by the alleged act'],'Bagatsing v. San Juan; Mamba v. Lara. The direct injury requirement may be relaxed for issues of transcendental importance.','N, B'),
en('VII','Enumerate the exceptions to the non-retroactivity of BIR rulings under Sec. 246, NIRC.',['The taxpayer deliberately misstates or omits material facts','The facts gathered by the BIR are materially different from those on which the ruling was based','The taxpayer acted in bad faith'],'Otherwise, a revocation, modification or reversal prejudicial to the taxpayer is not retroactive.','C, B'),
en('VII','Enumerate the modes of eliminating or mitigating double taxation.',['Tax exemption','Tax credit','Tax deduction','Reciprocity','Reduction of rates under tax treaties','Tax discount'],'CIR v. SC Johnson discusses the exemption and credit methods under treaties.','B, N'),

// ---------- VIII-A. BIR ----------
tf('VIII-A','The power to interpret the NIRC is under the exclusive and original jurisdiction of the CIR, subject to review by the Secretary of Finance.',true,'Sec. 4, NIRC; Philamlife v. Secretary of Finance (2014).','C, N'),
tf('VIII-A','The CIR may delegate to a regional director the power to issue rulings of first impression.',false,'Sec. 7(b), NIRC: rulings of first impression or reversing existing rulings cannot be delegated.','C, B'),
tf('VIII-A','The Department of Justice, not the BIR, determines the amount of estate tax due.',false,'Marcos v. CA (1997): assessment and collection are executive functions of the BIR; its assessments are presumed correct.','N'),
tf('VIII-A','Courts may never review the CIR\'s discretionary power to abate a tax.',false,'CIR v. Pacific Hub (2024): courts may intervene when the CIR acts beyond statutory authority, unconstitutionally, or with grave abuse.','N'),
en('VIII-A','Enumerate the powers of the Commissioner that may NOT be delegated (Sec. 7, NIRC).',['The power to recommend the promulgation of rules and regulations by the Secretary of Finance','The power to issue rulings of first impression or to reverse, revoke or modify any existing ruling','The power to compromise or abate any tax liability (with the regional evaluation board exception)','The power to assign or reassign internal revenue officers to establishments where excisable articles are produced or kept'],'Regional evaluation boards may compromise assessments of P500,000 or less and minor criminal violations.','C, B'),
en('VIII-A','Enumerate the powers and duties of the BIR under Sec. 2, NIRC.',['Assess and collect all national internal revenue taxes, fees, and charges','Enforce all forfeitures, penalties and fines connected therewith','Execute judgments in cases decided in its favor by the CTA and ordinary courts','Administer the supervisory and police powers conferred by the Code or special laws'],'The BIR is under the supervision and control of the Department of Finance.','C, B'),
mcq('VIII-A','A taxpayer gets an adverse ruling from the Secretary of Finance reviewing a BIR ruling. Where should it appeal?',['Court of Appeals under Rule 43','Regional Trial Court','Court of Tax Appeals','Supreme Court directly'],2,'2014 Bar; Philamlife v. Secretary of Finance: it is an "other matter" arising under the NIRC within the CTA\'s appellate jurisdiction.','Q, N'),

// ---------- VIII-B. CTA ----------
tf('VIII-B','The CTA is of the same level as the Court of Appeals.',true,'RA 1125 as amended by RA 9282.','N'),
tf('VIII-B','The CTA consists of a Presiding Justice and eight Associate Justices, sitting en banc or in three divisions.',true,'RA 9503. Quorum: five for en banc, two for a division.','N'),
tf('VIII-B','A taxpayer may appeal a CTA Division decision directly to the CTA en banc without first filing a motion for reconsideration.',false,'2015 Bar; City of Manila v. Cosmos Bottling: a motion for reconsideration or new trial before the Division is indispensable.','Q, B'),
tf('VIII-B','The assessment itself, not the CIR\'s decision on the protest, is what is appealed to the CTA.',false,'CIR v. V.Y. Domingo Jewellers (2019): "decisions" means the CIR\'s decision on the protest, not the assessment.','N'),
tf('VIII-B','Disputes solely between government agencies over tax assessments go to the CTA.',false,'DOE v. CIR (2023): under PD 242, they go to administrative settlement by the Secretary of Justice, Solicitor General, or Government Corporate Counsel.','N, B'),
tf('VIII-B','The CTA may rule on an issue not raised by the parties if it is related to the principal issue and needs no additional evidence.',true,'CIR v. Marilyn Development (2025); CIR v. Standard Insurance (2025); Rule 14, Sec. 1, RRCTA.','N'),
tf('VIII-B','The CTA may take cognizance of cases directly challenging the validity of a tax law or regulation.',true,'Banco de Oro v. Republic (2016); CIR v. CTA (2021). Local tax cases are an exception.','B, N'),
tf('VIII-B','An acquittal in a criminal case for failure to file a return automatically extinguishes the civil liability for the tax.',false,'People v. Gernale (2023), 2024 Bar: the duty to pay is imposed by statute independently; Sec. 254 also says acquittal does not bar a civil suit.','Q'),
mcq('VIII-B','Under People v. Mendez, which court has exclusive original jurisdiction over a criminal tax case where the tax claimed is P800,000?',['Court of Tax Appeals Division','Regional Trial Court','Proper first-level court','CTA en banc'],2,'With RA 11576, cases below P1 million fall under first-level courts, with appeal to the RTC. P1 million or more stays with the CTA.','N, B'),
mcq('VIII-B','How many days does a taxpayer have to appeal to the CTA after receipt of the CIR\'s decision denying a protest?',['15 days','30 days','60 days','180 days'],1,'Sec. 228, NIRC; Sec. 11, RA 1125. The 180-day period is the period for the CIR to act on the protest.','C, B'),
mcq('VIII-B','When may the CTA suspend the collection of national internal revenue taxes?',['Whenever the taxpayer files an appeal','When collection may jeopardize the interest of the government or the taxpayer','Only when the tax is below P1 million','Never, because of Sec. 218 of the NIRC'],1,'Sec. 11, RA 1125; Pacquiao v. CTA. The CTA may require a cash deposit or bond of up to double the amount.','N, Q'),
en('VIII-B','Enumerate the conditions for the CTA to suspend collection of internal revenue taxes.',['An appeal or petition for review is pending before the CTA','Collection may jeopardize the interest of the government and/or the taxpayer','The taxpayer deposits the amount claimed or files a surety bond of not more than double the amount'],'The CTA may dispense with the bond in proper cases (Pacquiao v. CTA).','Q, B, N'),
idq('VIII-B','What law reorganized the CTA, raised it to the level of the CA, and gave it criminal jurisdiction?','Republic Act No. 9282',['9282'],'RA 9503 later added three more justices and a third division.','N'),

// ---------- IT-A. NATURE AND TAXABILITY OF INCOME ----------
tf('IT-A','Income from illegal activities, such as an illegal gambling den, is not taxable.',false,'2023 Bar. All income from whatever source is taxable unless exempted (Sec. 32(A)); illegally acquired income is realized gain.','Q, C'),
tf('IT-A','Hotel room charges received by a travel agency in trust for foreign tour operators form part of its gross receipts.',false,'CIR v. Tours Specialists: monies entrusted that do not belong to the taxpayer are not part of its gross receipts.','N'),
tf('IT-A','Membership fees and assessment dues collected by non-profit recreational clubs for upkeep are income subject to income tax.',false,'Association of Non-Profit Clubs v. BIR (2019): they are capital infusions, not income, because there is no realized gain.','N'),
tf('IT-A','Under the accrual method, an expense may be deducted only in the year it is actually paid.',false,'CIR v. Isabela Cultural Corp. (2007): under the all-events test, it is deductible when the liability is fixed and determinable, regardless of payment.','N'),
tf('IT-A','A debtor whose debt is cancelled by the creditor in exchange for services realizes income to that extent.',true,'2014 Bar: the cancellation is compensation for services (Sec. 50, RR 2-40).','Q'),
df('IT-A','Distinguish income from capital.','Capital is a fund; income is a flow. Capital is wealth existing at one point in time; income is the service of that wealth, the gain derived from labor, capital, or both, over a period of time. A mere return of capital is not income.',['Capital = fund, wealth, the tree','Income = flow, service of wealth, the fruit','Return of capital is not taxable','Madrigal v. Rafferty; ANPC v. BIR'],'N, B'),
en('IT-A','Enumerate the requisites of the all-events test under the accrual method.',['The right to income or liability to pay is fixed','The amount can be determined with reasonable accuracy'],'CIR v. Isabela Cultural Corp.','N'),

// ---------- IT-B. CLASSIFICATION OF INCOME ----------
tf('IT-B','Taxing compensation income on a gross basis while businessmen and professionals are taxed on net income violates equal protection.',false,'Sison v. Ancheta: compensation earners have practically no overhead; the classification rests on substantial distinctions.','N'),
tf('IT-B','Royalties earned in the active pursuit of a corporation\'s primary business are passive income subject to final tax.',false,'Iconic Beverages v. CIR (CTA 2015): income from the active conduct of business is not passive; it forms part of gross income subject to regular corporate tax.','N'),
en('IT-B','Enumerate at least five items of gross income under Sec. 32(A), NIRC.',['Compensation for services','Gross income from trade, business or exercise of a profession','Gains from dealings in property','Interests','Rents','Royalties','Dividends','Annuities','Prizes and winnings','Pensions','Partner\'s distributive share from a GPP'],'The list is not exclusive: gross income means all income from whatever source.','C'),

// ---------- IT-C. GLOBAL / SCHEDULAR ----------
tf('IT-C','Under a schedular system, all income is added together and taxed under one set of rates.',false,'That describes a global system. A schedular system taxes different types of income at different rates.','B, N'),
tf('IT-C','The Philippine system is more schedular for individuals and more global for corporations.',true,'It is a semi-schedular or semi-global system.','B'),
both('IT-C','A global system is more equitable because the tax burden responds to the taxpayer\'s total ability to pay.','A schedular system is easier to administer because tax is confined to each type of income or transaction.','TT','Both are standard comparisons of the two systems.','B'),

// ---------- IT-D. KINDS OF TAXPAYERS ----------
tf('IT-D','A general professional partnership is a taxable entity subject to corporate income tax.',false,'Sec. 26, NIRC; Tan v. Del Rosario: a GPP is a pass-through; the partners are taxed individually on their distributive shares.','C, N, Q'),
tf('IT-D','A reinsurance pool formed by insurance companies, even without retaining profit, is taxable as a corporation.',true,'Afisco Insurance v. CA: the pool is an unregistered partnership or association for profit and is taxable as a corporation.','N'),
tf('IT-D','A nonresident alien who stays in the Philippines for an aggregate of exactly 180 days in a calendar year is deemed engaged in trade or business.',false,'Sec. 25(A)(1) requires more than 180 days. At exactly 180 days, the alien is not deemed engaged in business.','C, B'),
tf('IT-D','A resident alien is taxable on income from sources within and without the Philippines.',false,'Sec. 23(D): an alien, resident or not, is taxable only on Philippine-source income.','C'),
tf('IT-D','A Filipino seaman on a foreign vessel engaged exclusively in international trade is treated as an overseas contract worker.',true,'2002 Bar; Sec. 23(C). He is taxable only on income from sources within the Philippines.','C, Q'),
tf('IT-D','Appointing an independent distributor that buys and sells in its own name makes a foreign corporation "doing business" in the Philippines.',false,'2011 Bar (Aplets); RA 7042 as amended: a distributor that transacts in its own name and for its own account is excluded.','Q, B'),
tf('IT-D','The source of compensation for personal services is the place where the services are performed.',true,'Sec. 42(A)(3); CIR v. Baier-Nickel; 2012 Bar.','C, N, Q'),
tf('IT-D','A domestic corporation is taxable on income from sources within and without the Philippines.',true,'Sec. 23(E). Foreign corporations, resident or not, are taxable only on Philippine-source income (Sec. 23(F)).','C'),
tf('IT-D','When a foreign head office earns dividends from a Philippine company independently of its local branch, the head office is treated as a nonresident foreign corporation for that income.',true,'Marubeni v. CIR: the transaction is that of the head office, not the branch.','N'),
tf('IT-D','Foreign currency deposits under RA 6426 are exempt from estate tax even if the depositor was a resident.',true,'CIR v. Estate of Romig (2024): the exemption from "any and all taxes whatsoever" applies regardless of residency.','N'),
mcq('IT-D','Pierre, a Frenchman, stayed in the Philippines for more than 180 days in 2010 and earned P3 million from investments. His status for 2010 is:',['Nonresident alien not engaged in trade or business','Nonresident alien engaged in trade or business','Resident alien not engaged in trade or business','Resident alien engaged in trade or business'],1,'2011 Bar. Sec. 25(A)(1): an aggregate stay of more than 180 days makes him a nonresident alien deemed doing business.','Q, C'),
mcq('IT-D','Which of the following does NOT constitute "doing business" under the Foreign Investments Act?',['Soliciting orders and service contracts','Opening a liaison office or branch','Mere investment as a shareholder in a domestic corporation','Participating in the management of a domestic business'],2,'Mere investment as a shareholder, having a nominee director, and an independent distributor are excluded.','N, B'),
mcq('IT-D','Which entity is taxed like an individual under the NIRC?',['Joint-stock company','Estate under judicial settlement','Insurance company','Joint account (cuentas en participación)'],1,'Estates and trusts are taxed like individuals (Sec. 60). The others are included in "corporation" under Sec. 22(B).','C, B'),
mcq('IT-D','A nonresident alien NOT engaged in trade or business is generally taxed on income from Philippine sources at:',['Graduated rates on net income','25% final tax on gross income','15% final tax on gross income','Exempt'],1,'Sec. 25(B). Capital gains on shares of a domestic corporation and real property follow Secs. 24(C) and (D).','C, N'),
mcq('IT-D','Which is included in the term "corporation" under Sec. 22(B), NIRC?',['General professional partnership','Joint venture for a construction project','Business partnership, however created','Consortium under a petroleum service contract'],2,'Partnerships, no matter how created or organized, are corporations for tax purposes. GPPs and the two types of joint ventures are excluded.','C'),
idq('IT-D','What term applies to a foreign corporation engaged in trade or business within the Philippines?','Resident foreign corporation',['resident foreign'],'Sec. 22(H). One not engaged in trade or business is a nonresident foreign corporation (Sec. 22(I)).','C'),
idq('IT-D','What is the minimum number of days an OCW must be outside the Philippines in a taxable year to be considered physically present abroad most of the time?','183 days',['183'],'Sec. 2, RR 1-79, as cited in the BarOps reviewer.','B'),

// ===== IT-D: KINDS OF INCOME TAXPAYERS =====
E('IT-D','Mr. K, Korean consultant','Original · patterned after 2011 Bar',
'Mr. K, a Korean national, arrived in the Philippines on February 1, 2025 to supervise a client\'s project and left for good on September 15, 2025. While here, he received consulting fees from a Philippine company for work he did in Makati. He also received dividends from a Korean corporation that earns no income from Philippine sources.',

[['(a) Answer','Mr. K is a nonresident alien engaged in trade or business in the Philippines.'],
 ['Basis and application','He is not a resident alien: he came for a definite purpose and period, like a sojourner. But under Sec. 25(A)(1), a nonresident alien who stays more than 180 days in the aggregate in a calendar year is deemed doing business here. From February 1 to September 15, 2025 he stayed 227 days.'],
 ['(b) Answer','Only the consulting fees. An alien, resident or not, is taxed only on Philippine-source income (Sec. 23(D)). Fees for services performed in Makati are Philippine-source (Sec. 42(A)(3); CIR v. Baier-Nickel: the source is where the service is performed). Dividends from a Korean corporation with no Philippine income are foreign-source and not taxable here.']],
['Classification: NRA engaged in trade or business','Cites the more-than-180-day rule, Sec. 25(A)(1)','Explains why he is not a resident alien','Aliens taxed only on Philippine-source income, Sec. 23(D)','Place of performance decides the source of service income'],
[C.s25A,C.s23,C.s42]),

E('IT-D','Pierre de Savigny, Frenchman','2011 Bar · QuAMTO',

'What is Pierre\'s taxable status for 2010? Explain.',
[['Answer','Pierre is a nonresident alien engaged in trade or business in the Philippines for 2010.'],
 ['Basis','Sec. 25(A)(1) deems a nonresident alien who stays in the Philippines for an aggregate of more than 180 days during any calendar year as doing business here. The count is aggregate, so his absence during the tour does not break it.'],
 ['Application','From January 1 to July 31 alone he was here for 212 days, and he added time from November 6 to December 31. He exceeded 180 days, so he is taxed like a resident alien on his Philippine-source income, at graduated rates on taxable income.']],
['Aggregate stay, not continuous stay','More than 180 days','Status: NRA engaged in trade or business','Taxed only on Philippine-source income'],
[C.s25A,C.s23]),

'Determine whether each one\'s 2017 compensation is taxable in the Philippines and whether each must file a return.',

 ['Klaus','Resident alien: taxable on Philippine-source income (Sec. 23(D)). His Makati salary is Philippine-source because the services are performed here. Same rule on filing.'],

 ['Kamilo','Nonresident citizen. His salary is for services performed in Taiwan, so it is foreign-source and not taxable. Payment to his wife in Manila in pesos does not change the source; the place of performance controls (Sec. 42).'],
 ['Karen','January to her return: nonresident citizen, foreign-source salary, not taxable. From her return in June: resident citizen again, taxable on all income; she files unless she qualifies for substituted filing.']],
